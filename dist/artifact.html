03ctr>\u003ctd>\u003cstrong>ElastiCache\u003c/strong>\u003c/td>\u003ctd>Managed Redis\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>SQS / SNS\u003c/strong>\u003c/td>\u003ctd>Queues and pub/sub\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Lambda\u003c/strong>\u003c/td>\u003ctd>Serverless functions (image resize, webhooks)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>ECS / EKS\u003c/strong>\u003c/td>\u003ctd>Run containers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>ALB\u003c/strong>\u003c/td>\u003ctd>Load balancer with health checks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>IAM\u003c/strong>\u003c/td>\u003ctd>Users, roles, permissions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>CloudWatch\u003c/strong>\u003c/td>\u003ctd>Logs, metrics, alarms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Route 53\u003c/strong>\u003c/td>\u003ctd>DNS\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","t":"service use ec2 virtual servers s3 file storage (uploads, backups, static sites) + cloudfront cdn rds / aurora managed mysql/postgres with backups and read replicas elasticache managed redis sqs / sns queues and pub/sub lambda serverless functions (image resize, webhooks) ecs / eks run containers alb load balancer with health checks iam users, roles, permissions cloudwatch logs, metrics, alarms route 53 dns"},{"id":"devops-t46728","n":14,"q":"Kubernetes basics: Pod, Deployment, Service, Ingress","qh":"Kubernetes basics: Pod, Deployment, Service, Ingress","level":"mid","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>Pod\u003c/strong>: smallest unit; one or more containers sharing network and storage.\u003c/li>\u003cli>\u003cstrong>Deployment\u003c/strong>: keeps N replicas of a pod running and does \u003cstrong>rolling updates\u003c/strong> and rollbacks.\u003c/li>\u003cli>\u003cstrong>Service\u003c/strong>: stable IP/DNS name that load-balances across pods.\u003c/li>\u003cli>\u003cstrong>Ingress\u003c/strong>: HTTP routing from outside (domains, paths, TLS).\u003c/li>\u003cli>\u003cstrong>ConfigMap / Secret\u003c/strong>: configuration and secrets.\u003c/li>\u003cli>\u003cstrong>HPA\u003c/strong>: scale pods automatically on CPU/memory/custom metrics.\u003c/li>\u003cli>\u003cstrong>Liveness probe\u003c/strong> (restart if dead) vs \u003cstrong>readiness probe\u003c/strong> (don't send traffic until ready).\u003c/li>\u003c/ul>","t":"pod : smallest unit; one or more containers sharing network and storage. deployment : keeps n replicas of a pod running and does rolling updates and rollbacks. service : stable ip/dns name that load-balances across pods. ingress : http routing from outside (domains, paths, tls). configmap / secret : configuration and secrets. hpa : scale pods automatically on cpu/memory/custom metrics. liveness probe (restart if dead) vs readiness probe (don't send traffic until ready)."},{"id":"devops-1k83rm","n":15,"q":"Horizontal vs vertical scaling","qh":"Horizontal vs vertical scaling","level":"basic","hot":true,"a":"\u003cul>\u003cli>\u003cstrong>Vertical (scale up)\u003c/strong>: bigger machine (more CPU/RAM). Simple, but has a ceiling and usually downtime.\u003c/li>\u003cli>\u003cstrong>Horizontal (scale out)\u003c/strong>: more machines behind a load balancer. Near-unlimited and fault tolerant, but the app must be \u003cstrong>stateless\u003c/strong> (sessions in Redis, files in S3).\u003c/li>\u003c/ul>","t":"vertical (scale up) : bigger machine (more cpu/ram). simple, but has a ceiling and usually downtime. horizontal (scale out) : more machines behind a load balancer. near-unlimited and fault tolerant, but the app must be stateless (sessions in redis, files in s3)."}]},{"title":"Monitoring","intro":"","qs":[{"id":"devops-etplom","n":16,"q":"How do you monitor a production application?","qh":"How do you monitor a production application?","level":"mid","hot":true,"a":"\u003cul>\u003cli>\u003cstrong>Logs\u003c/strong>: structured JSON logs with request ID, shipped to ELK / Loki / CloudWatch.\u003c/li>\u003cli>\u003cstrong>Metrics\u003c/strong>: request rate, error rate, latency (p95/p99), CPU, memory, queue length; Prometheus + Grafana or Datadog.\u003c/li>\u003cli>\u003cstrong>Traces\u003c/strong>: follow one request across services (OpenTelemetry, Jaeger).\u003c/li>\u003cli>\u003cstrong>Error tracking\u003c/strong>: Sentry.\u003c/li>\u003cli>\u003cstrong>Alerts\u003c/strong> on symptoms users feel (error rate, latency, failed payments), with on-call runbooks.\u003c/li>\u003cli>\u003cstrong>Uptime checks\u003c/strong> and health endpoints.\u003c/li>\u003c/ul>\n\u003cdiv class=\"callout callout-say\">\u003cspan class=\"callout-label\">Say it like this\u003c/span>\u003cp>&quot;We track the RED metrics (rate, errors, duration) per endpoint, alert on p99 latency and 5xx rate, and every log line carries a correlation ID so we can trace one request end to end.&quot;\u003c/p>\u003c/div>","t":"logs : structured json logs with request id, shipped to elk / loki / cloudwatch. metrics : request rate, error rate, latency (p95/p99), cpu, memory, queue length; prometheus + grafana or datadog. traces : follow one request across services (opentelemetry, jaeger). error tracking : sentry. alerts on symptoms users feel (error rate, latency, failed payments), with on-call runbooks. uptime checks and health endpoints. say it like this \"we track the red metrics (rate, errors, duration) per endpoint, alert on p99 latency and 5xx rate, and every log line carries a correlation id so we can trace one request end to end.\""}]}],"count":16},{"id":"payments","title":"Payment Gateway","short":"Payments","color":"#8b5cf6","blurb":"Razorpay, Stripe, PayU and Cashfree integration flows, signature verification, webhooks, idempotency, refunds, reconciliation, subscriptions and the failure scenarios interviewers love.","cheats":["Flow: \u003cmark>create order on server → open checkout on client → verify signature on server → confirm via webhook\u003c/mark>.","\u003cstrong>Never trust the frontend\u003c/strong> for amount or success. The amount comes from your DB; success comes from a verified signature or webhook.","Verify signatures with \u003cstrong>HMAC-SHA256\u003c/strong> and a \u003cstrong>timing-safe compare\u003c/strong>.","Webhooks: verify signature on the \u003cstrong>raw body\u003c/strong>, return \u003cstrong>2xx fast\u003c/strong>, process in a queue, handle \u003cstrong>duplicates and out-of-order\u003c/strong> events.","\u003cstrong>Idempotency\u003c/strong>: unique key per payment attempt + DB unique constraint → no double charges, no double fulfilment.","Store money as \u003cstrong>integers in the smallest unit\u003c/strong> (paise/cents), never floats.","Payment states: \u003ccode>created → pending → authorized → captured → refunded / failed\u003c/code>. Use a state machine.","\u003cstrong>Reconciliation\u003c/strong> job compares your DB with the gateway's records daily and fixes &quot;pending&quot; orders.","PCI DSS: don't store card numbers; use hosted checkout / tokenization so card data never touches your server."],"sections":[{"title":"Integration Flow","intro":"","qs":[{"id":"payments-13hks2","n":1,"q":"Explain the end-to-end payment flow (Razorpay / Stripe).","qh":"Explain the end-to-end payment flow (Razorpay / Stripe).","level":"mid","hot":true,"a":"\u003col>\u003cli>User clicks \u003cstrong>Pay\u003c/strong>. Frontend calls your backend \u003ccode>POST /orders\u003c/code>.\u003c/li>\u003cli>Backend calculates the amount \u003cstrong>from the DB\u003c/strong> (cart, coupon, tax), creates an order in your DB (\u003ccode>status = created\u003c/code>), then creates an \u003cstrong>order / PaymentIntent\u003c/strong> at the gateway and stores its ID.\u003c/li>\u003cli>Backend returns the gateway order ID / client secret to the frontend.\u003c/li>\u003cli>Frontend opens the \u003cstrong>gateway checkout\u003c/strong> (Razorpay Checkout / Stripe Elements). Card, UPI or netbanking data goes \u003cstrong>directly to the gateway\u003c/strong>.\u003c/li>\u003cli>On success the gateway returns \u003ccode>payment_id\u003c/code>, \u003ccode>order_id\u003c/code>, \u003ccode>signature\u003c/code> to the frontend, which sends them to your backend.\u003c/li>\u003cli>Backend \u003cstrong>verifies the signature\u003c/strong> with the secret key, marks the order \u003ccode>paid\u003c/code> (idempotently).\u003c/li>\u003cli>Gateway also sends a \u003cstrong>webhook\u003c/strong> (\u003ccode>payment.captured\u003c/code>). Your server verifies it and updates the order if not already done. \u003cmark>The webhook is the source of truth\u003c/mark> because the user may close the browser before step 5.\u003c/li>\u003cli>Fulfil the order (email, inventory, invoice) in a queued job.\u003c/li>\u003c/ol>\n\u003cdiv class=\"callout callout-say\">\u003cspan class=\"callout-label\">Say it like this\u003c/span>\u003cp>&quot;The client only starts the payment. The amount is decided on the server, success is decided by signature verification and the webhook, and fulfilment is idempotent.&quot;\u003c/p>\u003c/div>","t":"user clicks pay . frontend calls your backend post /orders . backend calculates the amount from the db (cart, coupon, tax), creates an order in your db ( status = created ), then creates an order / paymentintent at the gateway and stores its id. backend returns the gateway order id / client secret to the frontend. frontend opens the gateway checkout (razorpay checkout / stripe elements). card, upi or netbanking data goes directly to the gateway . on success the gateway returns payment_id , order_id , signature to the frontend, which sends them to your backend. backend verifies the signature with the secret key, marks the order paid (idempotently). gateway also sends a webhook ( payment.captured ). your server verifies it and updates the order if not already done. the webhook is the source of truth because the user may close the browser before step 5. fulfil the order (email, inventory, invoice) in a queued job. say it like this \"the client only starts the payment. the amount is decided on the server, success is decided by signature verification and the webhook, and fulfilment is idempotent.\""},{"id":"payments-1bvk65","n":2,"q":"How do you verify the Razorpay payment signature?","qh":"How do you verify the Razorpay payment signature?","level":"mid","hot":true,"a":"\u003cp>Razorpay signs \u003ccode>order_id + &quot;|&quot; + payment_id\u003c/code> with your \u003cstrong>key secret\u003c/strong> using HMAC-SHA256.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>js\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-js\">const crypto = require('crypto');\n\nfunction verifyPayment({ razorpay_order_id, razorpay_payment_id, razorpay_signature }) {\n  const expected = crypto\n    .createHmac('sha256', process.env.RAZORPAY_KEY_SECRET)\n    .update(`${razorpay_order_id}|${razorpay_payment_id}`)\n    .digest('hex');\n  return crypto.timingSafeEqual(Buffer.from(expected), Buffer.from(razorpay_signature));\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">$expected = hash_hmac('sha256', $orderId . '|' . $paymentId, config('services.razorpay.secret'));\nif (! hash_equals($expected, $signature)) abort(400, 'Invalid signature');\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"callout callout-warn\">\u003cspan class=\"callout-label\">Watch out\u003c/span>\u003cp>Use \u003ccode>timingSafeEqual\u003c/code> / \u003ccode>hash_equals\u003c/code>, not \u003ccode>===\u003c/code>, to avoid timing attacks. Also check that the \u003ccode>order_id\u003c/code> belongs to \u003cstrong>this user's\u003c/strong> order in your DB. Check lengths before \u003ccode>timingSafeEqual\u003c/code> because it throws if buffers differ in length.\u003c/p>\u003c/div>","t":"razorpay signs order_id + \"|\" + payment_id with your key secret using hmac-sha256. js copy const crypto = require('crypto'); function verifypayment({ razorpay_order_id, razorpay_payment_id, razorpay_signature }) { const expected = crypto .createhmac('sha256', process.env.razorpay_key_secret) .update(`${razorpay_order_id}|${razorpay_payment_id}`) .digest('hex'); return crypto.timingsafeequal(buffer.from(expected), buffer.from(razorpay_signature)); } php copy $expected = hash_hmac('sha256', $orderid . '|' . $paymentid, config('services.razorpay.secret')); if (! hash_equals($expected, $signature)) abort(400, 'invalid signature'); watch out use timingsafeequal / hash_equals , not === , to avoid timing attacks. also check that the order_id belongs to this user's order in your db. check lengths before timingsafeequal because it throws if buffers differ in length."},{"id":"payments-358nir","n":3,"q":"Why must the amount never come from the frontend?","qh":"Why must the amount never come from the frontend?","level":"basic","hot":true,"a":"\u003cp>Anyone can change a request in DevTools or Postman. If your API accepts \u003ccode>amount: 1\u003c/code> from the client, a ₹50,000 order gets paid with ₹1.\u003c/p>\n\u003cp>\u003cmark>Always compute the amount on the server from the DB\u003c/mark>, create the gateway order with it, and after payment \u003cstrong>compare the captured amount and currency\u003c/strong> with your order before marking it paid.\u003c/p>","t":"anyone can change a request in devtools or postman. if your api accepts amount: 1 from the client, a ₹50,000 order gets paid with ₹1. always compute the amount on the server from the db , create the gateway order with it, and after payment compare the captured amount and currency with your order before marking it paid."},{"id":"payments-1r39ka","n":4,"q":"Stripe PaymentIntent flow and 3D Secure / SCA","qh":"Stripe PaymentIntent flow and 3D Secure / SCA","level":"mid","hot":false,"a":"\u003col>\u003cli>Server creates a \u003cstrong>PaymentIntent\u003c/strong> with amount and currency → returns \u003ccode>client_secret\u003c/code>.\u003c/li>\u003cli>Client confirms it with Stripe.js / Elements (\u003ccode>stripe.confirmPayment\u003c/code>).\u003c/li>\u003cli>If the bank needs \u003cstrong>3D Secure\u003c/strong> (SCA, required in EU and for many Indian cards as OTP), Stripe handles the challenge; status becomes \u003ccode>requires_action\u003c/code> then \u003ccode>succeeded\u003c/code>.\u003c/li>\u003cli>Server listens to \u003ccode>payment_intent.succeeded\u003c/code> / \u003ccode>payment_intent.payment_failed\u003c/code> \u003cstrong>webhooks\u003c/strong>.\u003c/li>\u003c/ol>\n\u003cp>Statuses: \u003ccode>requires_payment_method → requires_confirmation → requires_action → processing → succeeded / canceled\u003c/code>.\u003c/p>","t":"server creates a paymentintent with amount and currency → returns client_secret . client confirms it with stripe.js / elements ( stripe.confirmpayment ). if the bank needs 3d secure (sca, required in eu and for many indian cards as otp), stripe handles the challenge; status becomes requires_action then succeeded . server listens to payment_intent.succeeded / payment_intent.payment_failed webhooks . statuses: requires_payment_method → requires_confirmation → requires_action → processing → succeeded / canceled ."},{"id":"payments-fi3l5k","n":5,"q":"Authorize vs capture; when do you use manual capture?","qh":"Authorize vs capture; when do you use manual capture?","level":"mid","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>Authorization\u003c/strong>: the bank \u003cstrong>blocks\u003c/strong> the money on the card.\u003c/li>\u003cli>\u003cstrong>Capture\u003c/strong>: you actually \u003cstrong>take\u003c/strong> the money.\u003c/li>\u003c/ul>\n\u003cp>Auto-capture is normal for e-commerce. Use \u003cstrong>manual capture\u003c/strong> when the final amount or availability is only known later: hotel bookings, cab rides, marketplaces checking stock. Uncaptured authorizations \u003cstrong>expire\u003c/strong> (Razorpay auto-refunds after a few days; Stripe after ~7 days).\u003c/p>","t":"authorization : the bank blocks the money on the card. capture : you actually take the money. auto-capture is normal for e-commerce. use manual capture when the final amount or availability is only known later: hotel bookings, cab rides, marketplaces checking stock. uncaptured authorizations expire (razorpay auto-refunds after a few days; stripe after ~7 days)."}]},{"title":"Webhooks","intro":"","qs":[{"id":"payments-1x4j60","n":6,"q":"How do you handle webhooks reliably?","qh":"How do you handle webhooks reliably?","level":"senior","hot":true,"a":"\u003col>\u003cli>\u003cstrong>Verify the signature\u003c/strong> using the webhook secret and the \u003cstrong>raw request body\u003c/strong> (not the parsed JSON, which changes formatting).\u003c/li>\u003cli>\u003cstrong>Return 200 quickly\u003c/strong> (within a few seconds) and push the work to a \u003cstrong>queue\u003c/strong>; otherwise the gateway times out and retries.\u003c/li>\u003cli>\u003cstrong>Store the event ID\u003c/strong> with a unique constraint; skip events already processed (gateways retry and can send duplicates).\u003c/li>\u003cli>Handle \u003cstrong>out-of-order\u003c/strong> events: check the current state before changing it (don't move \u003ccode>refunded\u003c/code> back to \u003ccode>captured\u003c/code>).\u003c/li>\u003cli>Make the processing \u003cstrong>idempotent\u003c/strong> and retry on failure; alert on repeated failures.\u003c/li>\u003cli>Run a \u003cstrong>reconciliation\u003c/strong> job in case a webhook never arrives.\u003c/li>\u003c/ol>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>js\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-js\">app.post('/webhooks/razorpay', express.raw({ type: 'application/json' }), async (req, res) =&gt; {\n  const sig = req.headers['x-razorpay-signature'];\n  const expected = crypto.createHmac('sha256', process.env.RZP_WEBHOOK_SECRET).update(req.body).digest('hex');\n  if (sig !== expected) return res.status(400).end();   // use timingSafeEqual in production\n  const event = JSON.parse(req.body);\n  const inserted = await WebhookEvent.insertIgnore({ id: req.headers['x-razorpay-event-id'], type: event.event });\n  if (inserted) await queue.add('payment-event', event);\n  res.status(200).end();\n});\u003c/code>\u003c/pre>\u003c/div>","t":"verify the signature using the webhook secret and the raw request body (not the parsed json, which changes formatting). return 200 quickly (within a few seconds) and push the work to a queue ; otherwise the gateway times out and retries. store the event id with a unique constraint; skip events already processed (gateways retry and can send duplicates). handle out-of-order events: check the current state before changing it (don't move refunded back to captured ). make the processing idempotent and retry on failure; alert on repeated failures. run a reconciliation job in case a webhook never arrives. js copy app.post('/webhooks/razorpay', express.raw({ type: 'application/json' }), async (req, res) => { const sig = req.headers['x-razorpay-signature']; const expected = crypto.createhmac('sha256', process.env.rzp_webhook_secret).update(req.body).digest('hex'); if (sig !== expected) return res.status(400).end(); // use timingsafeequal in production const event = json.parse(req.body); const inserted = await webhookevent.insertignore({ id: req.headers['x-razorpay-event-id'], type: event.event }); if (inserted) await queue.add('payment-event', event); res.status(200).end(); });"},{"id":"payments-1a3n9i","n":7,"q":"Webhook vs redirect/callback: which is the source of truth?","qh":"Webhook vs redirect/callback: which is the source of truth?","level":"mid","hot":true,"a":"\u003cp>The \u003cstrong>webhook\u003c/strong>. The frontend callback can be lost: the user closes the tab, network drops, the app crashes, or someone fakes the request. The webhook is sent \u003cstrong>server to server, signed, and retried\u003c/strong> by the gateway.\u003c/p>\n\u003cp>Use the frontend callback for \u003cstrong>fast UX\u003c/strong> (show &quot;Payment successful&quot; immediately after verifying the signature), and the webhook to \u003cstrong>guarantee\u003c/strong> the final state.\u003c/p>","t":"the webhook . the frontend callback can be lost: the user closes the tab, network drops, the app crashes, or someone fakes the request. the webhook is sent server to server, signed, and retried by the gateway. use the frontend callback for fast ux (show \"payment successful\" immediately after verifying the signature), and the webhook to guarantee the final state."}]},{"title":"Reliability & Money","intro":"","qs":[{"id":"payments-mmelpe","n":8,"q":"What is idempotency and how do you prevent double charges?","qh":"What is idempotency and how do you prevent double charges?","level":"senior","hot":true,"a":"\u003cp>An operation is \u003cstrong>idempotent\u003c/strong> if running it many times has the same effect as once.\u003c/p>\n\u003cp>Double payments happen from double clicks, retries after timeouts, duplicate webhooks, or a user paying in two tabs.\u003c/p>\n\u003cp>\u003cstrong>Prevention:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Frontend: disable the Pay button after the first click.\u003c/li>\u003cli>Create \u003cstrong>one gateway order per checkout attempt\u003c/strong> and reuse it if the user retries.\u003c/li>\u003cli>Send an \u003cstrong>Idempotency-Key\u003c/strong> header to APIs that support it (Stripe) so a retry returns the original result.\u003c/li>\u003cli>In your API: accept an \u003ccode>Idempotency-Key\u003c/code> from the client, store it with the response, and return the stored response for repeats.\u003c/li>\u003cli>Database: \u003cstrong>unique constraint\u003c/strong> on \u003ccode>gateway_payment_id\u003c/code>; update with a condition (\u003ccode>UPDATE orders SET status='paid' WHERE id=? AND status='created'\u003c/code>) and fulfil only if a row changed.\u003c/li>\u003cli>If money was captured twice, \u003cstrong>auto-refund\u003c/strong> the duplicate.\u003c/li>\u003c/ul>","t":"an operation is idempotent if running it many times has the same effect as once. double payments happen from double clicks, retries after timeouts, duplicate webhooks, or a user paying in two tabs. prevention: frontend: disable the pay button after the first click. create one gateway order per checkout attempt and reuse it if the user retries. send an idempotency-key header to apis that support it (stripe) so a retry returns the original result. in your api: accept an idempotency-key from the client, store it with the response, and return the stored response for repeats. database: unique constraint on gateway_payment_id ; update with a condition ( update orders set status='paid' where id=? and status='created' ) and fulfil only if a row changed. if money was captured twice, auto-refund the duplicate."},{"id":"payments-tpkf52","n":9,"q":"Why store money as integers?","qh":"Why store money as integers?","level":"basic","hot":true,"a":"\u003cp>Floating point can't represent decimals exactly: \u003ccode>0.1 + 0.2 = 0.30000000000000004\u003c/code>. Rounding errors add up in totals, taxes and refunds.\u003c/p>\n\u003cp>\u003cmark>Store amounts in the smallest unit as integers\u003c/mark> (₹499.50 → \u003ccode>49950\u003c/code> paise), which is what Razorpay and Stripe expect. In SQL use \u003ccode>BIGINT\u003c/code> (or \u003ccode>DECIMAL(12,2)\u003c/code> if needed); always store the \u003cstrong>currency\u003c/strong> too.\u003c/p>","t":"floating point can't represent decimals exactly: 0.1 + 0.2 = 0.30000000000000004 . rounding errors add up in totals, taxes and refunds. store amounts in the smallest unit as integers (₹499.50 → 49950 paise), which is what razorpay and stripe expect. in sql use bigint (or decimal(12,2) if needed); always store the currency too."},{"id":"payments-63v8xq","n":10,"q":"How do you design the payments database tables?","qh":"How do you design the payments database tables?","level":"senior","hot":false,"a":"\u003cul>\u003cli>\u003ccode>orders\u003c/code>: id, user_id, amount, currency, status, created_at.\u003c/li>\u003cli>\u003ccode>payments\u003c/code>: id, order_id, gateway, gateway_order_id, \u003cstrong>gateway_payment_id (unique)\u003c/strong>, amount, status, method, failure_reason, raw_response (JSON), timestamps.\u003c/li>\u003cli>\u003ccode>refunds\u003c/code>: id, payment_id, gateway_refund_id (unique), amount, status, reason.\u003c/li>\u003cli>\u003ccode>webhook_events\u003c/code>: \u003cstrong>event_id (unique)\u003c/strong>, type, payload, processed_at, attempts.\u003c/li>\u003cli>\u003ccode>payment_status_history\u003c/code> or an audit log for every state change.\u003c/li>\u003c/ul>\n\u003cp>One order can have \u003cstrong>many payment attempts\u003c/strong> (first failed, second succeeded). Never delete payment rows; they are financial records.\u003c/p>","t":"orders : id, user_id, amount, currency, status, created_at. payments : id, order_id, gateway, gateway_order_id, gateway_payment_id (unique) , amount, status, method, failure_reason, raw_response (json), timestamps. refunds : id, payment_id, gateway_refund_id (unique), amount, status, reason. webhook_events : event_id (unique) , type, payload, processed_at, attempts. payment_status_history or an audit log for every state change. one order can have many payment attempts (first failed, second succeeded). never delete payment rows; they are financial records."},{"id":"payments-1t3akz","n":11,"q":"How do refunds work, including partial refunds?","qh":"How do refunds work, including partial refunds?","level":"mid","hot":false,"a":"\u003cul>\u003cli>Call the gateway refund API with the \u003ccode>payment_id\u003c/code> and amount (full or \u003cstrong>partial\u003c/strong>); store the refund with status \u003ccode>pending\u003c/code>.\u003c/li>\u003cli>Refunds are \u003cstrong>asynchronous\u003c/strong>: final status comes via webhook (\u003ccode>refund.processed\u003c/code> / \u003ccode>refund.failed\u003c/code>). It takes 5–7 working days to reach the customer's bank.\u003c/li>\u003cli>Validate: total refunded ≤ captured amount; use an idempotency key so a retried refund doesn't refund twice.\u003c/li>\u003cli>Update order status (\u003ccode>partially_refunded\u003c/code>, \u003ccode>refunded\u003c/code>) and inventory.\u003c/li>\u003c/ul>","t":"call the gateway refund api with the payment_id and amount (full or partial ); store the refund with status pending . refunds are asynchronous : final status comes via webhook ( refund.processed / refund.failed ). it takes 5–7 working days to reach the customer's bank. validate: total refunded ≤ captured amount; use an idempotency key so a retried refund doesn't refund twice. update order status ( partially_refunded , refunded ) and inventory."},{"id":"payments-fw3xfp","n":12,"q":"What is payment reconciliation?","qh":"What is payment reconciliation?","level":"senior","hot":true,"a":"\u003cp>A scheduled job that \u003cstrong>compares your records with the gateway's\u003c/strong> (via API or settlement reports) and fixes differences:\u003c/p>\n\u003cul>\u003cli>Order \u003ccode>pending\u003c/code> in your DB but \u003ccode>captured\u003c/code> at gateway → mark paid and fulfil (missed webhook).\u003c/li>\u003cli>\u003ccode>captured\u003c/code> at gateway but no matching order → investigate / refund.\u003c/li>\u003cli>Amount mismatches, missing refunds.\u003c/li>\u003cli>\u003cstrong>Settlement reconciliation\u003c/strong>: check that money settled to your bank account matches captured payments minus fees and refunds.\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>text\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-text\">Every 15 min: find orders pending &gt; 15 min → fetch status from gateway → update\nDaily: download settlement report → match each line → flag mismatches\u003c/code>\u003c/pre>\u003c/div>","t":"a scheduled job that compares your records with the gateway's (via api or settlement reports) and fixes differences: order pending in your db but captured at gateway → mark paid and fulfil (missed webhook). captured at gateway but no matching order → investigate / refund. amount mismatches, missing refunds. settlement reconciliation : check that money settled to your bank account matches captured payments minus fees and refunds. text copy every 15 min: find orders pending > 15 min → fetch status from gateway → update daily: download settlement report → match each line → flag mismatches"}]},{"title":"Scenarios","intro":"","qs":[{"id":"payments-v6h1zy","n":13,"q":"The user was charged but the order shows \"failed\". What happened and how do you fix it?","qh":"The user was charged but the order shows &quot;failed&quot;. What happened and how do you fix it?","level":"senior","hot":true,"a":"\u003cp>\u003cstrong>Likely causes:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>User closed the browser / network dropped \u003cstrong>after\u003c/strong> paying but \u003cstrong>before\u003c/strong> the frontend called your verify API.\u003c/li>\u003cli>Your verify API timed out or threw an error.\u003c/li>\u003cli>Webhook not configured, signature check failing, or webhook endpoint returned 500.\u003c/li>\u003cli>UPI / netbanking payments that complete \u003cstrong>late\u003c/strong> (pending for minutes).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Fix:\u003c/strong>\u003c/p>\n\u003col>\u003cli>Make the \u003cstrong>webhook the source of truth\u003c/strong> and process it idempotently.\u003c/li>\u003cli>Add a \u003cstrong>reconciliation job\u003c/strong> that polls the gateway for orders stuck in \u003ccode>pending\u003c/code>.\u003c/li>\u003cli>If the order can't be fulfilled (stock gone), \u003cstrong>auto-refund\u003c/strong>.\u003c/li>\u003cli>Show the user &quot;Payment processing&quot; instead of &quot;Failed&quot; while the status is unknown.\u003c/li>\u003cli>Alert when the count of mismatched orders goes up.\u003c/li>\u003c/ol>","t":"likely causes: user closed the browser / network dropped after paying but before the frontend called your verify api. your verify api timed out or threw an error. webhook not configured, signature check failing, or webhook endpoint returned 500. upi / netbanking payments that complete late (pending for minutes). fix: make the webhook the source of truth and process it idempotently. add a reconciliation job that polls the gateway for orders stuck in pending . if the order can't be fulfilled (stock gone), auto-refund . show the user \"payment processing\" instead of \"failed\" while the status is unknown. alert when the count of mismatched orders goes up."},{"id":"payments-yhb1cm","n":14,"q":"How do you implement subscriptions / recurring payments?","qh":"How do you implement subscriptions / recurring payments?","level":"senior","hot":false,"a":"\u003cul>\u003cli>Create a \u003cstrong>plan\u003c/strong> at the gateway and a \u003cstrong>subscription\u003c/strong> for the customer (Razorpay Subscriptions / Stripe Billing). For UPI AutoPay or card e-mandates, the customer approves a \u003cstrong>mandate\u003c/strong> once.\u003c/li>\u003cli>The gateway charges on each cycle and sends webhooks: \u003ccode>subscription.charged\u003c/code>, \u003ccode>invoice.paid\u003c/code>, \u003ccode>payment_failed\u003c/code>, \u003ccode>subscription.halted\u003c/code>/\u003ccode>cancelled\u003c/code>.\u003c/li>\u003cli>Your app extends access \u003cstrong>only on the webhook\u003c/strong>, keeps \u003ccode>current_period_end\u003c/code>, handles \u003cstrong>dunning\u003c/strong> (retry failed charges, email the user, grace period), upgrades/downgrades with \u003cstrong>proration\u003c/strong>, and cancellation at period end.\u003c/li>\u003c/ul>","t":"create a plan at the gateway and a subscription for the customer (razorpay subscriptions / stripe billing). for upi autopay or card e-mandates, the customer approves a mandate once. the gateway charges on each cycle and sends webhooks: subscription.charged , invoice.paid , payment_failed , subscription.halted / cancelled . your app extends access only on the webhook , keeps current_period_end , handles dunning (retry failed charges, email the user, grace period), upgrades/downgrades with proration , and cancellation at period end."},{"id":"payments-yeza12","n":15,"q":"How would you support multiple payment gateways?","qh":"How would you support multiple payment gateways?","level":"senior","hot":false,"a":"\u003cp>Use the \u003cstrong>strategy / adapter pattern\u003c/strong>: one \u003ccode>PaymentGateway\u003c/code> interface (\u003ccode>createOrder\u003c/code>, \u003ccode>verify\u003c/code>, \u003ccode>refund\u003c/code>, \u003ccode>parseWebhook\u003c/code>), one class per provider, chosen by config, country, or availability.\u003c/p>\n\u003cp>Benefits: switch gateways without touching business logic, \u003cstrong>fail over\u003c/strong> to a second gateway if one is down, route by lowest fees or best success rate. Store \u003ccode>gateway\u003c/code> on every payment record.\u003c/p>","t":"use the strategy / adapter pattern : one paymentgateway interface ( createorder , verify , refund , parsewebhook ), one class per provider, chosen by config, country, or availability. benefits: switch gateways without touching business logic, fail over to a second gateway if one is down, route by lowest fees or best success rate. store gateway on every payment record."},{"id":"payments-1xqtoa","n":16,"q":"What is PCI DSS and how does it affect your code?","qh":"What is PCI DSS and how does it affect your code?","level":"mid","hot":false,"a":"\u003cp>\u003cstrong>PCI DSS\u003c/strong> is the security standard for handling card data. If raw card numbers touch your servers you need heavy compliance (SAQ D).\u003c/p>\n\u003cp>Use \u003cstrong>hosted checkout, iframes or SDK tokenization\u003c/strong> (Razorpay Checkout, Stripe Elements) so card data goes straight to the gateway; you get a \u003cstrong>token\u003c/strong> instead (SAQ A). Never log card numbers or CVV. In India, RBI rules also require \u003cstrong>card-on-file tokenization\u003c/strong>; merchants can't store card numbers.\u003c/p>","t":"pci dss is the security standard for handling card data. if raw card numbers touch your servers you need heavy compliance (saq d). use hosted checkout, iframes or sdk tokenization (razorpay checkout, stripe elements) so card data goes straight to the gateway; you get a token instead (saq a). never log card numbers or cvv. in india, rbi rules also require card-on-file tokenization ; merchants can't store card numbers."},{"id":"payments-1irkvx","n":17,"q":"How do you test payment integrations?","qh":"How do you test payment integrations?","level":"mid","hot":false,"a":"\u003cul>\u003cli>Use the gateway's \u003cstrong>test mode\u003c/strong> keys and test cards / UPI IDs for success, failure and 3DS.\u003c/li>\u003cli>Test webhooks locally with \u003cstrong>ngrok\u003c/strong> or the \u003cstrong>Stripe CLI\u003c/strong> (\u003ccode>stripe listen --forward-to localhost:3000/webhooks\u003c/code>).\u003c/li>\u003cli>Unit test signature verification and the status state machine.\u003c/li>\u003cli>Test failure paths: duplicate webhook, webhook before callback, timeout, partial refund, currency mismatch.\u003c/li>\u003cli>Mock the gateway in automated tests (\u003ccode>Http::fake()\u003c/code>, nock).\u003c/li>\u003c/ul>","t":"use the gateway's test mode keys and test cards / upi ids for success, failure and 3ds. test webhooks locally with ngrok or the stripe cli ( stripe listen --forward-to localhost:3000/webhooks ). unit test signature verification and the status state machine. test failure paths: duplicate webhook, webhook before callback, timeout, partial refund, currency mismatch. mock the gateway in automated tests ( http::fake() , nock)."}]}],"count":17},{"id":"scenarios","title":"Scenario-Based","short":"Scenarios","color":"#ec4899","blurb":"\"Production is down, what do you do?\" Real situations with a step-by-step way to answer them: debugging, race conditions, scaling, security incidents and team situations.","cheats":["Answer pattern: \u003cmark>clarify → reproduce/measure → find root cause → fix → prevent it from happening again\u003c/mark>.","Always mention \u003cstrong>monitoring, logs and metrics\u003c/strong> first; never guess.","In an outage: \u003cstrong>mitigate first\u003c/strong> (rollback, scale up, feature flag off), find the root cause after.","Race conditions: \u003cstrong>DB transaction + row lock\u003c/strong>, atomic updates, unique constraints, distributed locks.","Duplicate work: \u003cstrong>idempotency keys\u003c/strong> and unique constraints.","Slow pages: measure with APM → slow query log → indexes / caching / queues.","Bring numbers: &quot;p95 went from 2.1s to 300ms&quot;, &quot;cut the bundle by 40%&quot;.","Close with \u003cstrong>prevention\u003c/strong>: tests, alerts, runbooks, a blameless post-mortem."],"sections":[{"title":"Production Incidents","intro":"","qs":[{"id":"scenarios-19az3h","n":1,"q":"Production API suddenly became slow. How do you debug it?","qh":"Production API suddenly became slow. How do you debug it?","level":"senior","hot":true,"a":"\u003col>\u003cli>\u003cstrong>Scope it\u003c/strong>: all endpoints or one? All users or some? Since when? Anything deployed or changed (code, config, traffic, data size)?\u003c/li>\u003cli>\u003cstrong>Check dashboards\u003c/strong>: latency p95/p99, error rate, CPU, memory, DB connections, queue length, event loop lag.\u003c/li>\u003cli>\u003cstrong>Mitigate if users are hurting\u003c/strong>: roll back the last deploy, scale out, disable the heavy feature with a flag.\u003c/li>\u003cli>\u003cstrong>Trace a slow request\u003c/strong> with APM to see where time goes: DB, external API, CPU.\u003c/li>\u003cli>\u003cstrong>Database\u003c/strong>: slow query log, \u003ccode>EXPLAIN\u003c/code> the top queries, check for missing indexes, locks, N+1 queries.\u003c/li>\u003cli>\u003cstrong>External calls\u003c/strong>: is a third-party API slow? Add \u003cstrong>timeouts, retries with backoff and circuit breakers\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Fix and verify\u003c/strong> with the same metrics, then write a post-mortem and add an alert.\u003c/li>\u003c/ol>\n\u003cdiv class=\"callout callout-say\">\u003cspan class=\"callout-label\">Say it like this\u003c/span>\u003cp>&quot;First I stop the bleeding, then I find out where the time is going with data, not guesses. Most of the time it's a query, a missing index, or a slow external call.&quot;\u003c/p>\u003c/div>","t":"scope it : all endpoints or one? all users or some? since when? anything deployed or changed (code, config, traffic, data size)? check dashboards : latency p95/p99, error rate, cpu, memory, db connections, queue length, event loop lag. mitigate if users are hurting : roll back the last deploy, scale out, disable the heavy feature with a flag. trace a slow request with apm to see where time goes: db, external api, cpu. database : slow query log, explain the top queries, check for missing indexes, locks, n+1 queries. external calls : is a third-party api slow? add timeouts, retries with backoff and circuit breakers . fix and verify with the same metrics, then write a post-mortem and add an alert. say it like this \"first i stop the bleeding, then i find out where the time is going with data, not guesses. most of the time it's a query, a missing index, or a slow external call.\""},{"id":"scenarios-msz854","n":2,"q":"The server crashes with \"out of memory\" every few hours.","qh":"The server crashes with &quot;out of memory&quot; every few hours.","level":"senior","hot":true,"a":"\u003cul>\u003cli>Memory grows steadily, so it's a \u003cstrong>leak\u003c/strong>, not a spike. Confirm with memory metrics over time.\u003c/li>\u003cli>\u003cstrong>Node\u003c/strong>: take heap snapshots a few minutes apart and compare (growing arrays/maps, listeners, closures). \u003cstrong>PHP\u003c/strong>: long-running workers (queue, Octane) leak through static arrays; restart workers with \u003ccode>--max-jobs\u003c/code> / \u003ccode>--max-time\u003c/code>.\u003c/li>\u003cli>Look for \u003cstrong>unbounded caches\u003c/strong>, loading whole tables into memory (\u003ccode>Model::all()\u003c/code>), large file reads instead of streams.\u003c/li>\u003cli>Short term: restart policy + memory limit; long term: fix the leak, add an LRU with TTL, stream data, alert on memory growth.\u003c/li>\u003c/ul>","t":"memory grows steadily, so it's a leak , not a spike. confirm with memory metrics over time. node : take heap snapshots a few minutes apart and compare (growing arrays/maps, listeners, closures). php : long-running workers (queue, octane) leak through static arrays; restart workers with --max-jobs / --max-time . look for unbounded caches , loading whole tables into memory ( model::all() ), large file reads instead of streams. short term: restart policy + memory limit; long term: fix the leak, add an lru with ttl, stream data, alert on memory growth."},{"id":"scenarios-11ocod","n":3,"q":"A deploy broke production. What do you do?","qh":"A deploy broke production. What do you do?","level":"mid","hot":true,"a":"\u003col>\u003cli>\u003cstrong>Roll back immediately\u003c/strong> to the last good version (that's why we keep versioned images/releases). Don't debug in production while users are failing.\u003c/li>\u003cli>Communicate in the incident channel: what's broken, impact, ETA.\u003c/li>\u003cli>Check if the deploy included a \u003cstrong>DB migration\u003c/strong>; rollback must be safe, which is why migrations should be backward compatible.\u003c/li>\u003cli>Reproduce on staging, fix, add a \u003cstrong>test\u003c/strong> that would have caught it.\u003c/li>\u003cli>Post-mortem: why didn't CI/staging catch it? Add canary deploys or feature flags.\u003c/li>\u003c/ol>","t":"roll back immediately to the last good version (that's why we keep versioned images/releases). don't debug in production while users are failing. communicate in the incident channel: what's broken, impact, eta. check if the deploy included a db migration ; rollback must be safe, which is why migrations should be backward compatible. reproduce on staging, fix, add a test that would have caught it. post-mortem: why didn't ci/staging catch it? add canary deploys or feature flags."},{"id":"scenarios-1mfw28","n":4,"q":"Users report they are randomly logged out.","qh":"Users report they are randomly logged out.","level":"mid","hot":false,"a":"\u003cp>Likely causes:\u003c/p>\n\u003cul>\u003cli>Multiple servers with \u003cstrong>sessions stored in local files\u003c/strong>: load balancer sends the user to a server without their session. Fix: Redis/DB sessions or sticky sessions.\u003c/li>\u003cli>\u003ccode>APP_KEY\u003c/code> / JWT secret \u003cstrong>differs between servers\u003c/strong> or changed on deploy.\u003c/li>\u003cli>Cookie domain/\u003ccode>SameSite\u003c/code>/\u003ccode>Secure\u003c/code> misconfigured (HTTP vs HTTPS, subdomain).\u003c/li>\u003cli>Token refresh race: two tabs refresh at the same time and the rotated refresh token invalidates the other.\u003c/li>\u003c/ul>","t":"likely causes: multiple servers with sessions stored in local files : load balancer sends the user to a server without their session. fix: redis/db sessions or sticky sessions. app_key / jwt secret differs between servers or changed on deploy. cookie domain/ samesite / secure misconfigured (http vs https, subdomain). token refresh race: two tabs refresh at the same time and the rotated refresh token invalidates the other."}]},{"title":"Data & Concurrency","intro":"","qs":[{"id":"scenarios-128wa3","n":5,"q":"Two users buy the last item at the same time. How do you prevent overselling?","qh":"Two users buy the last item at the same time. How do you prevent overselling?","level":"senior","hot":true,"a":"\u003cp>This is a \u003cstrong>race condition\u003c/strong>: both read \u003ccode>stock = 1\u003c/code>, both decrement.\u003c/p>\n\u003cp>Solutions:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Atomic conditional update\u003c/strong> (simplest, very fast):\u003c/li>\u003c/ol>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>sql\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-sql\">UPDATE products SET stock = stock - 1 WHERE id = ? AND stock &gt;= 1;\n-- affected rows = 0 → out of stock\u003c/code>\u003c/pre>\u003c/div>\n\u003col start=\"2\">\u003cli>\u003cstrong>Pessimistic lock\u003c/strong> inside a transaction: \u003ccode>SELECT ... FOR UPDATE\u003c/code> (\u003ccode>lockForUpdate()\u003c/code> in Laravel).\u003c/li>\u003cli>\u003cstrong>Optimistic locking\u003c/strong>: a \u003ccode>version\u003c/code> column; update \u003ccode>WHERE id = ? AND version = ?\u003c/code>, retry if no row changed.\u003c/li>\u003cli>For flash sales with huge traffic: keep stock in \u003cstrong>Redis\u003c/strong> with atomic \u003ccode>DECR\u003c/code> or a Lua script, put orders in a \u003cstrong>queue\u003c/strong>, and process them in order.\u003c/li>\u003cli>\u003cstrong>Reserve stock\u003c/strong> for a few minutes at checkout and release it if payment fails.\u003c/li>\u003c/ol>","t":"this is a race condition : both read stock = 1 , both decrement. solutions: atomic conditional update (simplest, very fast): sql copy update products set stock = stock - 1 where id = ? and stock >= 1; -- affected rows = 0 → out of stock pessimistic lock inside a transaction: select ... for update ( lockforupdate() in laravel). optimistic locking : a version column; update where id = ? and version = ? , retry if no row changed. for flash sales with huge traffic: keep stock in redis with atomic decr or a lua script, put orders in a queue , and process them in order. reserve stock for a few minutes at checkout and release it if payment fails."},{"id":"scenarios-6eleaf","n":6,"q":"A cron job runs twice and sends duplicate emails / charges.","qh":"A cron job runs twice and sends duplicate emails / charges.","level":"mid","hot":true,"a":"\u003cul>\u003cli>With several servers, every server runs the cron. Use \u003cstrong>one scheduler\u003c/strong> (\u003ccode>onOneServer()\u003c/code> in Laravel) or a \u003cstrong>distributed lock\u003c/strong> (Redis \u003ccode>SET key value NX EX 60\u003c/code>).\u003c/li>\u003cli>Make the job \u003cstrong>idempotent\u003c/strong>: track \u003ccode>email_sent_at\u003c/code> or a unique \u003ccode>(user_id, campaign_id)\u003c/code> row before sending.\u003c/li>\u003cli>Use \u003ccode>withoutOverlapping()\u003c/code> so a slow run doesn't overlap the next one.\u003c/li>\u003c/ul>","t":"with several servers, every server runs the cron. use one scheduler ( ononeserver() in laravel) or a distributed lock (redis set key value nx ex 60 ). make the job idempotent : track email_sent_at or a unique (user_id, campaign_id) row before sending. use withoutoverlapping() so a slow run doesn't overlap the next one."},{"id":"scenarios-1k982b","n":7,"q":"You need to add a column to a table with 50 million rows without downtime.","qh":"You need to add a column to a table with 50 million rows without downtime.","level":"senior","hot":false,"a":"\u003cul>\u003cli>A plain \u003ccode>ALTER TABLE\u003c/code> may \u003cstrong>lock the table\u003c/strong> for minutes. MySQL 8 supports \u003ccode>ALGORITHM=INSTANT\u003c/code> for adding columns in many cases; otherwise use \u003cstrong>gh-ost\u003c/strong> or \u003cstrong>pt-online-schema-change\u003c/strong>, which copy the table in the background.\u003c/li>\u003cli>Add the column \u003cstrong>nullable\u003c/strong> (no default backfill in one go), \u003cstrong>backfill in batches\u003c/strong> with a job (\u003ccode>chunkById\u003c/code>), then add constraints/indexes later.\u003c/li>\u003cli>Deploy code in steps (\u003cstrong>expand → migrate → contract\u003c/strong>) so old and new versions both work during the rollout.\u003c/li>\u003c/ul>","t":"a plain alter table may lock the table for minutes. mysql 8 supports algorithm=instant for adding columns in many cases; otherwise use gh-ost or pt-online-schema-change , which copy the table in the background. add the column nullable (no default backfill in one go), backfill in batches with a job ( chunkbyid ), then add constraints/indexes later. deploy code in steps ( expand → migrate → contract ) so old and new versions both work during the rollout."},{"id":"scenarios-1vzi13","n":8,"q":"How would you migrate data from an old system to a new one?","qh":"How would you migrate data from an old system to a new one?","level":"senior","hot":false,"a":"\u003cul>\u003cli>Map the schemas, write an idempotent migration script that runs in \u003cstrong>batches\u003c/strong> and can be \u003cstrong>resumed\u003c/strong>.\u003c/li>\u003cli>Dry run on a copy of production; compare counts and checksums.\u003c/li>\u003cli>\u003cstrong>Dual write\u003c/strong> (write to old and new) or CDC (change data capture) while you backfill history.\u003c/li>\u003cli>Switch reads gradually behind a feature flag; keep a rollback plan.\u003c/li>\u003c/ul>","t":"map the schemas, write an idempotent migration script that runs in batches and can be resumed . dry run on a copy of production; compare counts and checksums. dual write (write to old and new) or cdc (change data capture) while you backfill history. switch reads gradually behind a feature flag; keep a rollback plan."}]},{"title":"Scaling & Design","intro":"","qs":[{"id":"scenarios-1wdmxq","n":9,"q":"Your app must handle 10x traffic for a sale next week. What do you do?","qh":"Your app must handle 10x traffic for a sale next week. What do you do?","level":"senior","hot":true,"a":"\u003col>\u003cli>\u003cstrong>Load test\u003c/strong> now (k6, JMeter, Artillery) on staging to find the breaking point.\u003c/li>\u003cli>\u003cstrong>Cache\u003c/strong> everything read-heavy: product pages via CDN, Redis for catalogue and sessions.\u003c/li>\u003cli>\u003cstrong>Scale out\u003c/strong> app servers behind the load balancer; set up \u003cstrong>autoscaling\u003c/strong>; make sure the app is stateless.\u003c/li>\u003cli>\u003cstrong>Database\u003c/strong>: add read replicas, connection pooling, indexes for the hot queries; avoid heavy reports during the sale.\u003c/li>\u003cli>Move slow work to \u003cstrong>queues\u003c/strong> (emails, invoices) and scale workers.\u003c/li>\u003cli>Protect the system: \u003cstrong>rate limiting\u003c/strong>, a virtual waiting room, graceful degradation (turn off recommendations).\u003c/li>\u003cli>Prepare \u003cstrong>dashboards, alerts and a runbook\u003c/strong>; freeze non-critical deploys.\u003c/li>\u003c/ol>","t":"load test now (k6, jmeter, artillery) on staging to find the breaking point. cache everything read-heavy: product pages via cdn, redis for catalogue and sessions. scale out app servers behind the load balancer; set up autoscaling ; make sure the app is stateless. database : add read replicas, connection pooling, indexes for the hot queries; avoid heavy reports during the sale. move slow work to queues (emails, invoices) and scale workers. protect the system: rate limiting , a virtual waiting room, graceful degradation (turn off recommendations). prepare dashboards, alerts and a runbook ; freeze non-critical deploys."},{"id":"scenarios-10gj8a","n":10,"q":"Design a feature to export 1 million rows to CSV.","qh":"Design a feature to export 1 million rows to CSV.","level":"mid","hot":true,"a":"\u003cp>Never do it in the request: it will time out and eat memory.\u003c/p>\n\u003col>\u003cli>User clicks \u003cstrong>Export\u003c/strong> → API creates an \u003ccode>exports\u003c/code> record (\u003ccode>status = queued\u003c/code>) and dispatches a \u003cstrong>job\u003c/strong>. Respond immediately.\u003c/li>\u003cli>Job \u003cstrong>streams\u003c/strong> rows in chunks (\u003ccode>chunkById\u003c/code> / DB cursor) and writes them to a file stream, upload to \u003cstrong>S3\u003c/strong>.\u003c/li>\u003cli>Update status to \u003ccode>done\u003c/code>, notify the user (email / WebSocket / polling) with a \u003cstrong>signed, expiring download URL\u003c/strong>.\u003c/li>\u003cli>Limit concurrent exports per user; clean old files with a lifecycle rule.\u003c/li>\u003c/ol>","t":"never do it in the request: it will time out and eat memory. user clicks export → api creates an exports record ( status = queued ) and dispatches a job . respond immediately. job streams rows in chunks ( chunkbyid / db cursor) and writes them to a file stream, upload to s3 . update status to done , notify the user (email / websocket / polling) with a signed, expiring download url . limit concurrent exports per user; clean old files with a lifecycle rule."},{"id":"scenarios-39jm6c","n":11,"q":"How would you build real-time notifications?","qh":"How would you build real-time notifications?","level":"mid","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>WebSockets\u003c/strong> (Socket.IO, Laravel Reverb/Pusher) for two-way, instant updates; \u003cstrong>Server-Sent Events\u003c/strong> for one-way server → client; polling as a fallback.\u003c/li>\u003cli>With several servers, use a \u003cstrong>Redis pub/sub adapter\u003c/strong> so a message reaches users connected to any server.\u003c/li>\u003cli>Store notifications in the DB too (read/unread), so users see them after reconnecting.\u003c/li>\u003cli>Push notifications (FCM/APNs) for mobile when the app is closed.\u003c/li>\u003c/ul>","t":"websockets (socket.io, laravel reverb/pusher) for two-way, instant updates; server-sent events for one-way server → client; polling as a fallback. with several servers, use a redis pub/sub adapter so a message reaches users connected to any server. store notifications in the db too (read/unread), so users see them after reconnecting. push notifications (fcm/apns) for mobile when the app is closed."},{"id":"scenarios-1fbvx8","n":12,"q":"A third-party API you depend on is slow or down. How do you protect your app?","qh":"A third-party API you depend on is slow or down. How do you protect your app?","level":"senior","hot":true,"a":"\u003cul>\u003cli>\u003cstrong>Timeouts\u003c/strong> on every call (never wait forever).\u003c/li>\u003cli>\u003cstrong>Retries with exponential backoff and jitter\u003c/strong>, only for safe/idempotent requests.\u003c/li>\u003cli>\u003cstrong>Circuit breaker\u003c/strong>: after N failures, stop calling for a while and fail fast or use a fallback.\u003c/li>\u003cli>\u003cstrong>Cache\u003c/strong> the last good response; serve stale data if acceptable.\u003c/li>\u003cli>Move the call to a \u003cstrong>queue\u003c/strong> so the user isn't blocked; notify when done.\u003c/li>\u003cli>Monitor its latency and error rate separately; agree on SLAs.\u003c/li>\u003c/ul>","t":"timeouts on every call (never wait forever). retries with exponential backoff and jitter , only for safe/idempotent requests. circuit breaker : after n failures, stop calling for a while and fail fast or use a fallback. cache the last good response; serve stale data if acceptable. move the call to a queue so the user isn't blocked; notify when done. monitor its latency and error rate separately; agree on slas."}]},{"title":"Security Scenarios","intro":"","qs":[{"id":"scenarios-jcpbq4","n":13,"q":"You found that an API key was committed to a public GitHub repo.","qh":"You found that an API key was committed to a public GitHub repo.","level":"mid","hot":true,"a":"\u003col>\u003cli>\u003cstrong>Revoke / rotate the key immediately.\u003c/strong> Deleting the commit is not enough; bots scan GitHub within minutes and history keeps the key.\u003c/li>\u003cli>Check the provider's logs for misuse (unexpected charges, data access).\u003c/li>\u003cli>Remove it from history (\u003ccode>git filter-repo\u003c/code> / BFG) and force-push if needed; still treat it as leaked.\u003c/li>\u003cli>Prevent: secrets in env/secret manager, \u003ccode>.gitignore\u003c/code> for \u003ccode>.env\u003c/code>, \u003cstrong>pre-commit secret scanning\u003c/strong> (gitleaks), GitHub push protection.\u003c/li>\u003c/ol>","t":"revoke / rotate the key immediately. deleting the commit is not enough; bots scan github within minutes and history keeps the key. check the provider's logs for misuse (unexpected charges, data access). remove it from history ( git filter-repo / bfg) and force-push if needed; still treat it as leaked. prevent: secrets in env/secret manager, .gitignore for .env , pre-commit secret scanning (gitleaks), github push protection."},{"id":"scenarios-ox1qst","n":14,"q":"Your login endpoint is under a brute-force attack.","qh":"Your login endpoint is under a brute-force attack.","level":"mid","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>Rate limit\u003c/strong> by IP and by account (\u003ccode>throttle\u003c/code> / Redis), with exponential delays.\u003c/li>\u003cli>Temporary account lockout or \u003cstrong>CAPTCHA\u003c/strong> after N failures; alert the user.\u003c/li>\u003cli>Block abusive IPs at the WAF / Cloudflare.\u003c/li>\u003cli>Encourage \u003cstrong>2FA\u003c/strong>; return the same generic error for wrong email and wrong password (no user enumeration).\u003c/li>\u003cli>Monitor failed-login metrics.\u003c/li>\u003c/ul>","t":"rate limit by ip and by account ( throttle / redis), with exponential delays. temporary account lockout or captcha after n failures; alert the user. block abusive ips at the waf / cloudflare. encourage 2fa ; return the same generic error for wrong email and wrong password (no user enumeration). monitor failed-login metrics."}]},{"title":"Team & Behavioural","intro":"","qs":[{"id":"scenarios-xc4nav","n":15,"q":"Tell me about a difficult bug you fixed.","qh":"Tell me about a difficult bug you fixed.","level":"mid","hot":true,"a":"\u003cp>Use \u003cstrong>STAR\u003c/strong>: Situation, Task, Action, Result.\u003c/p>\n\u003cdiv class=\"callout callout-tip\">\u003cspan class=\"callout-label\">Interview tip\u003c/span>\u003cp>Example structure: &quot;Orders were sometimes marked paid twice (Situation). I owned the fix (Task). I found duplicate webhooks and the verify API racing each other, added a unique constraint on payment ID and a conditional status update, and made fulfilment idempotent (Action). Duplicate fulfilments dropped to zero and we added an alert (Result).&quot;\u003c/p>\u003c/div>\n\u003cp>Pick a real bug with a clear root cause and a measurable result.\u003c/p>","t":"use star : situation, task, action, result. interview tip example structure: \"orders were sometimes marked paid twice (situation). i owned the fix (task). i found duplicate webhooks and the verify api racing each other, added a unique constraint on payment id and a conditional status update, and made fulfilment idempotent (action). duplicate fulfilments dropped to zero and we added an alert (result).\" pick a real bug with a clear root cause and a measurable result."},{"id":"scenarios-zevcl9","n":16,"q":"How do you handle disagreement on a technical decision?","qh":"How do you handle disagreement on a technical decision?","level":"basic","hot":false,"a":"\u003cp>Listen to the reasons, bring \u003cstrong>data\u003c/strong> (benchmarks, a small prototype, past incidents), write the trade-offs down, and agree on a decision owner. Once decided, commit fully even if your option wasn't chosen. Revisit with data if problems appear.\u003c/p>","t":"listen to the reasons, bring data (benchmarks, a small prototype, past incidents), write the trade-offs down, and agree on a decision owner. once decided, commit fully even if your option wasn't chosen. revisit with data if problems appear."},{"id":"scenarios-1iij91","n":17,"q":"You have a tight deadline and the code isn't perfect. What do you do?","qh":"You have a tight deadline and the code isn't perfect. What do you do?","level":"basic","hot":false,"a":"\u003cp>Agree on the \u003cstrong>minimum scope\u003c/strong> with the product owner, ship the critical path with tests for the risky parts, use feature flags, and \u003cstrong>record the technical debt\u003c/strong> as tickets with a plan to fix it. Never skip security or data-integrity work to save time.\u003c/p>","t":"agree on the minimum scope with the product owner, ship the critical path with tests for the risky parts, use feature flags, and record the technical debt as tickets with a plan to fix it. never skip security or data-integrity work to save time."}]}],"count":17},{"id":"performance","title":"Performance","short":"Performance","color":"#14b8a6","blurb":"Backend, database and frontend performance: caching layers, query tuning, Core Web Vitals, bundle size, load testing and how to explain the numbers you improved.","cheats":["\u003cmark>Measure first, optimise second.\u003c/mark> Use APM, profilers, slow query logs, Lighthouse.","Talk in \u003cstrong>percentiles\u003c/strong> (p95, p99), not averages.","Biggest backend wins: \u003cstrong>indexes, fixing N+1, caching, queues, connection pooling\u003c/strong>.","Cache layers: browser → CDN → reverse proxy → app (Redis) → DB buffer pool.","Core Web Vitals: \u003cstrong>LCP &lt; 2.5s\u003c/strong>, \u003cstrong>INP &lt; 200ms\u003c/strong>, \u003cstrong>CLS &lt; 0.1\u003c/strong>.","Frontend wins: code splitting, smaller JS, image optimisation, lazy loading, preloading critical assets.","Long lists → \u003cstrong>virtualization\u003c/strong>; frequent events → \u003cstrong>debounce/throttle\u003c/strong>.","Pagination: \u003cstrong>cursor/keyset\u003c/strong> beats \u003ccode>OFFSET\u003c/code> on large tables.","Load test before big events (k6, JMeter, Artillery) and find the bottleneck."],"sections":[{"title":"Backend","intro":"","qs":[{"id":"performance-14i8is","n":1,"q":"How do you approach a performance problem in general?","qh":"How do you approach a performance problem in general?","level":"mid","hot":true,"a":"\u003col>\u003cli>\u003cstrong>Define the goal\u003c/strong>: &quot;checkout API p95 under 300ms&quot;.\u003c/li>\u003cli>\u003cstrong>Measure\u003c/strong> where time goes: APM traces, profilers (clinic.js, Xdebug/Blackfire), slow query log.\u003c/li>\u003cli>\u003cstrong>Find the biggest bottleneck\u003c/strong> (usually DB or external calls) and fix only that.\u003c/li>\u003cli>\u003cstrong>Verify\u003c/strong> with the same measurement; check you didn't break anything.\u003c/li>\u003cli>Repeat; add \u003cstrong>monitoring/alerts\u003c/strong> so regressions are caught.\u003c/li>\u003c/ol>\n\u003cdiv class=\"callout callout-say\">\u003cspan class=\"callout-label\">Say it like this\u003c/span>\u003cp>&quot;I never optimise blind. I profile, fix the top bottleneck, measure again. In my last project fixing an N+1 and adding one composite index took the orders API from 1.8s to 220ms p95.&quot;\u003c/p>\u003c/div>","t":"define the goal : \"checkout api p95 under 300ms\". measure where time goes: apm traces, profilers (clinic.js, xdebug/blackfire), slow query log. find the biggest bottleneck (usually db or external calls) and fix only that. verify with the same measurement; check you didn't break anything. repeat; add monitoring/alerts so regressions are caught. say it like this \"i never optimise blind. i profile, fix the top bottleneck, measure again. in my last project fixing an n+1 and adding one composite index took the orders api from 1.8s to 220ms p95.\""},{"id":"performance-m7f5d8","n":2,"q":"Explain caching strategies.","qh":"Explain caching strategies.","level":"mid","hot":true,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Strategy\u003c/th>\u003cth>How it works\u003c/th>\u003cth>Good for\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Cache-aside\u003c/strong> (lazy)\u003c/td>\u003ctd>App reads cache; on miss loads DB and writes cache\u003c/td>\u003ctd>Most read-heavy data\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Write-through\u003c/strong>\u003c/td>\u003ctd>Write to cache and DB together\u003c/td>\u003ctd>Data that must be fresh in cache\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Write-behind\u003c/strong>\u003c/td>\u003ctd>Write to cache, DB updated later (async)\u003c/td>\u003ctd>High write throughput, risk of loss\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Read-through\u003c/strong>\u003c/td>\u003ctd>Cache library loads from DB itself\u003c/td>\u003ctd>Simpler app code\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Plus: \u003cstrong>TTL\u003c/strong>, eviction policies (\u003cstrong>LRU\u003c/strong>, LFU), cache warming.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>js\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-js\">async function getProduct(id) {\n  const key = `product:${id}`;\n  const hit = await redis.get(key);\n  if (hit) return JSON.parse(hit);\n  const product = await db.products.findById(id);\n  await redis.set(key, JSON.stringify(product), 'EX', 600);\n  return product;\n}\u003c/code>\u003c/pre>\u003c/div>","t":"strategy how it works good for cache-aside (lazy) app reads cache; on miss loads db and writes cache most read-heavy data write-through write to cache and db together data that must be fresh in cache write-behind write to cache, db updated later (async) high write throughput, risk of loss read-through cache library loads from db itself simpler app code plus: ttl , eviction policies ( lru , lfu), cache warming. js copy async function getproduct(id) { const key = `product:${id}`; const hit = await redis.get(key); if (hit) return json.parse(hit); const product = await db.products.findbyid(id); await redis.set(key, json.stringify(product), 'ex', 600); return product; }"},{"id":"performance-1awxor","n":3,"q":"What is a cache stampede and how do you prevent it?","qh":"What is a cache stampede and how do you prevent it?","level":"senior","hot":false,"a":"\u003cp>A popular key expires and \u003cstrong>thousands of requests miss at the same time\u003c/strong>, all hitting the DB together.\u003c/p>\n\u003cp>Prevent it with:\u003c/p>\n\u003cul>\u003cli>A \u003cstrong>lock / single flight\u003c/strong>: only one request rebuilds; the others wait or get the stale value.\u003c/li>\u003cli>\u003cstrong>Stale-while-revalidate\u003c/strong>: serve the old value while refreshing in the background.\u003c/li>\u003cli>\u003cstrong>Random jitter\u003c/strong> on TTLs so keys don't expire together.\u003c/li>\u003cli>\u003cstrong>Pre-warm\u003c/strong> hot keys before they expire.\u003c/li>\u003c/ul>","t":"a popular key expires and thousands of requests miss at the same time , all hitting the db together. prevent it with: a lock / single flight : only one request rebuilds; the others wait or get the stale value. stale-while-revalidate : serve the old value while refreshing in the background. random jitter on ttls so keys don't expire together. pre-warm hot keys before they expire."},{"id":"performance-wofq1o","n":4,"q":"What is connection pooling and why does it matter?","qh":"What is connection pooling and why does it matter?","level":"mid","hot":false,"a":"\u003cp>Opening a DB connection is expensive (TCP + auth). A \u003cstrong>pool\u003c/strong> keeps connections open and reuses them.\u003c/p>\n\u003cul>\u003cli>Too small → requests wait for a connection. Too large → DB runs out of memory/connections (\u003ccode>max_connections\u003c/code>).\u003c/li>\u003cli>Many app instances × pool size must stay below the DB limit; use \u003cstrong>PgBouncer / RDS Proxy\u003c/strong> for many short-lived clients (serverless).\u003c/li>\u003cli>PHP-FPM uses one connection per worker; persistent connections are optional.\u003c/li>\u003c/ul>","t":"opening a db connection is expensive (tcp + auth). a pool keeps connections open and reuses them. too small → requests wait for a connection. too large → db runs out of memory/connections ( max_connections ). many app instances × pool size must stay below the db limit; use pgbouncer / rds proxy for many short-lived clients (serverless). php-fpm uses one connection per worker; persistent connections are optional."},{"id":"performance-1h8w1d","n":5,"q":"How do you make API responses faster?","qh":"How do you make API responses faster?","level":"mid","hot":true,"a":"\u003cul>\u003cli>Return \u003cstrong>only needed fields\u003c/strong>; paginate; compress responses (gzip/brotli).\u003c/li>\u003cli>Remove N+1, add indexes, cache expensive results.\u003c/li>\u003cli>Run independent calls \u003cstrong>in parallel\u003c/strong> (\u003ccode>Promise.all\u003c/code>).\u003c/li>\u003cli>Move non-critical work (emails, logs, analytics) to \u003cstrong>queues\u003c/strong>.\u003c/li>\u003cli>Use HTTP caching: \u003ccode>ETag\u003c/code>, \u003ccode>Cache-Control\u003c/code>, CDN for public GET endpoints.\u003c/li>\u003cli>Keep-alive connections, HTTP/2, servers close to users.\u003c/li>\u003c/ul>","t":"return only needed fields ; paginate; compress responses (gzip/brotli). remove n+1, add indexes, cache expensive results. run independent calls in parallel ( promise.all ). move non-critical work (emails, logs, analytics) to queues . use http caching: etag , cache-control , cdn for public get endpoints. keep-alive connections, http/2, servers close to users."}]},{"title":"Database","intro":"","qs":[{"id":"performance-tw4lhl","n":6,"q":"How do you find and fix a slow SQL query?","qh":"How do you find and fix a slow SQL query?","level":"mid","hot":true,"a":"\u003col>\u003cli>Find it: \u003cstrong>slow query log\u003c/strong>, APM, \u003ccode>pg_stat_statements\u003c/code>, Laravel Telescope.\u003c/li>\u003cli>Run \u003cstrong>\u003ccode>EXPLAIN\u003c/code> / \u003ccode>EXPLAIN ANALYZE\u003c/code>\u003c/strong>. Look for \u003ccode>type: ALL\u003c/code> (full table scan), large \u003ccode>rows\u003c/code>, \u003ccode>Using filesort\u003c/code>, \u003ccode>Using temporary\u003c/code>.\u003c/li>\u003cli>Add the right \u003cstrong>index\u003c/strong> (often a composite one matching \u003ccode>WHERE\u003c/code> + \u003ccode>ORDER BY\u003c/code>).\u003c/li>\u003cli>Rewrite: avoid \u003ccode>SELECT *\u003c/code>, avoid functions on indexed columns (\u003ccode>WHERE DATE(created_at) = ...\u003c/code> → use a range), avoid leading wildcards \u003ccode>LIKE '%abc'\u003c/code>.\u003c/li>\u003cli>Reduce work: pagination, summary tables, caching.\u003c/li>\u003c/ol>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>sql\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-sql\">-- Before: full scan\nSELECT * FROM orders WHERE user_id = 42 AND status = 'paid' ORDER BY created_at DESC LIMIT 20;\n-- Fix: composite index matching filter + sort\nCREATE INDEX idx_orders_user_status_created ON orders (user_id, status, created_at);\u003c/code>\u003c/pre>\u003c/div>","t":"find it: slow query log , apm, pg_stat_statements , laravel telescope. run explain / explain analyze . look for type: all (full table scan), large rows , using filesort , using temporary . add the right index (often a composite one matching where + order by ). rewrite: avoid select * , avoid functions on indexed columns ( where date(created_at) = ... → use a range), avoid leading wildcards like '%abc' . reduce work: pagination, summary tables, caching. sql copy -- before: full scan select * from orders where user_id = 42 and status = 'paid' order by created_at desc limit 20; -- fix: composite index matching filter + sort create index idx_orders_user_status_created on orders (user_id, status, created_at);"},{"id":"performance-1fa7b2","n":7,"q":"Why is `OFFSET` pagination slow? What's the alternative?","qh":"Why is \u003ccode>OFFSET\u003c/code> pagination slow? What's the alternative?","level":"senior","hot":true,"a":"\u003cp>\u003ccode>LIMIT 20 OFFSET 1000000\u003c/code> makes the DB \u003cstrong>read and throw away a million rows\u003c/strong>. It gets slower the deeper you go, and rows shift if data changes between pages.\u003c/p>\n\u003cp>\u003cstrong>Keyset (cursor) pagination\u003c/strong> remembers the last seen value:\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>sql\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-sql\">SELECT * FROM orders WHERE id &lt; :last_id ORDER BY id DESC LIMIT 20;\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>It uses the index directly, so it's fast at any depth. Trade-off: no &quot;jump to page 500&quot;. Laravel: \u003ccode>cursorPaginate()\u003c/code>.\u003c/p>","t":"limit 20 offset 1000000 makes the db read and throw away a million rows . it gets slower the deeper you go, and rows shift if data changes between pages. keyset (cursor) pagination remembers the last seen value: sql copy select * from orders where id \u003c :last_id order by id desc limit 20; it uses the index directly, so it's fast at any depth. trade-off: no \"jump to page 500\". laravel: cursorpaginate() ."}]},{"title":"Frontend","intro":"","qs":[{"id":"performance-1lzf3m","n":8,"q":"What are Core Web Vitals and how do you improve them?","qh":"What are Core Web Vitals and how do you improve them?","level":"mid","hot":true,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Metric\u003c/th>\u003cth>Measures\u003c/th>\u003cth>Good\u003c/th>\u003cth>Improve by\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>LCP\u003c/strong>\u003c/td>\u003ctd>Largest content visible\u003c/td>\u003ctd>&lt; 2.5s\u003c/td>\u003ctd>Faster server/CDN, preload hero image, SSR, compress images\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>INP\u003c/strong>\u003c/td>\u003ctd>Response to interactions\u003c/td>\u003ctd>&lt; 200ms\u003c/td>\u003ctd>Less JS on main thread, split long tasks, web workers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>CLS\u003c/strong>\u003c/td>\u003ctd>Layout jumping\u003c/td>\u003ctd>&lt; 0.1\u003c/td>\u003ctd>Set width/height on images/ads, reserve space, \u003ccode>font-display\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Measure in the field (real users, CrUX / \u003ccode>web-vitals\u003c/code> library) and in the lab (Lighthouse).\u003c/p>","t":"metric measures good improve by lcp largest content visible \u003c 2.5s faster server/cdn, preload hero image, ssr, compress images inp response to interactions \u003c 200ms less js on main thread, split long tasks, web workers cls layout jumping \u003c 0.1 set width/height on images/ads, reserve space, font-display measure in the field (real users, crux / web-vitals library) and in the lab (lighthouse)."},{"id":"performance-zm4i4v","n":9,"q":"How do you reduce bundle size?","qh":"How do you reduce bundle size?","level":"mid","hot":true,"a":"\u003cul>\u003cli>\u003cstrong>Analyse\u003c/strong> first: \u003ccode>vite-bundle-visualizer\u003c/code>, \u003ccode>webpack-bundle-analyzer\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Code splitting\u003c/strong> by route and for heavy components (\u003ccode>React.lazy\u003c/code>, dynamic \u003ccode>import()\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Tree-shaking\u003c/strong>: import only what you use (\u003ccode>import debounce from 'lodash/debounce'\u003c/code>).\u003c/li>\u003cli>Replace heavy libraries (moment → dayjs, big chart libs → lighter ones).\u003c/li>\u003cli>Remove dead code and polyfills you don't need; target modern browsers.\u003c/li>\u003cli>Compress (brotli), long-term caching with hashed filenames, CDN.\u003c/li>\u003c/ul>","t":"analyse first: vite-bundle-visualizer , webpack-bundle-analyzer . code splitting by route and for heavy components ( react.lazy , dynamic import() ). tree-shaking : import only what you use ( import debounce from 'lodash/debounce' ). replace heavy libraries (moment → dayjs, big chart libs → lighter ones). remove dead code and polyfills you don't need; target modern browsers. compress (brotli), long-term caching with hashed filenames, cdn."},{"id":"performance-72ppuq","n":10,"q":"How do you optimise images?","qh":"How do you optimise images?","level":"basic","hot":false,"a":"\u003cul>\u003cli>Modern formats: \u003cstrong>WebP / AVIF\u003c/strong>.\u003c/li>\u003cli>Responsive sizes with \u003ccode>srcset\u003c/code> and \u003ccode>sizes\u003c/code>; don't send a 3000px image to a phone.\u003c/li>\u003cli>\u003ccode>loading=&quot;lazy&quot;\u003c/code> for below-the-fold images; \u003cstrong>preload / \u003ccode>fetchpriority=&quot;high&quot;\u003c/code>\u003c/strong> for the LCP image.\u003c/li>\u003cli>Always set \u003ccode>width\u003c/code> and \u003ccode>height\u003c/code> to avoid layout shift.\u003c/li>\u003cli>Serve through an image CDN that resizes on the fly.\u003c/li>\u003c/ul>","t":"modern formats: webp / avif . responsive sizes with srcset and sizes ; don't send a 3000px image to a phone. loading=\"lazy\" for below-the-fold images; preload / fetchpriority=\"high\" for the lcp image. always set width and height to avoid layout shift. serve through an image cdn that resizes on the fly."},{"id":"performance-d3w3yh","n":11,"q":"How do you render 10,000 rows smoothly?","qh":"How do you render 10,000 rows smoothly?","level":"mid","hot":true,"a":"\u003cp>Render only what's visible: \u003cstrong>virtualization / windowing\u003c/strong> (\u003ccode>react-window\u003c/code>, TanStack Virtual). The DOM keeps ~30 rows and swaps content while scrolling.\u003c/p>\n\u003cp>Also: paginate or infinite-scroll from the server, memoize row components, avoid heavy work in render, and debounce filters.\u003c/p>","t":"render only what's visible: virtualization / windowing ( react-window , tanstack virtual). the dom keeps ~30 rows and swaps content while scrolling. also: paginate or infinite-scroll from the server, memoize row components, avoid heavy work in render, and debounce filters."},{"id":"performance-e90ekh","n":12,"q":"Browser rendering: what are reflow and repaint?","qh":"Browser rendering: what are reflow and repaint?","level":"senior","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>Reflow (layout)\u003c/strong>: the browser recalculates sizes and positions. Expensive; triggered by changing width/height/fonts or reading layout (\u003ccode>offsetHeight\u003c/code>) after writing styles.\u003c/li>\u003cli>\u003cstrong>Repaint\u003c/strong>: redraw pixels without layout changes (color, shadow).\u003c/li>\u003cli>\u003cstrong>Composite-only\u003c/strong> changes (\u003ccode>transform\u003c/code>, \u003ccode>opacity\u003c/code>) are cheapest and can run on the GPU.\u003c/li>\u003c/ul>\n\u003cp>Avoid \u003cstrong>layout thrashing\u003c/strong> (reading and writing layout in a loop); batch reads and writes; animate \u003ccode>transform\u003c/code> and \u003ccode>opacity\u003c/code> only.\u003c/p>","t":"reflow (layout) : the browser recalculates sizes and positions. expensive; triggered by changing width/height/fonts or reading layout ( offsetheight ) after writing styles. repaint : redraw pixels without layout changes (color, shadow). composite-only changes ( transform , opacity ) are cheapest and can run on the gpu. avoid layout thrashing (reading and writing layout in a loop); batch reads and writes; animate transform and opacity only."}]},{"title":"Load Testing","intro":"","qs":[{"id":"performance-1s1584","n":13,"q":"How do you load test an application?","qh":"How do you load test an applic
