encies. when a controller type-hints a class, the container builds it and injects it automatically (auto-resolution via reflection). php copy // bind an interface to an implementation (in a service provider) $this->app->bind(paymentgateway::class, razorpaygateway::class); $this->app->singleton(analytics::class, fn () => new analytics(config('services.analytics.key'))); // controller just asks for the interface public function __construct(private paymentgateway $gateway) {} benefit: you can swap implementations (stripe ↔ razorpay, real ↔ fake in tests) without changing the code that uses them. bind = new instance each time; singleton = same instance for the request lifecycle; scoped = singleton reset per request/job (useful with octane)."},{"id":"laravel-1qgbu1","n":3,"q":"What are service providers? `register()` vs `boot()`","qh":"What are service providers? \u003ccode>register()\u003c/code> vs \u003ccode>boot()\u003c/code>","level":"mid","hot":false,"a":"\u003cp>Service providers are the \u003cstrong>central place to bootstrap\u003c/strong> the app: bindings, event listeners, macros, route model bindings, observers.\u003c/p>\n\u003cul>\u003cli>\u003ccode>register()\u003c/code>: \u003cstrong>only bind things\u003c/strong> into the container. Don't use other services here, they may not be loaded yet.\u003c/li>\u003cli>\u003ccode>boot()\u003c/code>: runs after \u003cstrong>all\u003c/strong> providers are registered, so you can use any service (register observers, view composers, \u003ccode>Gate\u003c/code> rules).\u003c/li>\u003c/ul>\n\u003cp>Deferred providers load only when one of their services is actually needed, which speeds up boot.\u003c/p>","t":"service providers are the central place to bootstrap the app: bindings, event listeners, macros, route model bindings, observers. register() : only bind things into the container. don't use other services here, they may not be loaded yet. boot() : runs after all providers are registered, so you can use any service (register observers, view composers, gate rules). deferred providers load only when one of their services is actually needed, which speeds up boot."},{"id":"laravel-1fdg4p","n":4,"q":"How do Facades work?","qh":"How do Facades work?","level":"mid","hot":false,"a":"\u003cp>A facade is a class with a static interface that \u003cstrong>forwards calls to an object in the container\u003c/strong>. \u003ccode>Cache::get('k')\u003c/code> → \u003ccode>__callStatic\u003c/code> → resolves \u003ccode>app('cache')\u003c/code> → calls \u003ccode>get('k')\u003c/code> on it.\u003c/p>\n\u003cp>Facade vs injection: facades are convenient and still testable (\u003ccode>Cache::shouldReceive()\u003c/code>), but constructor injection makes dependencies \u003cstrong>explicit\u003c/strong>, which is better in large services.\u003c/p>","t":"a facade is a class with a static interface that forwards calls to an object in the container . cache::get('k') → __callstatic → resolves app('cache') → calls get('k') on it. facade vs injection: facades are convenient and still testable ( cache::shouldreceive() ), but constructor injection makes dependencies explicit , which is better in large services."},{"id":"laravel-1e6h3u","n":5,"q":"What are middleware? Give real examples.","qh":"What are middleware? Give real examples.","level":"basic","hot":true,"a":"\u003cp>Middleware filter HTTP requests entering the app. Examples: \u003ccode>auth\u003c/code>, \u003ccode>verified\u003c/code>, \u003ccode>throttle:60,1\u003c/code>, CORS, logging request time, checking a role, forcing JSON responses, checking a tenant.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">class EnsureUserIsAdmin {\n    public function handle(Request $request, Closure $next) {\n        if (! $request-&gt;user()?-&gt;is_admin) abort(403);\n        return $next($request);\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Before middleware acts before \u003ccode>$next($request)\u003c/code>; after middleware acts on the \u003ccode>$response\u003c/code> returned by \u003ccode>$next\u003c/code>.\u003c/p>","t":"middleware filter http requests entering the app. examples: auth , verified , throttle:60,1 , cors, logging request time, checking a role, forcing json responses, checking a tenant. php copy class ensureuserisadmin { public function handle(request $request, closure $next) { if (! $request->user()?->is_admin) abort(403); return $next($request); } } before middleware acts before $next($request) ; after middleware acts on the $response returned by $next ."}]},{"title":"Eloquent & Database","intro":"","qs":[{"id":"laravel-iemqnv","n":6,"q":"What is the N+1 query problem and how do you fix it?","qh":"What is the N+1 query problem and how do you fix it?","level":"mid","hot":true,"a":"\u003cp>Loading a list, then running \u003cstrong>one extra query per item\u003c/strong> for a relation.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">// N+1: 1 query for posts + 1 query per post for author\nforeach (Post::all() as $post) echo $post-&gt;author-&gt;name;\n\n// Fixed: 2 queries total\nforeach (Post::with('author')-&gt;get() as $post) echo $post-&gt;author-&gt;name;\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Other tools: \u003ccode>load()\u003c/code> (lazy eager load), \u003ccode>withCount('comments')\u003c/code>, nested \u003ccode>with('comments.user')\u003c/code>, constrained eager loading.\u003c/p>\n\u003cdiv class=\"callout callout-tip\">\u003cspan class=\"callout-label\">Interview tip\u003c/span>\u003cp>Put \u003ccode>Model::preventLazyLoading(! app()-&gt;isProduction());\u003c/code> in \u003ccode>AppServiceProvider::boot()\u003c/code> so N+1 throws an exception in development.\u003c/p>\u003c/div>","t":"loading a list, then running one extra query per item for a relation. php copy // n+1: 1 query for posts + 1 query per post for author foreach (post::all() as $post) echo $post->author->name; // fixed: 2 queries total foreach (post::with('author')->get() as $post) echo $post->author->name; other tools: load() (lazy eager load), withcount('comments') , nested with('comments.user') , constrained eager loading. interview tip put model::preventlazyloading(! app()->isproduction()); in appserviceprovider::boot() so n+1 throws an exception in development."},{"id":"laravel-1fcnj4","n":7,"q":"Mass assignment: `$fillable` vs `$guarded`","qh":"Mass assignment: \u003ccode>$fillable\u003c/code> vs \u003ccode>$guarded\u003c/code>","level":"basic","hot":true,"a":"\u003cp>Mass assignment = \u003ccode>User::create($request-&gt;all())\u003c/code>. An attacker could send \u003ccode>is_admin=1\u003c/code>.\u003c/p>\n\u003cul>\u003cli>\u003ccode>$fillable = ['name', 'email']\u003c/code>: \u003cstrong>only these\u003c/strong> can be mass assigned (allow list, safer).\u003c/li>\u003cli>\u003ccode>$guarded = ['is_admin']\u003c/code>: everything \u003cstrong>except\u003c/strong> these.\u003c/li>\u003c/ul>\n\u003cp>Best practice: use \u003ccode>$request-&gt;validated()\u003c/code> from a Form Request, and \u003ccode>$fillable\u003c/code>.\u003c/p>","t":"mass assignment = user::create($request->all()) . an attacker could send is_admin=1 . $fillable = ['name', 'email'] : only these can be mass assigned (allow list, safer). $guarded = ['is_admin'] : everything except these. best practice: use $request->validated() from a form request, and $fillable ."},{"id":"laravel-hid6v6","n":8,"q":"Eloquent relationships you should know","qh":"Eloquent relationships you should know","level":"mid","hot":true,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Relation\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>hasOne\u003c/code> / \u003ccode>belongsTo\u003c/code>\u003c/td>\u003ctd>User has one Profile\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>hasMany\u003c/code>\u003c/td>\u003ctd>Post has many Comments\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>belongsToMany\u003c/code>\u003c/td>\u003ctd>User ↔ Roles (pivot table \u003ccode>role_user\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>hasManyThrough\u003c/code>\u003c/td>\u003ctd>Country → Users → Posts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>morphOne\u003c/code> / \u003ccode>morphMany\u003c/code>\u003c/td>\u003ctd>Comments on Posts \u003cstrong>and\u003c/strong> Videos\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>morphToMany\u003c/code>\u003c/td>\u003ctd>Tags on many models\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Know \u003ccode>withPivot()\u003c/code>, \u003ccode>withTimestamps()\u003c/code>, \u003ccode>sync()\u003c/code>, \u003ccode>attach()\u003c/code>, \u003ccode>detach()\u003c/code> for many-to-many.\u003c/p>","t":"relation example hasone / belongsto user has one profile hasmany post has many comments belongstomany user ↔ roles (pivot table role_user ) hasmanythrough country → users → posts morphone / morphmany comments on posts and videos morphtomany tags on many models know withpivot() , withtimestamps() , sync() , attach() , detach() for many-to-many."},{"id":"laravel-1fb8xl","n":9,"q":"Accessors, mutators and casts","qh":"Accessors, mutators and casts","level":"basic","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>Accessor\u003c/strong>: format a value when reading (\u003ccode>full_name\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Mutator\u003c/strong>: transform when setting (hash password, lowercase email).\u003c/li>\u003cli>\u003cstrong>Casts\u003c/strong>: auto-convert types (\u003ccode>'meta' =&gt; 'array'\u003c/code>, \u003ccode>'paid_at' =&gt; 'datetime'\u003c/code>, enum casts, \u003ccode>encrypted\u003c/code>).\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">protected function email(): Attribute {\n    return Attribute::make(set: fn ($v) =&gt; strtolower($v));\n}\nprotected $casts = ['settings' =&gt; 'array', 'status' =&gt; OrderStatus::class];\u003c/code>\u003c/pre>\u003c/div>","t":"accessor : format a value when reading ( full_name ). mutator : transform when setting (hash password, lowercase email). casts : auto-convert types ( 'meta' => 'array' , 'paid_at' => 'datetime' , enum casts, encrypted ). php copy protected function email(): attribute { return attribute::make(set: fn ($v) => strtolower($v)); } protected $casts = ['settings' => 'array', 'status' => orderstatus::class];"},{"id":"laravel-bmc1hj","n":10,"q":"Query scopes: local vs global","qh":"Query scopes: local vs global","level":"mid","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>Local scope\u003c/strong>: reusable query part you call explicitly: \u003ccode>Order::paid()-&gt;recent()-&gt;get()\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Global scope\u003c/strong>: applied to \u003cstrong>every query\u003c/strong> of the model automatically, e.g. multi-tenancy \u003ccode>where tenant_id = ?\u003c/code> or \u003ccode>SoftDeletes\u003c/code>. Remove with \u003ccode>withoutGlobalScope()\u003c/code>.\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">public function scopePaid(Builder $q): void { $q-&gt;where('status', 'paid'); }\u003c/code>\u003c/pre>\u003c/div>","t":"local scope : reusable query part you call explicitly: order::paid()->recent()->get() . global scope : applied to every query of the model automatically, e.g. multi-tenancy where tenant_id = ? or softdeletes . remove with withoutglobalscope() . php copy public function scopepaid(builder $q): void { $q->where('status', 'paid'); }"},{"id":"laravel-14xhmf","n":11,"q":"How do you process a table with 1 million rows without running out of memory?","qh":"How do you process a table with 1 million rows without running out of memory?","level":"senior","hot":true,"a":"\u003cp>Never \u003ccode>Model::all()\u003c/code>. Use:\u003c/p>\n\u003cul>\u003cli>\u003ccode>chunk(1000, fn ($rows) =&gt; ...)\u003c/code>: pages with offset; \u003cstrong>don't update the column you filter on\u003c/strong> inside it.\u003c/li>\u003cli>\u003ccode>chunkById(1000, ...)\u003c/code>: uses \u003ccode>where id &gt; last_id\u003c/code>, \u003cmark>safe while updating and faster on large tables\u003c/mark>.\u003c/li>\u003cli>\u003ccode>lazy()\u003c/code> / \u003ccode>lazyById()\u003c/code>: a LazyCollection that streams chunks.\u003c/li>\u003cli>\u003ccode>cursor()\u003c/code>: one row at a time with one query (low memory, but holds the DB cursor open).\u003c/li>\u003cli>For bulk changes, a single \u003ccode>update()\u003c/code> query or \u003ccode>upsert()\u003c/code> beats loading models.\u003c/li>\u003c/ul>\n\u003cp>Run it inside a \u003cstrong>queued job\u003c/strong> and dispatch batches for very large work.\u003c/p>","t":"never model::all() . use: chunk(1000, fn ($rows) => ...) : pages with offset; don't update the column you filter on inside it. chunkbyid(1000, ...) : uses where id > last_id , safe while updating and faster on large tables . lazy() / lazybyid() : a lazycollection that streams chunks. cursor() : one row at a time with one query (low memory, but holds the db cursor open). for bulk changes, a single update() query or upsert() beats loading models. run it inside a queued job and dispatch batches for very large work."},{"id":"laravel-1cthzl","n":12,"q":"Transactions and row locking","qh":"Transactions and row locking","level":"senior","hot":true,"a":"\u003cp>Use \u003ccode>DB::transaction()\u003c/code> when several writes must all succeed or all fail (order + payment + stock).\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">DB::transaction(function () use ($productId, $qty) {\n    $product = Product::whereKey($productId)-&gt;lockForUpdate()-&gt;first();\n    if ($product-&gt;stock &lt; $qty) throw new OutOfStock();\n    $product-&gt;decrement('stock', $qty);\n    Order::create([...]);\n}, attempts: 3); // retry on deadlock\u003c/code>\u003c/pre>\u003c/div>\n\u003cul>\u003cli>\u003ccode>lockForUpdate()\u003c/code>: \u003ccode>SELECT … FOR UPDATE\u003c/code>, other transactions wait (prevents overselling).\u003c/li>\u003cli>\u003ccode>sharedLock()\u003c/code>: others can read but not write.\u003c/li>\u003cli>Atomic alternatives: \u003ccode>decrement()\u003c/code> with a \u003ccode>where('stock', '&gt;=', $qty)\u003c/code> check, or \u003ccode>Cache::lock()\u003c/code> for distributed locks.\u003c/li>\u003c/ul>","t":"use db::transaction() when several writes must all succeed or all fail (order + payment + stock). php copy db::transaction(function () use ($productid, $qty) { $product = product::wherekey($productid)->lockforupdate()->first(); if ($product->stock \u003c $qty) throw new outofstock(); $product->decrement('stock', $qty); order::create([...]); }, attempts: 3); // retry on deadlock lockforupdate() : select … for update , other transactions wait (prevents overselling). sharedlock() : others can read but not write. atomic alternatives: decrement() with a where('stock', '>=', $qty) check, or cache::lock() for distributed locks."},{"id":"laravel-nhmi24","n":13,"q":"Migrations, seeders and factories","qh":"Migrations, seeders and factories","level":"basic","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>Migrations\u003c/strong>: version control for schema (\u003ccode>up\u003c/code>/\u003ccode>down\u003c/code>), run with \u003ccode>php artisan migrate\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Seeders\u003c/strong>: insert initial or demo data.\u003c/li>\u003cli>\u003cstrong>Factories\u003c/strong>: generate fake models for tests and seeding (\u003ccode>User::factory()-&gt;count(10)-&gt;create()\u003c/code>).\u003c/li>\u003c/ul>\n\u003cdiv class=\"callout callout-warn\">\u003cspan class=\"callout-label\">Watch out\u003c/span>\u003cp>In production never edit a migration that already ran; create a new one. For big tables, adding an index or column can lock the table, so plan zero-downtime migrations.\u003c/p>\u003c/div>","t":"migrations : version control for schema ( up / down ), run with php artisan migrate . seeders : insert initial or demo data. factories : generate fake models for tests and seeding ( user::factory()->count(10)->create() ). watch out in production never edit a migration that already ran; create a new one. for big tables, adding an index or column can lock the table, so plan zero-downtime migrations."}]},{"title":"Queues, Events & Jobs","intro":"","qs":[{"id":"laravel-1r78d3","n":14,"q":"How do queues work in Laravel?","qh":"How do queues work in Laravel?","level":"mid","hot":true,"a":"\u003cp>Slow tasks (emails, PDFs, image resize, webhooks, payment reconciliation) are pushed as \u003cstrong>jobs\u003c/strong> to a queue driver (\u003cstrong>Redis\u003c/strong>, SQS, database). \u003cstrong>Workers\u003c/strong> (\u003ccode>php artisan queue:work\u003c/code>) pull and run them.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">ProcessInvoice::dispatch($order)-&gt;onQueue('invoices')-&gt;delay(now()-&gt;addMinute());\n\nclass ProcessInvoice implements ShouldQueue {\n    public $tries = 5;\n    public $backoff = [10, 60, 300];\n    public $timeout = 120;\n    public function handle(PdfService $pdf) { /* ... */ }\n    public function failed(Throwable $e) { /* alert */ }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Horizon\u003c/strong>: dashboard and config for Redis queues.\u003c/li>\u003cli>Use \u003cstrong>Supervisor\u003c/strong> to keep workers running; run \u003ccode>queue:restart\u003c/code> after deploy.\u003c/li>\u003cli>Make jobs \u003cstrong>idempotent\u003c/strong>: a retried job must not charge twice or send two emails.\u003c/li>\u003cli>\u003ccode>ShouldBeUnique\u003c/code>, \u003ccode>WithoutOverlapping\u003c/code> middleware, job batching (\u003ccode>Bus::batch\u003c/code>) and chains (\u003ccode>Bus::chain\u003c/code>).\u003c/li>\u003c/ul>","t":"slow tasks (emails, pdfs, image resize, webhooks, payment reconciliation) are pushed as jobs to a queue driver ( redis , sqs, database). workers ( php artisan queue:work ) pull and run them. php copy processinvoice::dispatch($order)->onqueue('invoices')->delay(now()->addminute()); class processinvoice implements shouldqueue { public $tries = 5; public $backoff = [10, 60, 300]; public $timeout = 120; public function handle(pdfservice $pdf) { /* ... */ } public function failed(throwable $e) { /* alert */ } } horizon : dashboard and config for redis queues. use supervisor to keep workers running; run queue:restart after deploy. make jobs idempotent : a retried job must not charge twice or send two emails. shouldbeunique , withoutoverlapping middleware, job batching ( bus::batch ) and chains ( bus::chain )."},{"id":"laravel-1658ay","n":15,"q":"Events and listeners vs observers","qh":"Events and listeners vs observers","level":"mid","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>Events/listeners\u003c/strong>: decouple side effects. \u003ccode>OrderPlaced\u003c/code> → \u003ccode>SendConfirmationEmail\u003c/code>, \u003ccode>UpdateInventory\u003c/code>, \u003ccode>NotifyAdmin\u003c/code>. Listeners can be queued (\u003ccode>ShouldQueue\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Observers\u003c/strong>: hook into \u003cstrong>model lifecycle\u003c/strong> events (\u003ccode>creating\u003c/code>, \u003ccode>created\u003c/code>, \u003ccode>updated\u003c/code>, \u003ccode>deleted\u003c/code>) for one model.\u003c/li>\u003c/ul>\n\u003cdiv class=\"callout callout-warn\">\u003cspan class=\"callout-label\">Watch out\u003c/span>\u003cp>Model events don't fire on mass updates like \u003ccode>Order::where(...)-&gt;update([...])\u003c/code>, because no models are loaded.\u003c/p>\u003c/div>","t":"events/listeners : decouple side effects. orderplaced → sendconfirmationemail , updateinventory , notifyadmin . listeners can be queued ( shouldqueue ). observers : hook into model lifecycle events ( creating , created , updated , deleted ) for one model. watch out model events don't fire on mass updates like order::where(...)->update([...]) , because no models are loaded."},{"id":"laravel-ut6zeb","n":16,"q":"How does the task scheduler work?","qh":"How does the task scheduler work?","level":"basic","hot":false,"a":"\u003cp>One cron entry runs every minute: \u003ccode>* * * * * php artisan schedule:run\u003c/code>. You define tasks in code (\u003ccode>routes/console.php\u003c/code> or the Console Kernel):\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">Schedule::command('reports:daily')-&gt;dailyAt('02:00')-&gt;onOneServer()-&gt;withoutOverlapping();\nSchedule::job(new ReconcilePayments)-&gt;everyFifteenMinutes();\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003ccode>onOneServer()\u003c/code> (needs a shared cache like Redis) avoids running the task on every server.\u003c/p>","t":"one cron entry runs every minute: * * * * * php artisan schedule:run . you define tasks in code ( routes/console.php or the console kernel): php copy schedule::command('reports:daily')->dailyat('02:00')->ononeserver()->withoutoverlapping(); schedule::job(new reconcilepayments)->everyfifteenminutes(); ononeserver() (needs a shared cache like redis) avoids running the task on every server."}]},{"title":"Auth & Security","intro":"","qs":[{"id":"laravel-k24adf","n":17,"q":"Sanctum vs Passport vs JWT","qh":"Sanctum vs Passport vs JWT","level":"mid","hot":true,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Use case\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Sanctum\u003c/strong>\u003c/td>\u003ctd>First-party SPA (cookie session auth) and simple \u003cstrong>API tokens\u003c/strong> for mobile apps. Lightweight, most common.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Passport\u003c/strong>\u003c/td>\u003ctd>Full \u003cstrong>OAuth2 server\u003c/strong>: third-party apps, authorization code flow, scopes, client credentials.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>JWT package\u003c/strong>\u003c/td>\u003ctd>Stateless tokens; common in older APIs or microservices.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cmark>For your own SPA + mobile app, Sanctum is the usual answer.\u003c/mark>\u003c/p>","t":"use case sanctum first-party spa (cookie session auth) and simple api tokens for mobile apps. lightweight, most common. passport full oauth2 server : third-party apps, authorization code flow, scopes, client credentials. jwt package stateless tokens; common in older apis or microservices. for your own spa + mobile app, sanctum is the usual answer."},{"id":"laravel-1quo4a","n":18,"q":"Gates vs Policies","qh":"Gates vs Policies","level":"mid","hot":false,"a":"\u003cp>Both handle \u003cstrong>authorization\u003c/strong> (can this user do X?).\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Gate\u003c/strong>: closure for simple, non-model actions: \u003ccode>Gate::define('view-reports', fn ($u) =&gt; $u-&gt;is_admin)\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Policy\u003c/strong>: class grouping rules \u003cstrong>for one model\u003c/strong>: \u003ccode>PostPolicy@update\u003c/code>. Use \u003ccode>$this-&gt;authorize('update', $post)\u003c/code> or \u003ccode>@can\u003c/code> in Blade.\u003c/li>\u003c/ul>","t":"both handle authorization (can this user do x?). gate : closure for simple, non-model actions: gate::define('view-reports', fn ($u) => $u->is_admin) . policy : class grouping rules for one model : postpolicy@update . use $this->authorize('update', $post) or @can in blade."},{"id":"laravel-1fqfim","n":19,"q":"How does Laravel protect against common attacks?","qh":"How does Laravel protect against common attacks?","level":"mid","hot":true,"a":"\u003cul>\u003cli>\u003cstrong>SQL injection\u003c/strong>: Eloquent/Query Builder use PDO prepared statements. Be careful with \u003ccode>DB::raw\u003c/code> / \u003ccode>whereRaw\u003c/code> and bind parameters.\u003c/li>\u003cli>\u003cstrong>XSS\u003c/strong>: Blade \u003ccode>{{ }}\u003c/code> escapes output; \u003ccode>{!! !!}\u003c/code> does not.\u003c/li>\u003cli>\u003cstrong>CSRF\u003c/strong>: \u003ccode>@csrf\u003c/code> token checked by middleware for web forms.\u003c/li>\u003cli>\u003cstrong>Mass assignment\u003c/strong>: \u003ccode>$fillable\u003c/code>.\u003c/li>\u003cli>Password hashing (\u003ccode>Hash::make\u003c/code>, bcrypt/argon2), encryption (\u003ccode>Crypt\u003c/code>), signed URLs, rate limiting (\u003ccode>throttle\u003c/code>).\u003c/li>\u003c/ul>","t":"sql injection : eloquent/query builder use pdo prepared statements. be careful with db::raw / whereraw and bind parameters. xss : blade {{ }} escapes output; {!! !!} does not. csrf : @csrf token checked by middleware for web forms. mass assignment : $fillable . password hashing ( hash::make , bcrypt/argon2), encryption ( crypt ), signed urls, rate limiting ( throttle )."}]},{"title":"Performance & Caching","intro":"","qs":[{"id":"laravel-4q2fkd","n":20,"q":"How do you optimise a slow Laravel application?","qh":"How do you optimise a slow Laravel application?","level":"senior","hot":true,"a":"\u003col>\u003cli>\u003cstrong>Measure\u003c/strong>: Telescope, Debugbar, Clockwork, APM, slow query log.\u003c/li>\u003cli>\u003cstrong>Database\u003c/strong>: fix N+1 with \u003ccode>with()\u003c/code>, add indexes, select only needed columns, paginate, use \u003ccode>chunkById\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Cache\u003c/strong>: \u003ccode>Cache::remember()\u003c/code> for expensive queries/config, Redis as cache driver, cache tags.\u003c/li>\u003cli>\u003cstrong>Queues\u003c/strong> for slow tasks.\u003c/li>\u003cli>\u003cstrong>Framework\u003c/strong>: \u003ccode>php artisan optimize\u003c/code> (config/route/event/view cache), \u003ccode>composer install --optimize-autoloader --no-dev\u003c/code>.\u003c/li>\u003cli>\u003cstrong>PHP\u003c/strong>: OPcache enabled, PHP 8.x with JIT where useful, tune PHP-FPM workers.\u003c/li>\u003cli>\u003cstrong>Octane\u003c/strong> (Swoole/RoadRunner/FrankenPHP) keeps the app in memory between requests.\u003c/li>\u003cli>CDN for assets, HTTP caching, response compression.\u003c/li>\u003c/ol>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">$stats = Cache::remember(&quot;dashboard:{$user-&gt;id}&quot;, now()-&gt;addMinutes(10), fn () =&gt; $this-&gt;buildStats($user));\u003c/code>\u003c/pre>\u003c/div>","t":"measure : telescope, debugbar, clockwork, apm, slow query log. database : fix n+1 with with() , add indexes, select only needed columns, paginate, use chunkbyid . cache : cache::remember() for expensive queries/config, redis as cache driver, cache tags. queues for slow tasks. framework : php artisan optimize (config/route/event/view cache), composer install --optimize-autoloader --no-dev . php : opcache enabled, php 8.x with jit where useful, tune php-fpm workers. octane (swoole/roadrunner/frankenphp) keeps the app in memory between requests. cdn for assets, http caching, response compression. php copy $stats = cache::remember(\"dashboard:{$user->id}\", now()->addminutes(10), fn () => $this->buildstats($user));"},{"id":"laravel-830vf8","n":21,"q":"Cache invalidation strategies in Laravel","qh":"Cache invalidation strategies in Laravel","level":"senior","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>TTL\u003c/strong>: simplest; accept data being stale for N minutes.\u003c/li>\u003cli>\u003cstrong>Event-based\u003c/strong>: clear keys in model observers / events when data changes (\u003ccode>Cache::forget(&quot;product:{$id}&quot;)\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Cache tags\u003c/strong> (Redis/Memcached): \u003ccode>Cache::tags(['products'])-&gt;flush()\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Versioned keys\u003c/strong>: \u003ccode>products:v{$version}\u003c/code>; bump the version to invalidate all.\u003c/li>\u003cli>Prevent \u003cstrong>cache stampede\u003c/strong> with \u003ccode>Cache::lock()\u003c/code> or \u003ccode>Cache::flexible()\u003c/code> (stale-while-revalidate).\u003c/li>\u003c/ul>","t":"ttl : simplest; accept data being stale for n minutes. event-based : clear keys in model observers / events when data changes ( cache::forget(\"product:{$id}\") ). cache tags (redis/memcached): cache::tags(['products'])->flush() . versioned keys : products:v{$version} ; bump the version to invalidate all. prevent cache stampede with cache::lock() or cache::flexible() (stale-while-revalidate)."},{"id":"laravel-1d0u82","n":22,"q":"What is Laravel Octane and when would you use it?","qh":"What is Laravel Octane and when would you use it?","level":"senior","hot":false,"a":"\u003cp>Octane boots the app \u003cstrong>once\u003c/strong> and serves many requests from memory using Swoole, RoadRunner or FrankenPHP. This removes the bootstrap cost on every request and gives big throughput gains.\u003c/p>\n\u003cdiv class=\"callout callout-warn\">\u003cspan class=\"callout-label\">Watch out\u003c/span>\u003cp>Because the app stays in memory, \u003cstrong>static properties and singletons leak state between requests\u003c/strong>. Avoid storing request data in singletons; use \u003ccode>scoped\u003c/code> bindings.\u003c/p>\u003c/div>","t":"octane boots the app once and serves many requests from memory using swoole, roadrunner or frankenphp. this removes the bootstrap cost on every request and gives big throughput gains. watch out because the app stays in memory, static properties and singletons leak state between requests . avoid storing request data in singletons; use scoped bindings."}]},{"title":"Testing & Misc","intro":"","qs":[{"id":"laravel-12zv82","n":23,"q":"How do you test in Laravel?","qh":"How do you test in Laravel?","level":"mid","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>Feature tests\u003c/strong>: hit routes (\u003ccode>$this-&gt;postJson('/api/orders', [...])-&gt;assertCreated()\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Unit tests\u003c/strong>: test services/classes alone.\u003c/li>\u003cli>\u003ccode>RefreshDatabase\u003c/code> trait, factories, SQLite in memory or a test MySQL DB.\u003c/li>\u003cli>Fakes: \u003ccode>Queue::fake()\u003c/code>, \u003ccode>Mail::fake()\u003c/code>, \u003ccode>Event::fake()\u003c/code>, \u003ccode>Http::fake()\u003c/code>, \u003ccode>Storage::fake()\u003c/code>.\u003c/li>\u003cli>Pest or PHPUnit.\u003c/li>\u003c/ul>","t":"feature tests : hit routes ( $this->postjson('/api/orders', [...])->assertcreated() ). unit tests : test services/classes alone. refreshdatabase trait, factories, sqlite in memory or a test mysql db. fakes: queue::fake() , mail::fake() , event::fake() , http::fake() , storage::fake() . pest or phpunit."},{"id":"laravel-jioohs","n":24,"q":"What are Form Requests?","qh":"What are Form Requests?","level":"basic","hot":false,"a":"\u003cp>Dedicated classes for \u003cstrong>validation and authorization\u003c/strong> of a request. They keep controllers thin.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">class StoreOrderRequest extends FormRequest {\n    public function authorize(): bool { return $this-&gt;user()-&gt;can('create', Order::class); }\n    public function rules(): array {\n        return ['items' =&gt; 'required|array|min:1', 'items.*.id' =&gt; 'exists:products,id'];\n    }\n}\u003c/code>\u003c/pre>\u003c/div>","t":"dedicated classes for validation and authorization of a request. they keep controllers thin. php copy class storeorderrequest extends formrequest { public function authorize(): bool { return $this->user()->can('create', order::class); } public function rules(): array { return ['items' => 'required|array|min:1', 'items.*.id' => 'exists:products,id']; } }"},{"id":"laravel-m2ml9h","n":25,"q":"What are API Resources?","qh":"What are API Resources?","level":"basic","hot":false,"a":"\u003cp>Transform models into JSON consistently, hide internal fields, add computed fields, and handle collections with pagination meta.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">return new OrderResource($order-&gt;load('items'));\nreturn OrderResource::collection(Order::paginate(20));\u003c/code>\u003c/pre>\u003c/div>","t":"transform models into json consistently, hide internal fields, add computed fields, and handle collections with pagination meta. php copy return new orderresource($order->load('items')); return orderresource::collection(order::paginate(20));"}]}],"count":25},{"id":"php","title":"PHP","short":"PHP","color":"#7b7fc4","blurb":"Core PHP, OOP, SOLID, PHP 8 features, sessions, security, Composer and how PHP-FPM actually serves a request.","cheats":["\u003ccode>==\u003c/code> compares after type juggling; \u003cmark>\u003ccode>===\u003c/code> compares value \u003cstrong>and\u003c/strong> type\u003c/mark>. In PHP 8, \u003ccode>0 == &quot;abc&quot;\u003c/code> is \u003cstrong>false\u003c/strong>.","Interface = contract only; abstract class = partial implementation; trait = \u003cstrong>copy-paste reuse\u003c/strong> of methods.","PHP 8: \u003cstrong>named args, union types, match, nullsafe \u003ccode>?-&gt;\u003c/code>, constructor promotion, enums (8.1), readonly (8.1), JIT\u003c/strong>.","\u003ccode>include\u003c/code> warns and continues; \u003ccode>require\u003c/code> is fatal on failure; \u003ccode>_once\u003c/code> versions load only once.","Sessions: data on the \u003cstrong>server\u003c/strong>, ID in a cookie. Cookies: data in the \u003cstrong>browser\u003c/strong>.","Security: prepared statements (PDO), \u003ccode>htmlspecialchars\u003c/code> on output, \u003ccode>password_hash\u003c/code>, CSRF tokens.","PHP is \u003cstrong>shared-nothing\u003c/strong>: each request starts fresh; PHP-FPM keeps a pool of worker processes.","\u003cstrong>OPcache\u003c/strong> stores compiled bytecode so scripts aren't recompiled on every request.","Composer: \u003ccode>composer.lock\u003c/code> pins exact versions; PSR-4 autoloading maps namespaces to folders."],"sections":[{"title":"Core PHP","intro":"","qs":[{"id":"php-11r9xy","n":1,"q":"`==` vs `===` in PHP","qh":"\u003ccode>==\u003c/code> vs \u003ccode>===\u003c/code> in PHP","level":"basic","hot":true,"a":"\u003cul>\u003cli>\u003ccode>==\u003c/code> (loose): converts types before comparing. \u003ccode>&quot;1&quot; == 1\u003c/code> is true, \u003ccode>null == false\u003c/code> is true.\u003c/li>\u003cli>\u003ccode>===\u003c/code> (strict): value \u003cstrong>and\u003c/strong> type must match. \u003ccode>&quot;1&quot; === 1\u003c/code> is false.\u003c/li>\u003c/ul>\n\u003cp>PHP 8 changed string-to-number comparison: \u003ccode>0 == &quot;abc&quot;\u003c/code> is now \u003cstrong>false\u003c/strong> (it was true in PHP 7).\u003c/p>\n\u003cdiv class=\"callout callout-tip\">\u003cspan class=\"callout-label\">Interview tip\u003c/span>\u003cp>Always prefer \u003ccode>===\u003c/code>, and use \u003ccode>in_array($x, $arr, true)\u003c/code> for strict checks. Loose comparison bugs are a classic security issue (e.g. \u003ccode>&quot;0e123&quot; == &quot;0e456&quot;\u003c/code> is true because both look like 0 in scientific notation).\u003c/p>\u003c/div>","t":"== (loose): converts types before comparing. \"1\" == 1 is true, null == false is true. === (strict): value and type must match. \"1\" === 1 is false. php 8 changed string-to-number comparison: 0 == \"abc\" is now false (it was true in php 7). interview tip always prefer === , and use in_array($x, $arr, true) for strict checks. loose comparison bugs are a classic security issue (e.g. \"0e123\" == \"0e456\" is true because both look like 0 in scientific notation)."},{"id":"php-1g3smi","n":2,"q":"`include` vs `require` vs `include_once` vs `require_once`","qh":"\u003ccode>include\u003c/code> vs \u003ccode>require\u003c/code> vs \u003ccode>include_once\u003c/code> vs \u003ccode>require_once\u003c/code>","level":"basic","hot":false,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>File missing\u003c/th>\u003cth>Loads twice?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>include\u003c/code>\u003c/td>\u003ctd>Warning, script continues\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>require\u003c/code>\u003c/td>\u003ctd>\u003cstrong>Fatal error\u003c/strong>, script stops\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>include_once\u003c/code> / \u003ccode>require_once\u003c/code>\u003c/td>\u003ctd>Same as above\u003c/td>\u003ctd>No, only once\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>In modern PHP you rarely use these directly; \u003cstrong>Composer autoloading\u003c/strong> loads classes.\u003c/p>","t":"file missing loads twice? include warning, script continues yes require fatal error , script stops yes include_once / require_once same as above no, only once in modern php you rarely use these directly; composer autoloading loads classes."},{"id":"php-1qusxv","n":3,"q":"Sessions vs cookies","qh":"Sessions vs cookies","level":"basic","hot":true,"a":"\u003cul>\u003cli>\u003cstrong>Cookie\u003c/strong>: small data stored \u003cstrong>in the browser\u003c/strong>, sent with every request. The user can read and edit it.\u003c/li>\u003cli>\u003cstrong>Session\u003c/strong>: data stored \u003cstrong>on the server\u003c/strong> (files, Redis, DB). Only a \u003cstrong>session ID\u003c/strong> goes in a cookie.\u003c/li>\u003c/ul>\n\u003cp>Secure session setup: \u003ccode>session_regenerate_id(true)\u003c/code> after login (prevents session fixation), cookie flags \u003ccode>HttpOnly\u003c/code>, \u003ccode>Secure\u003c/code>, \u003ccode>SameSite=Lax\u003c/code>. With multiple servers, store sessions in \u003cstrong>Redis\u003c/strong> so any server can read them.\u003c/p>","t":"cookie : small data stored in the browser , sent with every request. the user can read and edit it. session : data stored on the server (files, redis, db). only a session id goes in a cookie. secure session setup: session_regenerate_id(true) after login (prevents session fixation), cookie flags httponly , secure , samesite=lax . with multiple servers, store sessions in redis so any server can read them."},{"id":"php-1iyn1y","n":4,"q":"What are superglobals?","qh":"What are superglobals?","level":"basic","hot":false,"a":"\u003cp>Built-in arrays available everywhere: \u003ccode>$_GET\u003c/code>, \u003ccode>$_POST\u003c/code>, \u003ccode>$_REQUEST\u003c/code>, \u003ccode>$_SERVER\u003c/code>, \u003ccode>$_SESSION\u003c/code>, \u003ccode>$_COOKIE\u003c/code>, \u003ccode>$_FILES\u003c/code>, \u003ccode>$_ENV\u003c/code>, \u003ccode>$GLOBALS\u003c/code>.\u003c/p>\n\u003cdiv class=\"callout callout-warn\">\u003cspan class=\"callout-label\">Watch out\u003c/span>\u003cp>Never trust them. Validate and sanitize every value from \u003ccode>$_GET\u003c/code>, \u003ccode>$_POST\u003c/code>, \u003ccode>$_COOKIE\u003c/code> and \u003ccode>$_FILES\u003c/code>.\u003c/p>\u003c/div>","t":"built-in arrays available everywhere: $_get , $_post , $_request , $_server , $_session , $_cookie , $_files , $_env , $globals . watch out never trust them. validate and sanitize every value from $_get , $_post , $_cookie and $_files ."},{"id":"php-1koi9v","n":5,"q":"How does PHP handle a request (PHP-FPM, Nginx, OPcache)?","qh":"How does PHP handle a request (PHP-FPM, Nginx, OPcache)?","level":"mid","hot":true,"a":"\u003col>\u003cli>\u003cstrong>Nginx\u003c/strong> receives the request; static files are served directly.\u003c/li>\u003cli>\u003ccode>.php\u003c/code> requests go to \u003cstrong>PHP-FPM\u003c/strong> over FastCGI.\u003c/li>\u003cli>FPM picks a free \u003cstrong>worker process\u003c/strong> from its pool (\u003ccode>pm = dynamic\u003c/code>, \u003ccode>pm.max_children\u003c/code>).\u003c/li>\u003cli>The worker compiles the script to opcodes (or takes them from \u003cstrong>OPcache\u003c/strong>), runs it, returns the output.\u003c/li>\u003cli>\u003cmark>Memory is cleared after the request (shared-nothing architecture).\u003c/mark>\u003c/li>\u003c/ol>\n\u003cp>Tuning: \u003ccode>pm.max_children ≈ available RAM / average worker memory\u003c/code>. Too low → requests queue (502/504); too high → server swaps.\u003c/p>","t":"nginx receives the request; static files are served directly. .php requests go to php-fpm over fastcgi. fpm picks a free worker process from its pool ( pm = dynamic , pm.max_children ). the worker compiles the script to opcodes (or takes them from opcache ), runs it, returns the output. memory is cleared after the request (shared-nothing architecture). tuning: pm.max_children ≈ available ram / average worker memory . too low → requests queue (502/504); too high → server swaps."},{"id":"php-1wgu57","n":6,"q":"Pass by value vs pass by reference","qh":"Pass by value vs pass by reference","level":"basic","hot":false,"a":"\u003cp>By default variables are \u003cstrong>passed by value\u003c/strong> (a copy). Use \u003ccode>&amp;\u003c/code> to pass by reference. Objects are passed as a \u003cstrong>handle\u003c/strong>: the function can change the object's properties, but reassigning the parameter doesn't affect the caller.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">function addOne(int &amp;$n) { $n++; }\n$x = 1; addOne($x); // $x = 2\u003c/code>\u003c/pre>\u003c/div>","t":"by default variables are passed by value (a copy). use & to pass by reference. objects are passed as a handle : the function can change the object's properties, but reassigning the parameter doesn't affect the caller. php copy function addone(int &$n) { $n++; } $x = 1; addone($x); // $x = 2"}]},{"title":"OOP","intro":"","qs":[{"id":"php-shdtyu","n":7,"q":"Abstract class vs interface vs trait","qh":"Abstract class vs interface vs trait","level":"mid","hot":true,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Abstract class\u003c/th>\u003cth>Interface\u003c/th>\u003cth>Trait\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Purpose\u003c/td>\u003ctd>Base with shared code\u003c/td>\u003ctd>Contract\u003c/td>\u003ctd>Reuse methods horizontally\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Methods\u003c/td>\u003ctd>Abstract + concrete\u003c/td>\u003ctd>Signatures only (+ constants)\u003c/td>\u003ctd>Concrete (can be abstract)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Properties\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Multiple?\u003c/td>\u003ctd>Extend \u003cstrong>one\u003c/strong>\u003c/td>\u003ctd>Implement \u003cstrong>many\u003c/strong>\u003c/td>\u003ctd>Use \u003cstrong>many\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">interface PaymentGateway { public function charge(int $amountPaise): Payment; }\nabstract class BaseGateway implements PaymentGateway {\n    protected function log(string $m): void { /* shared */ }\n}\ntrait HasUuid { public static function bootHasUuid() { /* ... */ } }\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"callout callout-say\">\u003cspan class=\"callout-label\">Say it like this\u003c/span>\u003cp>&quot;Interface when different classes must follow the same contract; abstract class when they also share code; trait to reuse code across unrelated classes.&quot;\u003c/p>\u003c/div>","t":"abstract class interface trait purpose base with shared code contract reuse methods horizontally methods abstract + concrete signatures only (+ constants) concrete (can be abstract) properties yes no yes multiple? extend one implement many use many php copy interface paymentgateway { public function charge(int $amountpaise): payment; } abstract class basegateway implements paymentgateway { protected function log(string $m): void { /* shared */ } } trait hasuuid { public static function boothasuuid() { /* ... */ } } say it like this \"interface when different classes must follow the same contract; abstract class when they also share code; trait to reuse code across unrelated classes.\""},{"id":"php-19b15y","n":8,"q":"Explain the four pillars of OOP with PHP examples.","qh":"Explain the four pillars of OOP with PHP examples.","level":"basic","hot":true,"a":"\u003cul>\u003cli>\u003cstrong>Encapsulation\u003c/strong>: hide internal state with \u003ccode>private\u003c/code>/\u003ccode>protected\u003c/code>; expose methods (\u003ccode>$account-&gt;deposit(100)\u003c/code> instead of touching \u003ccode>$balance\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Abstraction\u003c/strong>: expose \u003cstrong>what\u003c/strong> something does, hide \u003cstrong>how\u003c/strong> (\u003ccode>PaymentGateway::charge()\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Inheritance\u003c/strong>: \u003ccode>class Admin extends User\u003c/code> reuses and extends behaviour.\u003c/li>\u003cli>\u003cstrong>Polymorphism\u003c/strong>: same interface, different behaviour; code calls \u003ccode>$gateway-&gt;charge()\u003c/code> whether it's Stripe or Razorpay.\u003c/li>\u003c/ul>","t":"encapsulation : hide internal state with private / protected ; expose methods ( $account->deposit(100) instead of touching $balance ). abstraction : expose what something does, hide how ( paymentgateway::charge() ). inheritance : class admin extends user reuses and extends behaviour. polymorphism : same interface, different behaviour; code calls $gateway->charge() whether it's stripe or razorpay."},{"id":"php-wei1fc","n":9,"q":"Explain SOLID principles.","qh":"Explain SOLID principles.","level":"mid","hot":true,"a":"\u003col>\u003cli>\u003cstrong>S\u003c/strong>ingle Responsibility: a class has one reason to change (controller doesn't send emails and build PDFs).\u003c/li>\u003cli>\u003cstrong>O\u003c/strong>pen/Closed: open for extension, closed for modification (add a new gateway class instead of a new \u003ccode>if\u003c/code>).\u003c/li>\u003cli>\u003cstrong>L\u003c/strong>iskov Substitution: subclasses must work wherever the parent works.\u003c/li>\u003cli>\u003cstrong>I\u003c/strong>nterface Segregation: many small interfaces beat one big one.\u003c/li>\u003cli>\u003cstrong>D\u003c/strong>ependency Inversion: depend on \u003cstrong>abstractions\u003c/strong> (interfaces), not concrete classes; inject dependencies.\u003c/li>\u003c/ol>\n\u003cdiv class=\"callout callout-tip\">\u003cspan class=\"callout-label\">Interview tip\u003c/span>\u003cp>Interviewers love a real example. &quot;We had a \u003ccode>PaymentService\u003c/code> with a giant switch per gateway. I refactored it to a \u003ccode>PaymentGateway\u003c/code> interface with one class per provider, resolved through the container. Adding PayU took one new class.&quot;\u003c/p>\u003c/div>","t":"s ingle responsibility: a class has one reason to change (controller doesn't send emails and build pdfs). o pen/closed: open for extension, closed for modification (add a new gateway class instead of a new if ). l iskov substitution: subclasses must work wherever the parent works. i nterface segregation: many small interfaces beat one big one. d ependency inversion: depend on abstractions (interfaces), not concrete classes; inject dependencies. interview tip interviewers love a real example. \"we had a paymentservice with a giant switch per gateway. i refactored it to a paymentgateway interface with one class per provider, resolved through the container. adding payu took one new class.\""},{"id":"php-ktms9k","n":10,"q":"Static vs self vs `$this`; what is late static binding?","qh":"Static vs self vs \u003ccode>$this\u003c/code>; what is late static binding?","level":"mid","hot":false,"a":"\u003cul>\u003cli>\u003ccode>$this\u003c/code>: the current \u003cstrong>object\u003c/strong>.\u003c/li>\u003cli>\u003ccode>self::\u003c/code>: the class where the code is \u003cstrong>written\u003c/strong>.\u003c/li>\u003cli>\u003ccode>static::\u003c/code>: the class that was \u003cstrong>actually called\u003c/strong> at runtime (late static binding).\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">class Model { public static function create() { return new static(); } }\nclass User extends Model {}\nUser::create(); // returns User (with `new self()` it would return Model)\u003c/code>\u003c/pre>\u003c/div>","t":"$this : the current object . self:: : the class where the code is written . static:: : the class that was actually called at runtime (late static binding). php copy class model { public static function create() { return new static(); } } class user extends model {} user::create(); // returns user (with `new self()` it would return model)"},{"id":"php-1o4fbp","n":11,"q":"What are magic methods?","qh":"What are magic methods?","level":"mid","hot":false,"a":"\u003cp>Special methods PHP calls automatically: \u003ccode>__construct\u003c/code>, \u003ccode>__destruct\u003c/code>, \u003ccode>__get\u003c/code>, \u003ccode>__set\u003c/code>, \u003ccode>__isset\u003c/code>, \u003ccode>__unset\u003c/code>, \u003ccode>__call\u003c/code>, \u003ccode>__callStatic\u003c/code>, \u003ccode>__toString\u003c/code>, \u003ccode>__invoke\u003c/code>, \u003ccode>__clone\u003c/code>, \u003ccode>__serialize\u003c/code>/\u003ccode>__unserialize\u003c/code>.\u003c/p>\n\u003cp>Laravel uses them a lot: Eloquent attributes use \u003ccode>__get\u003c/code>/\u003ccode>__set\u003c/code>, facades use \u003ccode>__callStatic\u003c/code>, dynamic \u003ccode>where\u003c/code> clauses use \u003ccode>__call\u003c/code>.\u003c/p>","t":"special methods php calls automatically: __construct , __destruct , __get , __set , __isset , __unset , __call , __callstatic , __tostring , __invoke , __clone , __serialize / __unserialize . laravel uses them a lot: eloquent attributes use __get / __set , facades use __callstatic , dynamic where clauses use __call ."}]},{"title":"Modern PHP (8.x)","intro":"","qs":[{"id":"php-1by19y","n":12,"q":"What's new in PHP 8.0–8.3?","qh":"What's new in PHP 8.0–8.3?","level":"mid","hot":true,"a":"\u003cul>\u003cli>\u003cstrong>8.0\u003c/strong>: JIT, named arguments, union types, \u003ccode>match\u003c/code> expression, nullsafe \u003ccode>?-&gt;\u003c/code>, constructor property promotion, attributes, \u003ccode>str_contains\u003c/code>, throw as expression.\u003c/li>\u003cli>\u003cstrong>8.1\u003c/strong>: \u003cstrong>enums\u003c/strong>, \u003cstrong>readonly properties\u003c/strong>, fibers, \u003ccode>never\u003c/code> return type, first-class callable syntax \u003ccode>strlen(...)\u003c/code>, pure intersection types.\u003c/li>\u003cli>\u003cstrong>8.2\u003c/strong>: readonly classes, DNF types, deprecated dynamic properties, \u003ccode>true\u003c/code>/\u003ccode>false\u003c/code>/\u003ccode>null\u003c/code> standalone types.\u003c/li>\u003cli>\u003cstrong>8.3\u003c/strong>: typed class constants, \u003ccode>json_validate()\u003c/code>, \u003ccode>#[\\Override]\u003c/code> attribute.\u003c/li>\u003cli>\u003cstrong>8.4\u003c/strong>: property hooks, asymmetric visibility, \u003ccode>new\u003c/code> without parentheses in chains.\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">enum OrderStatus: string { case Pending = 'pending'; case Paid = 'paid'; }\n\nfinal class Money {\n    public function __construct(public readonly int $amount, public readonly string $currency = 'INR') {}\n}\n\n$label = match ($status) {\n    OrderStatus::Paid =&gt; 'Paid',\n    OrderStatus::Pending =&gt; 'Waiting',\n};\n$city = $user?-&gt;address?-&gt;city;\u003c/code>\u003c/pre>\u003c/div>","t":"8.0 : jit, named arguments, union types, match expression, nullsafe ?-> , constructor property promotion, attributes, str_contains , throw as expression. 8.1 : enums , readonly properties , fibers, never return type, first-class callable syntax strlen(...) , pure intersection types. 8.2 : readonly classes, dnf types, deprecated dynamic properties, true / false / null standalone types. 8.3 : typed class constants, json_validate() , #[\\override] attribute. 8.4 : property hooks, asymmetric visibility, new without parentheses in chains. php copy enum orderstatus: string { case pending = 'pending'; case paid = 'paid'; } final class money { public function __construct(public readonly int $amount, public readonly string $currency = 'inr') {} } $label = match ($status) { orderstatus::paid => 'paid', orderstatus::pending => 'waiting', }; $city = $user?->address?->city;"},{"id":"php-lk5dql","n":13,"q":"`match` vs `switch`","qh":"\u003ccode>match\u003c/code> vs \u003ccode>switch\u003c/code>","level":"basic","hot":false,"a":"\u003cp>\u003ccode>match\u003c/code> is an \u003cstrong>expression\u003c/strong> (returns a value), uses \u003cstrong>strict comparison\u003c/strong> (\u003ccode>===\u003c/code>), has \u003cstrong>no fall-through\u003c/strong>, and throws \u003ccode>UnhandledMatchError\u003c/code> if nothing matches. \u003ccode>switch\u003c/code> uses loose comparison and needs \u003ccode>break\u003c/code>.\u003c/p>","t":"match is an expression (returns a value), uses strict comparison ( === ), has no fall-through , and throws unhandledmatcherror if nothing matches. switch uses loose comparison and needs break ."},{"id":"php-s3ablg","n":14,"q":"What are generators and `yield`?","qh":"What are generators and \u003ccode>yield\u003c/code>?","level":"mid","hot":false,"a":"\u003cp>A generator returns values \u003cstrong>one at a time\u003c/strong> without building the whole array in memory. Ideal for large files or DB exports.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">function readLines(string $file): Generator {\n    $h = fopen($file, 'r');\n    while (($line = fgets($h)) !== false) yield $line;\n    fclose($h);\n}\nforeach (readLines('10gb.csv') as $line) { /* constant memory */ }\u003c/code>\u003c/pre>\u003c/div>","t":"a generator returns values one at a time without building the whole array in memory. ideal for large files or db exports. php copy function readlines(string $file): generator { $h = fopen($file, 'r'); while (($line = fgets($h)) !== false) yield $line; fclose($h); } foreach (readlines('10gb.csv') as $line) { /* constant memory */ }"},{"id":"php-l68alz","n":15,"q":"Error handling: exceptions vs errors in PHP 7+","qh":"Error handling: exceptions vs errors in PHP 7+","level":"mid","hot":false,"a":"\u003cp>Since PHP 7, most fatal errors are thrown as \u003ccode>Error\u003c/code>. Both \u003ccode>Error\u003c/code> and \u003ccode>Exception\u003c/code> implement \u003ccode>Throwable\u003c/code>.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">try { riskyCall(); }\ncatch (PaymentException $e) { /* domain error */ }\ncatch (Throwable $e) { report($e); }\nfinally { /* cleanup */ }\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Create \u003cstrong>domain exceptions\u003c/strong> (\u003ccode>InsufficientBalanceException\u003c/code>) instead of generic ones; log with context; never show raw errors to users (\u003ccode>display_errors=Off\u003c/code> in production).\u003c/p>","t":"since php 7, most fatal errors are thrown as error . both error and exception implement throwable . php copy try { riskycall(); } catch (paymentexception $e) { /* domain error */ } catch (throwable $e) { report($e); } finally { /* cleanup */ } create domain exceptions ( insufficientbalanceexception ) instead of generic ones; log with context; never show raw errors to users ( display_errors=off in production)."}]},{"title":"Security","intro":"","qs":[{"id":"php-e7yuqg","n":16,"q":"How do you prevent SQL injection in PHP?","qh":"How do you prevent SQL injection in PHP?","level":"basic","hot":true,"a":"\u003cp>Use \u003cstrong>prepared statements with bound parameters\u003c/strong> (PDO or MySQLi). Never concatenate user input into SQL.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>php\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-php\">$stmt = $pdo-&gt;prepare('SELECT * FROM users WHERE email = ?');\n$stmt-&gt;execute([$email]);\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>For dynamic column names or sort order (which can't be bound), use an \u003cstrong>allow list\u003c/strong>: \u003ccode>in_array($sort, ['name', 'created_at'], true)\u003c/code>.\u003c/p>","t":"use prepared statements with bound parameters (pdo or mysqli). never concatenate user input into sql. php copy $stmt = $pdo->prepare('select * from users where email = ?'); $stmt->execute([$email]); for dynamic column names or sort order (which can't be bound), use an allow list : in_array($sort, ['name', 'created_at'], true) ."},{"id":"php-12p0g5","n":17,"q":"How do you prevent XSS and CSRF?","qh":"How do you prevent XSS and CSRF?","level":"mid","hot":true,"a":"\u003cp>\u003cstrong>XSS\u003c/strong> (attacker's script runs in a victim's browser): escape output with \u003ccode>htmlspecialchars($v, ENT_QUOTES, 'UTF-8')\u003c/code> (Blade/Twig do it automatically), add a \u003cstrong>Content-Security-Policy\u003c/strong>, set cookies \u003ccode>HttpOnly\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>CSRF\u003c/strong> (victim's browser is tricked into sending a request): use a \u003cstrong>random token\u003c/strong> per session in forms and check it on POST; \u003ccode>SameSite\u003c/code> cookies; check the \u003ccode>Origin\u003c/code> header.\u003c/p>","t":"xss (attacker's script runs in a victim's browser): escape output with htmlspecialchars($v, ent_quotes, 'utf-8') (blade/twig do it automatically), add a content-security-policy , set cookies httponly . csrf (victim's browser is tricked into sending a request): use a random token per session in forms and check it on post; samesite cookies; check the origin header."},{"id":"php-1gtdo1","n":18,"q":"How should passwords be stored?","qh":"How should passwords be stored?","level":"basic","hot":true,"a":"\u003cp>Use \u003ccode>password_hash($password, PASSWORD_DEFAULT)\u003c/code> (bcrypt, or \u003ccode>PASSWORD_ARGON2ID\u003c/code>) and \u003ccode>password_verify()\u003c/code>. It adds a \u003cstrong>unique salt\u003c/strong> automatically and is slow on purpose.\u003c/p>\n\u003cdiv class=\"callout callout-warn\">\u003cspan class=\"callout-label\">Watch out\u003c/span>\u003cp>Never use \u003ccode>md5\u003c/code>, \u003ccode>sha1\u003c/code> or plain \u003ccode>sha256\u003c/code> for passwords; they are too fast to brute-force. Never encrypt passwords (encryption can be reversed).\u003c/p>\u003c/div>","t":"use password_hash($password, password_default) (bcrypt, or password_argon2id ) and password_verify() . it adds a unique salt automatically and is slow on purpose. watch out never use md5 , sha1 or plain sha256 for passwords; they are too fast to brute-force. never encrypt passwords (encryption can be reversed)."},{"id":"php-g14eg1","n":19,"q":"How do you secure file uploads?","qh":"How do you secure file uploads?","level":"mid","hot":false,"a":"\u003cul>\u003cli>Validate \u003cstrong>MIME type from content\u003c/strong> (\u003ccode>finfo\u003c/code>), not just the extension; limit size.\u003c/li>\u003cli>Rename files (random name), store \u003cstrong>outside the web root\u003c/strong> or in S3.\u003c/li>\u003cli>Never execute uploaded files; disable PHP execution in the upload folder.\u003c/li>\u003cli>Scan for malware if needed; serve through signed URLs.\u003c/li>\u003c/ul>","t":"validate mime type from content ( finfo ), not just the extension; limit size. rename files (random name), store outside the web root or in s3. never execute uploaded files; disable php execution in the upload folder. scan for malware if needed; serve through signed urls."}]},{"title":"Composer & Standards","intro":"","qs":[{"id":"php-1ovp1v","n":20,"q":"What is Composer? `composer.json` vs `composer.lock`","qh":"What is Composer? \u003ccode>composer.json\u003c/code> vs \u003ccode>composer.lock\u003c/code>","level":"basic","hot":true,"a":"\u003cp>Composer is PHP's \u003cstrong>dependency manager\u003c/strong> and autoloader.\u003c/p>\n\u003cul>\u003cli>\u003ccode>composer.json\u003c/code>: the packages you want, with version \u003cstrong>ranges\u003c/strong> (\u003ccode>^10.0\u003c/code>).\u003c/li>\u003cli>\u003ccode>composer.lock\u003c/code>: the \u003cstrong>exact\u003c/strong> versions installed. Commit it so every machine and server gets the same versions.\u003c/li>\u003cli>\u003ccode>composer install\u003c/code> reads the lock file (use in CI/production); \u003ccode>composer update\u003c/code> resolves new versions and rewrites the lock.\u003c/li>\u003c/ul>\n\u003cp>Production: \u003ccode>composer install --no-dev --optimize-autoloader\u003c/code>.\u003c/p>","t":"composer is php's dependency manager and autoloader. composer.json : the packages you want, with version ranges ( ^10.0 ). composer.lock : the exact versions installed. commit it so every machine and server gets the same versions. composer install reads the lock file (use in ci/production); composer update resolves new versions and rewrites the lock. production: composer install --no-dev --optimize-autoloader ."},{"id":"php-uv8aal","n":21,"q":"What is PSR? Which ones matter?","qh":"What is PSR? Which ones matter?","level":"mid","hot":false,"a":"\u003cp>PHP Standards Recommendations from PHP-FIG:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>PSR-1/PSR-12\u003c/strong>: coding style.\u003c/li>\u003cli>\u003cstrong>PSR-4\u003c/strong>: autoloading (namespace → folder).\u003c/li>\u003cli>\u003cstrong>PSR-3\u003c/strong>: logger interface. \u003cstrong>PSR-7\u003c/strong>: HTTP messages. \u003cstrong>PSR-11\u003c/strong>: container interface. \u003cstrong>PSR-15\u003c/strong>: HTTP middleware.\u003c/li>\u003c/ul>","t":"php standards recommendations from php-fig: psr-1/psr-12 : coding style. psr-4 : autoloading (namespace → folder). psr-3 : logger interface. psr-7 : http messages. psr-11 : container interface. psr-15 : http middleware."}]}],"count":21},{"id":"react","title":"React","short":"React","color":"#0ea5c6","blurb":"Rendering and reconciliation, hooks in depth, state management, performance, data fetching, Next.js basics and the machine-coding questions you will meet.","cheats":["React re-renders a component when \u003cstrong>its state changes, its parent re-renders, or a context it uses changes\u003c/strong>. Props changing alone is not the trigger; the parent re-rendering is.","\u003cstrong>Reconciliation\u003c/strong>: React diffs the new element tree with the old one and updates only what changed. \u003cstrong>Keys\u003c/strong> identify list items.","Never use \u003cstrong>array index as key\u003c/strong> for lists that can reorder, insert or delete.","\u003ccode>useEffect\u003c/code> runs \u003cstrong>after paint\u003c/strong>; \u003ccode>useLayoutEffect\u003c/code> runs \u003cstrong>before paint\u003c/strong> (measure DOM).","\u003ccode>useMemo\u003c/code> caches a \u003cstrong>value\u003c/strong>, \u003ccode>useCallback\u003c/code> caches a \u003cstrong>function\u003c/strong>, \u003ccode>React.memo\u003c/code> skips re-rendering a \u003cstrong>component\u003c/strong> when props are equal.","State updates are \u003cstrong>batched\u003c/strong> and \u003cstrong>async\u003c/strong>; use the updater form \u003ccode>setCount(c =&gt; c + 1)\u003c/code> when the next value depends on the previous one.","Server state (API data) → \u003cstrong>React Query / SWR\u003c/strong>. Client/UI state → useState, Context, Zustand, Redux Toolkit.","Effects need \u003cstrong>cleanup\u003c/strong> for subscriptions, timers, and aborting fetches (\u003ccode>AbortController\u003c/code>).","Performance: code splitting (\u003ccode>lazy\u003c/code> + \u003ccode>Suspense\u003c/code>), list virtualization, memoization, avoid huge contexts."],"sections":[{"title":"Fundamentals","intro":"","qs":[{"id":"react-cexogu","n":1,"q":"What is the Virtual DOM and how does reconciliation work?","qh":"What is the Virtual DOM and how does reconciliation work?","level":"basic","hot":true,"a":"\u003cp>The \u003cstrong>Virtual DOM\u003c/strong> is a lightweight JS object tree describing the UI. On every render React builds a new tree, \u003cstrong>diffs\u003c/strong> it against the previous one (reconciliation), and applies the \u003cstrong>minimum set of real DOM changes\u003c/strong>.\u003c/p>\n\u003cp>Diffing rules (O(n) heuristics):\u003c/p>\n\u003cul>\u003cli>Different element \u003cstrong>type\u003c/strong> (\u003ccode>div\u003c/code> → \u003ccode>span\u003c/code>, \u003ccode>A\u003c/code> → \u003ccode>B\u003c/code>) → destroy and rebuild that subtree (state is lost).\u003c/li>\u003cli>Same type → keep the DOM node, update changed attributes, recurse into children.\u003c/li>\u003cli>Lists use \u003cstrong>keys\u003c/strong> to match items between renders.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>React Fiber\u003c/strong> (React 16+) splits rendering into units of work so React can pause, prioritise and resume it, which powers concurrent features like \u003ccode>useTransition\u003c/code>.\u003c/p>","t":"the virtual dom is a lightweight js object tree describing the ui. on every render react builds a new tree, diffs it against the previous one (reconciliation), and applies the minimum set of real dom changes . diffing rules (o(n) heuristics): different element type ( div → span , a → b ) → destroy and rebuild that subtree (state is lost). same type → keep the dom node, update changed attributes, recurse into children. lists use keys to match items between renders. react fiber (react 16+) splits rendering into units of work so react can pause, prioritise and resume it, which powers concurrent features like usetransition ."},{"id":"react-1dv91g","n":2,"q":"Why do keys matter? Why not use the index?","qh":"Why do keys matter? Why not use the index?","level":"basic","hot":true,"a":"\u003cp>Keys tell React \u003cstrong>which item is which\u003c/strong> between renders. With the index as key, inserting at the top shifts every key, so React \u003cstrong>reuses the wrong component instances\u003c/strong>. Symptoms: input values or checkbox state jump to the wrong row, animations break, extra re-renders.\u003c/p>\n\u003cp>\u003cmark>Use a stable, unique ID from the data\u003c/mark> (\u003ccode>item.id\u003c/code>). Index is only acceptable for static lists that never reorder.\u003c/p>","t":"keys tell react which item is which between renders. with the index as key, inserting at the top shifts every key, so react reuses the wrong component instances . symptoms: input values or checkbox state jump to the wrong row, animations break, extra re-renders. use a stable, unique id from the data ( item.id ). index is only acceptable for static lists that never reorder."},{"id":"react-sp3hoo","n":3,"q":"When does a React component re-render?","qh":"When does a React component re-render?","level":"mid","hot":true,"a":"\u003col>\u003cli>Its \u003cstrong>state\u003c/strong> changes (\u003ccode>setState\u003c/code> with a new value).\u003c/li>\u003cli>Its \u003cstrong>parent re-renders\u003c/strong> (by default all children re-render, even with the same props).\u003c/li>\u003cli>A \u003cstrong>context\u003c/strong> it consumes changes.\u003c/li>\u003cli>A custom hook it uses triggers a state change.\u003c/li>\u003c/ol>\n\u003cdiv class=\"callout callout-key\">\u003cspan class=\"callout-label\">Key point\u003c/span>\u003cp>&quot;Props changed&quot; is not the real reason; a child re-renders because its parent rendered. \u003ccode>React.memo\u003c/code> is what makes props comparison matter.\u003c/p>\u003c/div>","t":"its state changes ( setstate with a new value). its parent re-renders (by default all children re-render, even with the same props). a context it consumes changes. a custom hook it uses triggers a state change. key point \"props changed\" is not the real reason; a child re-renders because its parent rendered. react.memo is what makes props comparison matter."},{"id":"react-sqrxyb","n":4,"q":"Controlled vs uncontrolled components","qh":"Controlled vs uncontrolled components","level":"basic","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>Controlled\u003c/strong>: React state is the source of truth (\u003ccode>value\u003c/code> + \u003ccode>onChange\u003c/code>). Easy validation and conditional UI.\u003c/li>\u003cli>\u003cstrong>Uncontrolled\u003c/strong>: the DOM keeps the value; read it with a \u003ccode>ref\u003c/code>. Less re-rendering; used by React Hook Form for performance.\u003c/li>\u003c/ul>","t":"controlled : react state is the source of truth ( value + onchange ). easy validation and conditional ui. uncontrolled : the dom keeps the value; read it with a ref . less re-rendering; used by react hook form for performance."},{"id":"react-wqlxc4","n":5,"q":"Props vs state; what is \"lifting state up\"?","qh":"Props vs state; what is &quot;lifting state up&quot;?","level":"basic","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>Props\u003c/strong>: read-only inputs passed from parent.\u003c/li>\u003cli>\u003cstrong>State\u003c/strong>: data owned and changed by the component.\u003c/li>\u003c/ul>\n\u003cp>When two siblings need the same data, \u003cstrong>lift the state up\u003c/strong> to their closest common parent and pass it down as props. If the drilling goes too deep, use context or a store.\u003c/p>","t":"props : read-only inputs passed from parent. state : data owned and changed by the component. when two siblings need the same data, lift the state up to their closest common parent and pass it down as props. if the drilling goes too deep, use context or a store."}]},{"title":"Hooks","intro":"","qs":[{"id":"react-1ijgvs","n":6,"q":"Explain `useEffect` and its dependency array.","qh":"Explain \u003ccode>useEffect\u003c/code> and its dependency array.","level":"mid","hot":true,"a":"\u003cp>\u003ccode>useEffect\u003c/code> runs \u003cstrong>side effects after render\u003c/strong> (data fetching, subscriptions, timers, DOM APIs).\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Deps\u003c/th>\u003cth>Runs\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>none\u003c/td>\u003ctd>after \u003cstrong>every\u003c/strong> render\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>[]\u003c/code>\u003c/td>\u003ctd>once after mount (twice in dev StrictMode)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>[a, b]\u003c/code>\u003c/td>\u003ctd>after mount and whenever \u003ccode>a\u003c/code> or \u003ccode>b\u003c/code> changes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The function you return is the \u003cstrong>cleanup\u003c/strong>, run before the next effect and on unmount.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>jsx\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-jsx\">useEffect(() =&gt; {\n  const controller = new AbortController();\n  fetch(`/api/users/${id}`, { signal: controller.signal })\n    .then(r =&gt; r.json()).then(setUser)\n    .catch(e =&gt; { if (e.name !== 'AbortError') setError(e); });\n  return () =&gt; controller.abort(); // prevents race conditions &amp; updates after unmount\n}, [id]);\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"callout callout-tip\">\u003cspan class=\"callout-label\">Interview tip\u003c/span>\u003cp>Mention why StrictMode runs effects twice in development: to expose missing cleanups.\u003c/p>\u003c/div>","t":"useeffect runs side effects after render (data fetching, subscriptions, timers, dom apis). deps runs none after every render [] once after mount (twice in dev strictmode) [a, b] after mount and whenever a or b changes the function you return is the cleanup , run before the next effect and on unmount. jsx copy useeffect(() => { const controller = new abortcontroller(); fetch(`/api/users/${id}`, { signal: controller.signal }) .then(r => r.json()).then(setuser) .catch(e => { if (e.name !== 'aborterror') seterror(e); }); return () => controller.abort(); // prevents race conditions & updates after unmount }, [id]); interview tip mention why strictmode runs effects twice in development: to expose missing cleanups."},{"id":"react-axo2nr","n":7,"q":"`useMemo` vs `useCallback` vs `React.memo`","qh":"\u003ccode>useMemo\u003c/code> vs \u003ccode>useCallback\u003c/code> vs \u003ccode>React.memo\u003c/code>","level":"mid","hot":true,"a":"\u003cul>\u003cli>\u003ccode>useMemo(() =&gt; compute(a), [a])\u003c/code>: caches a \u003cstrong>computed value\u003c/strong>.\u003c/li>\u003cli>\u003ccode>useCallback(fn, [deps])\u003c/code>: caches a \u003cstrong>function reference\u003c/strong> (same as \u003ccode>useMemo(() =&gt; fn, deps)\u003c/code>).\u003c/li>\u003cli>\u003ccode>React.memo(Component)\u003c/code>: skips re-render if props are shallowly equal.\u003c/li>\u003c/ul>\n\u003cp>They work \u003cstrong>together\u003c/strong>: passing an inline function to a \u003ccode>React.memo\u003c/code> child breaks the memo because the function is new each render, so wrap it in \u003ccode>useCallback\u003c/code>.\u003c/p>\n\u003cdiv class=\"callout callout-warn\">\u003cspan class=\"callout-label\">Watch out\u003c/span>\u003cp>Don't memoize everything. Memoization has a cost; use it for expensive calculations, large lists, or props to memoized children. Measure with the React Profiler first. (The React Compiler can add memoization automatically.)\u003c/p>\u003c/div>","t":"usememo(() => compute(a), [a]) : caches a computed value . usecallback(fn, [deps]) : caches a function reference (same as usememo(() => fn, deps) ). react.memo(component) : skips re-render if props are shallowly equal. they work together : passing an inline function to a react.memo child breaks the memo because the function is new each render, so wrap it in usecallback . watch out don't memoize everything. memoization has a cost; use it for expensive calculations, large lists, or props to memoized children. measure with the react profiler first. (the react compiler can add memoization automatically.)"},{"id":"react-1juqdb","n":8,"q":"`useRef`: what is it used for?","qh":"\u003ccode>useRef\u003c/code>: what is it used for?","level":"basic","hot":false,"a":"\u003cp>A mutable box (\u003ccode>ref.current\u003c/code>) that \u003cstrong>persists across renders without causing a re-render\u003c/strong>.\u003c/p>\n\u003cul>\u003cli>Access DOM nodes (focus an input, measure size).\u003c/li>\u003cli>Store values like timer IDs, previous values, latest callback, &quot;is mounted&quot; flags.\u003c/li>\u003c/ul>","t":"a mutable box ( ref.current ) that persists across renders without causing a re-render . access dom nodes (focus an input, measure size). store values like timer ids, previous values, latest callback, \"is mounted\" flags."},{"id":"react-qkjeer","n":9,"q":"`useState` vs `useReducer`","qh":"\u003ccode>useState\u003c/code> vs \u003ccode>useReducer\u003c/code>","level":"mid","hot":false,"a":"\u003cp>Use \u003ccode>useReducer\u003c/code> when state is \u003cstrong>complex\u003c/strong> (many related fields), the next state depends on the previous, or you want state transitions in one testable function (cart, multi-step form).\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>jsx\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-jsx\">function cartReducer(state, action) {\n  switch (action.type) {\n    case 'add': return { ...state, items: [...state.items, action.item] };\n    case 'remove': return { ...state, items: state.items.filter(i =&gt; i.id !== action.id) };\n    default: return state;\n  }\n}\nconst [cart, dispatch] = useReducer(cartReducer, { items: [] });\u003c/code>\u003c/pre>\u003c/div>","t":"use usereducer when state is complex (many related fields), the next state depends on the previous, or you want state transitions in one testable function (cart, multi-step form). jsx copy function cartreducer(state, action) { switch (action.type) { case 'add': return { ...state, items: [...state.items, action.item] }; case 'remove': return { ...state, items: state.items.filter(i => i.id !== action.id) }; default: return state; } } const [cart, dispatch] = usereducer(cartreducer, { items: [] });"},{"id":"react-z089yi","n":10,"q":"What are custom hooks? Write one.","qh":"What are custom hooks? Write one.","level":"mid","hot":true,"a":"\u003cp>A function starting with \u003ccode>use\u003c/code> that \u003cstrong>reuses stateful logic\u003c/strong> between components. Each component using it gets its own state.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>jsx\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-jsx\">function useDebounce(value, delay = 400) {\n  const [debounced, setDebounced] = useState(value);\n  useEffect(() =&gt; {\n    const t = setTimeout(() =&gt; setDebounced(value), delay);\n    return () =&gt; clearTimeout(t);\n  }, [value, delay]);\n  return debounced;\n}\n// usage: search box that calls the API only after the user stops typing\nconst q = useDebounce(search);\nuseEffect(() =&gt; { if (q) fetchResults(q); }, [q]);\u003c/code>\u003c/pre>\u003c/div>","t":"a function starting with use that reuses stateful logic between components. each component using it gets its own state. jsx copy function usedebounce(value, delay = 400) { const [debounced, setdebounced] = usestate(value); useeffect(() => { const t = settimeout(() => setdebounced(value), delay); return () => cleartimeout(t); }, [value, delay]); return debounced; } // usage: search box that calls the api only after the user stops typing const q = usedebounce(search); useeffect(() => { if (q) fetchresults(q); }, [q]);"},{"id":"react-1gf5ni","n":11,"q":"Rules of hooks; why do they exist?","qh":"Ru
