les of hooks; why do they exist?","level":"basic","hot":false,"a":"\u003col>\u003cli>Call hooks \u003cstrong>only at the top level\u003c/strong>, never in loops, conditions or nested functions.\u003c/li>\u003cli>Call them only from \u003cstrong>React function components or custom hooks\u003c/strong>.\u003c/li>\u003c/ol>\n\u003cp>React stores hook state in a \u003cstrong>list ordered by call position\u003c/strong>. If the order changes between renders, state gets attached to the wrong hook.\u003c/p>","t":"call hooks only at the top level , never in loops, conditions or nested functions. call them only from react function components or custom hooks . react stores hook state in a list ordered by call position . if the order changes between renders, state gets attached to the wrong hook."},{"id":"react-19vpzf","n":12,"q":"What is a stale closure?","qh":"What is a stale closure?","level":"senior","hot":false,"a":"\u003cp>A function captures variables from the render it was created in. If it runs later (interval, event listener, effect with missing deps), it sees \u003cstrong>old values\u003c/strong>.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>jsx\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-jsx\">useEffect(() =&gt; {\n  const id = setInterval(() =&gt; setCount(count + 1), 1000); // always uses count from first render\n  return () =&gt; clearInterval(id);\n}, []);\n// Fix: setCount(c =&gt; c + 1)  or include count in deps  or keep latest value in a ref\u003c/code>\u003c/pre>\u003c/div>","t":"a function captures variables from the render it was created in. if it runs later (interval, event listener, effect with missing deps), it sees old values . jsx copy useeffect(() => { const id = setinterval(() => setcount(count + 1), 1000); // always uses count from first render return () => clearinterval(id); }, []); // fix: setcount(c => c + 1) or include count in deps or keep latest value in a ref"}]},{"title":"State Management","intro":"","qs":[{"id":"react-ngjfat","n":13,"q":"Context API vs Redux vs Zustand vs React Query","qh":"Context API vs Redux vs Zustand vs React Query","level":"mid","hot":true,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tool\u003c/th>\u003cth>Best for\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Context\u003c/strong>\u003c/td>\u003ctd>Rarely-changing global values: theme, auth user, locale. Every consumer re-renders when the value changes.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Redux Toolkit\u003c/strong>\u003c/td>\u003ctd>Large apps, complex shared client state, devtools, strict patterns.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Zustand\u003c/strong>\u003c/td>\u003ctd>Simple global store with selectors; minimal boilerplate.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>React Query / SWR\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Server state\u003c/strong>: caching, refetching, deduping, retries, pagination.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout callout-say\">\u003cspan class=\"callout-label\">Say it like this\u003c/span>\u003cp>&quot;I separate server state from client state. API data goes in React Query; UI state like modals and filters stays local or in a small Zustand store. Context is for things that rarely change.&quot;\u003c/p>\u003c/div>","t":"tool best for context rarely-changing global values: theme, auth user, locale. every consumer re-renders when the value changes. redux toolkit large apps, complex shared client state, devtools, strict patterns. zustand simple global store with selectors; minimal boilerplate. react query / swr server state : caching, refetching, deduping, retries, pagination. say it like this \"i separate server state from client state. api data goes in react query; ui state like modals and filters stays local or in a small zustand store. context is for things that rarely change.\""},{"id":"react-1eyad6","n":14,"q":"Why can Context cause performance problems?","qh":"Why can Context cause performance problems?","level":"senior","hot":false,"a":"\u003cp>When the provider's \u003ccode>value\u003c/code> changes, \u003cstrong>every consumer re-renders\u003c/strong>. If you pass a new object each render (\u003ccode>value={{ user, setUser }}\u003c/code>), all consumers re-render on every parent render.\u003c/p>\n\u003cp>Fixes: memoize the value with \u003ccode>useMemo\u003c/code>, \u003cstrong>split contexts\u003c/strong> (state vs dispatch, or by domain), keep fast-changing values out of context, or use a store with selectors (Zustand, Redux).\u003c/p>","t":"when the provider's value changes, every consumer re-renders . if you pass a new object each render ( value={{ user, setuser }} ), all consumers re-render on every parent render. fixes: memoize the value with usememo , split contexts (state vs dispatch, or by domain), keep fast-changing values out of context, or use a store with selectors (zustand, redux)."}]},{"title":"Performance","intro":"","qs":[{"id":"react-6o7qqq","n":15,"q":"How do you optimise a slow React app?","qh":"How do you optimise a slow React app?","level":"senior","hot":true,"a":"\u003col>\u003cli>\u003cstrong>Measure\u003c/strong>: React DevTools Profiler, Lighthouse, Web Vitals (LCP, INP, CLS).\u003c/li>\u003cli>\u003cstrong>Reduce bundle\u003c/strong>: code splitting with \u003ccode>React.lazy\u003c/code> + \u003ccode>Suspense\u003c/code>, route-based splitting, tree-shaking, remove heavy libraries (moment → date-fns/dayjs).\u003c/li>\u003cli>\u003cstrong>Avoid needless re-renders\u003c/strong>: move state down, \u003ccode>React.memo\u003c/code>, \u003ccode>useMemo\u003c/code>/\u003ccode>useCallback\u003c/code>, split contexts.\u003c/li>\u003cli>\u003cstrong>Virtualize long lists\u003c/strong> (\u003ccode>react-window\u003c/code>, TanStack Virtual) instead of rendering 10,000 rows.\u003c/li>\u003cli>\u003cstrong>Debounce/throttle\u003c/strong> search inputs and scroll handlers.\u003c/li>\u003cli>Images: lazy loading, proper sizes, modern formats (WebP/AVIF).\u003c/li>\u003cli>\u003ccode>useTransition\u003c/code> / \u003ccode>useDeferredValue\u003c/code> to keep typing smooth during heavy updates.\u003c/li>\u003cli>Server-side rendering / static generation for faster first paint (Next.js).\u003c/li>\u003c/ol>","t":"measure : react devtools profiler, lighthouse, web vitals (lcp, inp, cls). reduce bundle : code splitting with react.lazy + suspense , route-based splitting, tree-shaking, remove heavy libraries (moment → date-fns/dayjs). avoid needless re-renders : move state down, react.memo , usememo / usecallback , split contexts. virtualize long lists ( react-window , tanstack virtual) instead of rendering 10,000 rows. debounce/throttle search inputs and scroll handlers. images: lazy loading, proper sizes, modern formats (webp/avif). usetransition / usedeferredvalue to keep typing smooth during heavy updates. server-side rendering / static generation for faster first paint (next.js)."},{"id":"react-13vstg","n":16,"q":"What are `useTransition` and `useDeferredValue`?","qh":"What are \u003ccode>useTransition\u003c/code> and \u003ccode>useDeferredValue\u003c/code>?","level":"senior","hot":false,"a":"\u003cp>Concurrent React features to keep the UI responsive.\u003c/p>\n\u003cul>\u003cli>\u003ccode>useTransition\u003c/code>: mark a state update as \u003cstrong>non-urgent\u003c/strong>; urgent updates (typing) are not blocked. Gives an \u003ccode>isPending\u003c/code> flag.\u003c/li>\u003cli>\u003ccode>useDeferredValue\u003c/code>: get a \u003cstrong>lagging copy\u003c/strong> of a value, so expensive children render with the old value while the input stays snappy.\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>jsx\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-jsx\">const [isPending, startTransition] = useTransition();\nconst onChange = (e) =&gt; {\n  setQuery(e.target.value);                         // urgent\n  startTransition(() =&gt; setFiltered(filter(e.target.value))); // can wait\n};\u003c/code>\u003c/pre>\u003c/div>","t":"concurrent react features to keep the ui responsive. usetransition : mark a state update as non-urgent ; urgent updates (typing) are not blocked. gives an ispending flag. usedeferredvalue : get a lagging copy of a value, so expensive children render with the old value while the input stays snappy. jsx copy const [ispending, starttransition] = usetransition(); const onchange = (e) => { setquery(e.target.value); // urgent starttransition(() => setfiltered(filter(e.target.value))); // can wait };"}]},{"title":"Patterns & Ecosystem","intro":"","qs":[{"id":"react-19j6kh","n":17,"q":"What are error boundaries?","qh":"What are error boundaries?","level":"mid","hot":false,"a":"\u003cp>Class components with \u003ccode>componentDidCatch\u003c/code> / \u003ccode>getDerivedStateFromError\u003c/code> that \u003cstrong>catch render errors in their child tree\u003c/strong> and show a fallback UI instead of a blank page.\u003c/p>\n\u003cp>They do \u003cstrong>not\u003c/strong> catch errors in event handlers, async code (\u003ccode>setTimeout\u003c/code>, promises) or SSR; handle those with try/catch. Libraries: \u003ccode>react-error-boundary\u003c/code>.\u003c/p>","t":"class components with componentdidcatch / getderivedstatefromerror that catch render errors in their child tree and show a fallback ui instead of a blank page. they do not catch errors in event handlers, async code ( settimeout , promises) or ssr; handle those with try/catch. libraries: react-error-boundary ."},{"id":"react-1vob7j","n":18,"q":"HOC vs render props vs custom hooks","qh":"HOC vs render props vs custom hooks","level":"mid","hot":false,"a":"\u003cp>All share logic between components. \u003cstrong>Custom hooks\u003c/strong> replaced most HOC and render-prop use because they don't add wrapper components and are easier to compose. HOCs still appear for cross-cutting concerns (\u003ccode>withAuth\u003c/code>, \u003ccode>connect\u003c/code> in old Redux).\u003c/p>","t":"all share logic between components. custom hooks replaced most hoc and render-prop use because they don't add wrapper components and are easier to compose. hocs still appear for cross-cutting concerns ( withauth , connect in old redux)."},{"id":"react-1hl4ir","n":19,"q":"CSR vs SSR vs SSG vs ISR (Next.js)","qh":"CSR vs SSR vs SSG vs ISR (Next.js)","level":"mid","hot":true,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>How\u003c/th>\u003cth>Good for\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>CSR\u003c/strong>\u003c/td>\u003ctd>Browser downloads JS, renders\u003c/td>\u003ctd>Dashboards behind login\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>SSR\u003c/strong>\u003c/td>\u003ctd>Server renders HTML per request\u003c/td>\u003ctd>SEO + fresh data (product pages)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>SSG\u003c/strong>\u003c/td>\u003ctd>HTML built at build time\u003c/td>\u003ctd>Blogs, docs, marketing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>ISR\u003c/strong>\u003c/td>\u003ctd>SSG + regenerate after N seconds\u003c/td>\u003ctd>Large catalogues\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>React Server Components\u003c/strong> (Next.js App Router) render on the server and send no JS for those components; use \u003ccode>'use client'\u003c/code> only for interactive parts.\u003c/p>","t":"how good for csr browser downloads js, renders dashboards behind login ssr server renders html per request seo + fresh data (product pages) ssg html built at build time blogs, docs, marketing isr ssg + regenerate after n seconds large catalogues react server components (next.js app router) render on the server and send no js for those components; use 'use client' only for interactive parts."},{"id":"react-1r8mbq","n":20,"q":"How do you handle authentication in a React SPA?","qh":"How do you handle authentication in a React SPA?","level":"mid","hot":true,"a":"\u003cul>\u003cli>Store tokens in an \u003cstrong>httpOnly, Secure cookie\u003c/strong> (safe from XSS) rather than localStorage.\u003c/li>\u003cli>Keep the user in context/store; protect routes with a wrapper (\u003ccode>&lt;RequireAuth&gt;\u003c/code>) that redirects to login.\u003c/li>\u003cli>Axios/fetch interceptor: on \u003cstrong>401\u003c/strong>, call the refresh endpoint once, retry the original request, and queue other requests while refreshing.\u003c/li>\u003cli>Remember the frontend check is only UX. \u003cmark>The API must authorize every request.\u003c/mark>\u003c/li>\u003c/ul>","t":"store tokens in an httponly, secure cookie (safe from xss) rather than localstorage. keep the user in context/store; protect routes with a wrapper ( \u003crequireauth> ) that redirects to login. axios/fetch interceptor: on 401 , call the refresh endpoint once, retry the original request, and queue other requests while refreshing. remember the frontend check is only ux. the api must authorize every request."},{"id":"react-45zc83","n":21,"q":"Machine coding: what do interviewers usually ask?","qh":"Machine coding: what do interviewers usually ask?","level":"mid","hot":true,"a":"\u003cp>Common 45–60 minute tasks:\u003c/p>\n\u003cul>\u003cli>Debounced \u003cstrong>search with autocomplete\u003c/strong> (cancel stale requests).\u003c/li>\u003cli>\u003cstrong>Infinite scroll\u003c/strong> / pagination with IntersectionObserver.\u003c/li>\u003cli>Todo app with filters and localStorage.\u003c/li>\u003cli>\u003cstrong>Star rating\u003c/strong>, accordion, tabs, modal, carousel.\u003c/li>\u003cli>Form with validation, OTP input.\u003c/li>\u003cli>Nested comments / file explorer (recursion).\u003c/li>\u003cli>Countdown timer / stopwatch (cleanup of intervals).\u003c/li>\u003c/ul>\n\u003cdiv class=\"callout callout-tip\">\u003cspan class=\"callout-label\">Interview tip\u003c/span>\u003cp>Talk while coding: state shape first, then components, then edge cases (empty, loading, error, rapid clicks). Write a custom hook if logic repeats.\u003c/p>\u003c/div>","t":"common 45–60 minute tasks: debounced search with autocomplete (cancel stale requests). infinite scroll / pagination with intersectionobserver. todo app with filters and localstorage. star rating , accordion, tabs, modal, carousel. form with validation, otp input. nested comments / file explorer (recursion). countdown timer / stopwatch (cleanup of intervals). interview tip talk while coding: state shape first, then components, then edge cases (empty, loading, error, rapid clicks). write a custom hook if logic repeats."}]}],"count":21},{"id":"typescript","title":"TypeScript","short":"TypeScript","color":"#3178c6","blurb":"Types vs interfaces, generics, narrowing, utility types, unknown vs any, typing React and APIs, and the tsconfig settings that matter.","cheats":["TypeScript is \u003cstrong>compile-time only\u003c/strong>; types are erased, so validate API data at runtime (zod).","\u003ccode>interface\u003c/code> can be \u003cstrong>merged and extended\u003c/strong>; \u003ccode>type\u003c/code> can describe \u003cstrong>unions, tuples, mapped and conditional\u003c/strong> types.","\u003cmark>\u003ccode>unknown\u003c/code> is the safe \u003ccode>any\u003c/code>\u003c/mark>: you must narrow it before use.","\u003ccode>never\u003c/code> = a value that can't exist; use it for \u003cstrong>exhaustive checks\u003c/strong> in \u003ccode>switch\u003c/code>.","Narrowing: \u003ccode>typeof\u003c/code>, \u003ccode>instanceof\u003c/code>, \u003ccode>in\u003c/code>, equality, \u003cstrong>discriminated unions\u003c/strong>, custom type guards \u003ccode>x is T\u003c/code>.","Utility types: \u003ccode>Partial\u003c/code>, \u003ccode>Required\u003c/code>, \u003ccode>Readonly\u003c/code>, \u003ccode>Pick\u003c/code>, \u003ccode>Omit\u003c/code>, \u003ccode>Record\u003c/code>, \u003ccode>ReturnType\u003c/code>, \u003ccode>Parameters\u003c/code>, \u003ccode>Awaited\u003c/code>, \u003ccode>NonNullable\u003c/code>.","Generics = type parameters; constrain with \u003ccode>extends\u003c/code>.","Turn on \u003ccode>&quot;strict&quot;: true\u003c/code>; it enables \u003ccode>strictNullChecks\u003c/code>, \u003ccode>noImplicitAny\u003c/code> and more.","\u003ccode>satisfies\u003c/code> checks a value against a type \u003cstrong>without widening\u003c/strong> its inferred type."],"sections":[{"title":"Basics","intro":"","qs":[{"id":"typescript-igc2qm","n":1,"q":"Why TypeScript? What are its benefits?","qh":"Why TypeScript? What are its benefits?","level":"basic","hot":true,"a":"\u003cp>TypeScript is \u003cstrong>JavaScript with static types\u003c/strong>, compiled to plain JS.\u003c/p>\n\u003cul>\u003cli>Catches bugs \u003cstrong>at compile time\u003c/strong> (typos, wrong argument types, null access).\u003c/li>\u003cli>Better \u003cstrong>autocomplete and refactoring\u003c/strong> in editors.\u003c/li>\u003cli>Types act as \u003cstrong>documentation\u003c/strong> and contracts between frontend and backend.\u003c/li>\u003cli>Safer large-scale refactors in big teams.\u003c/li>\u003c/ul>\n\u003cdiv class=\"callout callout-warn\">\u003cspan class=\"callout-label\">Watch out\u003c/span>\u003cp>Types disappear at runtime. Data from an API, form or \u003ccode>JSON.parse\u003c/code> is not checked automatically; validate it with zod, valibot or similar.\u003c/p>\u003c/div>","t":"typescript is javascript with static types , compiled to plain js. catches bugs at compile time (typos, wrong argument types, null access). better autocomplete and refactoring in editors. types act as documentation and contracts between frontend and backend. safer large-scale refactors in big teams. watch out types disappear at runtime. data from an api, form or json.parse is not checked automatically; validate it with zod, valibot or similar."},{"id":"typescript-hrkty9","n":2,"q":"`type` vs `interface`","qh":"\u003ccode>type\u003c/code> vs \u003ccode>interface\u003c/code>","level":"basic","hot":true,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>\u003ccode>interface\u003c/code>\u003c/th>\u003cth>\u003ccode>type\u003c/code>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Objects\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unions / tuples / primitives\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Extend\u003c/td>\u003ctd>\u003ccode>extends\u003c/code>\u003c/td>\u003ctd>Intersection \u003ccode>&amp;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Declaration merging\u003c/td>\u003ctd>\u003cstrong>Yes\u003c/strong> (same name merges)\u003c/td>\u003ctd>No (duplicate error)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mapped / conditional types\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cmark>Common rule: \u003ccode>interface\u003c/code> for object shapes and public APIs (extendable), \u003ccode>type\u003c/code> for unions, function types and complex compositions.\u003c/mark> Teams mainly just stay consistent.\u003c/p>","t":"interface type objects yes yes unions / tuples / primitives no yes extend extends intersection & declaration merging yes (same name merges) no (duplicate error) mapped / conditional types no yes common rule: interface for object shapes and public apis (extendable), type for unions, function types and complex compositions. teams mainly just stay consistent."},{"id":"typescript-18lj0y","n":3,"q":"`any` vs `unknown` vs `never` vs `void`","qh":"\u003ccode>any\u003c/code> vs \u003ccode>unknown\u003c/code> vs \u003ccode>never\u003c/code> vs \u003ccode>void\u003c/code>","level":"mid","hot":true,"a":"\u003cul>\u003cli>\u003ccode>any\u003c/code>: turns type checking \u003cstrong>off\u003c/strong>. Avoid it.\u003c/li>\u003cli>\u003ccode>unknown\u003c/code>: &quot;could be anything&quot;, but you must \u003cstrong>narrow\u003c/strong> it before using it. Use for \u003ccode>catch (e)\u003c/code> and external input.\u003c/li>\u003cli>\u003ccode>never\u003c/code>: no value can have this type: functions that always throw, impossible branches.\u003c/li>\u003cli>\u003ccode>void\u003c/code>: function returns nothing useful.\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>ts\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-ts\">function handle(e: unknown) {\n  if (e instanceof Error) console.log(e.message); // OK after narrowing\n}\u003c/code>\u003c/pre>\u003c/div>","t":"any : turns type checking off . avoid it. unknown : \"could be anything\", but you must narrow it before using it. use for catch (e) and external input. never : no value can have this type: functions that always throw, impossible branches. void : function returns nothing useful. ts copy function handle(e: unknown) { if (e instanceof error) console.log(e.message); // ok after narrowing }"},{"id":"typescript-j5w9xh","n":4,"q":"What is type inference?","qh":"What is type inference?","level":"basic","hot":false,"a":"\u003cp>TS works out types when you don't write them: \u003ccode>let n = 5\u003c/code> is \u003ccode>number\u003c/code>; a function's return type is inferred from its \u003ccode>return\u003c/code>. Annotate \u003cstrong>function parameters and public APIs\u003c/strong>; let inference do local variables.\u003c/p>","t":"ts works out types when you don't write them: let n = 5 is number ; a function's return type is inferred from its return . annotate function parameters and public apis ; let inference do local variables."}]},{"title":"Advanced Types","intro":"","qs":[{"id":"typescript-65gbmy","n":5,"q":"What are generics? Give a real example.","qh":"What are generics? Give a real example.","level":"mid","hot":true,"a":"\u003cp>Generics let a function, class or type work with \u003cstrong>many types while keeping type safety\u003c/strong>: a &quot;type parameter&quot;.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>ts\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-ts\">async function fetchJson&lt;T&gt;(url: string): Promise&lt;T&gt; {\n  const res = await fetch(url);\n  if (!res.ok) throw new Error(`HTTP ${res.status}`);\n  return res.json() as Promise&lt;T&gt;;\n}\nconst users = await fetchJson&lt;User[]&gt;('/api/users'); // users: User[]\n\n// Constraint\nfunction getProp&lt;T, K extends keyof T&gt;(obj: T, key: K): T[K] { return obj[key]; }\n\n// Generic API response\ninterface ApiResponse&lt;T&gt; { data: T; meta?: { page: number; total: number } }\u003c/code>\u003c/pre>\u003c/div>","t":"generics let a function, class or type work with many types while keeping type safety : a \"type parameter\". ts copy async function fetchjson\u003ct>(url: string): promise\u003ct> { const res = await fetch(url); if (!res.ok) throw new error(`http ${res.status}`); return res.json() as promise\u003ct>; } const users = await fetchjson\u003cuser[]>('/api/users'); // users: user[] // constraint function getprop\u003ct, k extends keyof t>(obj: t, key: k): t[k] { return obj[key]; } // generic api response interface apiresponse\u003ct> { data: t; meta?: { page: number; total: number } }"},{"id":"typescript-1uz4mc","n":6,"q":"What is type narrowing and what are type guards?","qh":"What is type narrowing and what are type guards?","level":"mid","hot":true,"a":"\u003cp>\u003cstrong>Narrowing\u003c/strong> = TS refines a broad type to a specific one inside a branch.\u003c/p>\n\u003cul>\u003cli>\u003ccode>typeof x === 'string'\u003c/code>\u003c/li>\u003cli>\u003ccode>x instanceof Date\u003c/code>\u003c/li>\u003cli>\u003ccode>'email' in user\u003c/code>\u003c/li>\u003cli>Equality / truthiness checks\u003c/li>\u003cli>\u003cstrong>Custom type guard\u003c/strong> with \u003ccode>is\u003c/code>:\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>ts\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-ts\">function isAdmin(u: User | Admin): u is Admin {\n  return (u as Admin).permissions !== undefined;\n}\u003c/code>\u003c/pre>\u003c/div>","t":"narrowing = ts refines a broad type to a specific one inside a branch. typeof x === 'string' x instanceof date 'email' in user equality / truthiness checks custom type guard with is : ts copy function isadmin(u: user | admin): u is admin { return (u as admin).permissions !== undefined; }"},{"id":"typescript-dnhrmx","n":7,"q":"What are discriminated unions? Why are they useful?","qh":"What are discriminated unions? Why are they useful?","level":"senior","hot":true,"a":"\u003cp>A union where every member has a common \u003cstrong>literal field\u003c/strong> (the discriminant). TS narrows by checking it, and \u003ccode>never\u003c/code> gives \u003cstrong>exhaustive checking\u003c/strong>.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>ts\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-ts\">type PaymentState =\n  | { status: 'idle' }\n  | { status: 'processing'; orderId: string }\n  | { status: 'success'; paymentId: string }\n  | { status: 'failed'; error: string };\n\nfunction render(s: PaymentState) {\n  switch (s.status) {\n    case 'idle': return 'Pay now';\n    case 'processing': return `Processing ${s.orderId}`;\n    case 'success': return `Paid: ${s.paymentId}`;\n    case 'failed': return s.error;\n    default: { const _exhaustive: never = s; return _exhaustive; } // compile error if a case is missing\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cmark>This makes impossible states impossible\u003c/mark>, e.g. you can't have \u003ccode>paymentId\u003c/code> while still \u003ccode>processing\u003c/code>.\u003c/p>","t":"a union where every member has a common literal field (the discriminant). ts narrows by checking it, and never gives exhaustive checking . ts copy type paymentstate = | { status: 'idle' } | { status: 'processing'; orderid: string } | { status: 'success'; paymentid: string } | { status: 'failed'; error: string }; function render(s: paymentstate) { switch (s.status) { case 'idle': return 'pay now'; case 'processing': return `processing ${s.orderid}`; case 'success': return `paid: ${s.paymentid}`; case 'failed': return s.error; default: { const _exhaustive: never = s; return _exhaustive; } // compile error if a case is missing } } this makes impossible states impossible , e.g. you can't have paymentid while still processing ."},{"id":"typescript-1yf291","n":8,"q":"Explain the common utility types.","qh":"Explain the common utility types.","level":"mid","hot":true,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Utility\u003c/th>\u003cth>Does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>Partial&lt;T&gt;\u003c/code>\u003c/td>\u003ctd>All props optional (PATCH bodies)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Required&lt;T&gt;\u003c/code>\u003c/td>\u003ctd>All props required\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Readonly&lt;T&gt;\u003c/code>\u003c/td>\u003ctd>All props readonly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Pick&lt;T, 'a' | 'b'&gt;\u003c/code>\u003c/td>\u003ctd>Keep some props\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Omit&lt;T, 'password'&gt;\u003c/code>\u003c/td>\u003ctd>Remove some props\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Record&lt;K, V&gt;\u003c/code>\u003c/td>\u003ctd>Object with keys K and values V\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ReturnType&lt;typeof fn&gt;\u003c/code>\u003c/td>\u003ctd>Return type of a function\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Parameters&lt;typeof fn&gt;\u003c/code>\u003c/td>\u003ctd>Tuple of parameter types\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Awaited&lt;T&gt;\u003c/code>\u003c/td>\u003ctd>Unwrap a Promise type\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>NonNullable&lt;T&gt;\u003c/code>\u003c/td>\u003ctd>Remove \u003ccode>null\u003c/code> / \u003ccode>undefined\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Exclude\u003c/code> / \u003ccode>Extract\u003c/code>\u003c/td>\u003ctd>Filter union members\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>ts\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-ts\">type PublicUser = Omit&lt;User, 'password' | 'otpSecret'&gt;;\ntype UpdateUserDto = Partial&lt;Pick&lt;User, 'name' | 'phone'&gt;&gt;;\u003c/code>\u003c/pre>\u003c/div>","t":"utility does partial\u003ct> all props optional (patch bodies) required\u003ct> all props required readonly\u003ct> all props readonly pick\u003ct, 'a' | 'b'> keep some props omit\u003ct, 'password'> remove some props record\u003ck, v> object with keys k and values v returntype\u003ctypeof fn> return type of a function parameters\u003ctypeof fn> tuple of parameter types awaited\u003ct> unwrap a promise type nonnullable\u003ct> remove null / undefined exclude / extract filter union members ts copy type publicuser = omit\u003cuser, 'password' | 'otpsecret'>; type updateuserdto = partial\u003cpick\u003cuser, 'name' | 'phone'>>;"},{"id":"typescript-1cpgzx","n":9,"q":"What are mapped and conditional types?","qh":"What are mapped and conditional types?","level":"senior","hot":false,"a":"\u003cp>\u003cstrong>Mapped types\u003c/strong> build a new type by looping over keys; \u003cstrong>conditional types\u003c/strong> choose a type with \u003ccode>T extends U ? X : Y\u003c/code>.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>ts\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-ts\">type Nullable&lt;T&gt; = { [K in keyof T]: T[K] | null };\ntype ApiResult&lt;T&gt; = T extends Error ? { ok: false; error: T } : { ok: true; data: T };\ntype ElementOf&lt;T&gt; = T extends (infer U)[] ? U : never;   // infer pulls out a type\u003c/code>\u003c/pre>\u003c/div>","t":"mapped types build a new type by looping over keys; conditional types choose a type with t extends u ? x : y . ts copy type nullable\u003ct> = { [k in keyof t]: t[k] | null }; type apiresult\u003ct> = t extends error ? { ok: false; error: t } : { ok: true; data: t }; type elementof\u003ct> = t extends (infer u)[] ? u : never; // infer pulls out a type"},{"id":"typescript-x8wgu9","n":10,"q":"`keyof`, `typeof` and indexed access types","qh":"\u003ccode>keyof\u003c/code>, \u003ccode>typeof\u003c/code> and indexed access types","level":"mid","hot":false,"a":"\u003cul>\u003cli>\u003ccode>keyof User\u003c/code> → union of keys \u003ccode>'id' | 'name' | ...\u003c/code>\u003c/li>\u003cli>\u003ccode>typeof config\u003c/code> → the type of a value\u003c/li>\u003cli>\u003ccode>User['address']\u003c/code> → type of one property\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>ts\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-ts\">const ROLES = ['admin', 'editor', 'viewer'] as const;\ntype Role = typeof ROLES[number]; // 'admin' | 'editor' | 'viewer'\u003c/code>\u003c/pre>\u003c/div>","t":"keyof user → union of keys 'id' | 'name' | ... typeof config → the type of a value user['address'] → type of one property ts copy const roles = ['admin', 'editor', 'viewer'] as const; type role = typeof roles[number]; // 'admin' | 'editor' | 'viewer'"},{"id":"typescript-z7882p","n":11,"q":"What does `satisfies` do?","qh":"What does \u003ccode>satisfies\u003c/code> do?","level":"senior","hot":false,"a":"\u003cp>Checks that a value matches a type \u003cstrong>but keeps the narrower inferred type\u003c/strong>, unlike an annotation which widens it.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>ts\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-ts\">const routes = { home: '/', profile: '/me' } satisfies Record&lt;string, string&gt;;\nroutes.home; // still known as a key; typos like routes.hom are errors\u003c/code>\u003c/pre>\u003c/div>","t":"checks that a value matches a type but keeps the narrower inferred type , unlike an annotation which widens it. ts copy const routes = { home: '/', profile: '/me' } satisfies record\u003cstring, string>; routes.home; // still known as a key; typos like routes.hom are errors"}]},{"title":"In Practice","intro":"","qs":[{"id":"typescript-14guss","n":12,"q":"How do you type React components and hooks?","qh":"How do you type React components and hooks?","level":"mid","hot":true,"a":"\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>tsx\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-tsx\">type ButtonProps = {\n  variant?: 'primary' | 'ghost';\n  onClick?: (e: React.MouseEvent&lt;HTMLButtonElement&gt;) =&gt; void;\n} &amp; React.ComponentPropsWithoutRef&lt;'button'&gt;;\n\nexport function Button({ variant = 'primary', ...rest }: ButtonProps) {\n  return &lt;button className={variant} {...rest} /&gt;;\n}\n\nconst [user, setUser] = useState&lt;User | null&gt;(null);\nconst inputRef = useRef&lt;HTMLInputElement&gt;(null);\n\nfunction List&lt;T&gt;({ items, render }: { items: T[]; render: (item: T) =&gt; React.ReactNode }) {\n  return &lt;ul&gt;{items.map(render)}&lt;/ul&gt;;\n}\u003c/code>\u003c/pre>\u003c/div>","t":"tsx copy type buttonprops = { variant?: 'primary' | 'ghost'; onclick?: (e: react.mouseevent\u003chtmlbuttonelement>) => void; } & react.componentpropswithoutref\u003c'button'>; export function button({ variant = 'primary', ...rest }: buttonprops) { return \u003cbutton classname={variant} {...rest} />; } const [user, setuser] = usestate\u003cuser | null>(null); const inputref = useref\u003chtmlinputelement>(null); function list\u003ct>({ items, render }: { items: t[]; render: (item: t) => react.reactnode }) { return \u003cul>{items.map(render)}\u003c/ul>; }"},{"id":"typescript-1egzr8","n":13,"q":"How do you keep frontend and backend types in sync?","qh":"How do you keep frontend and backend types in sync?","level":"senior","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>Shared package\u003c/strong> in a monorepo (\u003ccode>packages/types\u003c/code>).\u003c/li>\u003cli>Generate types from an \u003cstrong>OpenAPI/Swagger\u003c/strong> spec (\u003ccode>openapi-typescript\u003c/code>).\u003c/li>\u003cli>\u003cstrong>zod schemas\u003c/strong> as the single source: \u003ccode>type User = z.infer&lt;typeof UserSchema&gt;\u003c/code>, and validate at runtime too.\u003c/li>\u003cli>End-to-end typed APIs: \u003cstrong>tRPC\u003c/strong>, GraphQL codegen.\u003c/li>\u003c/ul>","t":"shared package in a monorepo ( packages/types ). generate types from an openapi/swagger spec ( openapi-typescript ). zod schemas as the single source: type user = z.infer\u003ctypeof userschema> , and validate at runtime too. end-to-end typed apis: trpc , graphql codegen."},{"id":"typescript-1f5d78","n":14,"q":"Important `tsconfig` options","qh":"Important \u003ccode>tsconfig\u003c/code> options","level":"mid","hot":false,"a":"\u003cul>\u003cli>\u003ccode>strict: true\u003c/code> (always), \u003ccode>noUncheckedIndexedAccess\u003c/code> (array access may be undefined).\u003c/li>\u003cli>\u003ccode>target\u003c/code> / \u003ccode>module\u003c/code> / \u003ccode>moduleResolution\u003c/code> (\u003ccode>bundler\u003c/code> or \u003ccode>nodenext\u003c/code>).\u003c/li>\u003cli>\u003ccode>paths\u003c/code> + \u003ccode>baseUrl\u003c/code> for import aliases (\u003ccode>@/components\u003c/code>).\u003c/li>\u003cli>\u003ccode>esModuleInterop\u003c/code>, \u003ccode>skipLibCheck\u003c/code>, \u003ccode>isolatedModules\u003c/code> (needed by Vite/SWC/esbuild).\u003c/li>\u003c/ul>","t":"strict: true (always), nouncheckedindexedaccess (array access may be undefined). target / module / moduleresolution ( bundler or nodenext ). paths + baseurl for import aliases ( @/components ). esmoduleinterop , skiplibcheck , isolatedmodules (needed by vite/swc/esbuild)."},{"id":"typescript-b15yqp","n":15,"q":"What are declaration files (`.d.ts`)?","qh":"What are declaration files (\u003ccode>.d.ts\u003c/code>)?","level":"mid","hot":false,"a":"\u003cp>Files that contain \u003cstrong>only types\u003c/strong> for JavaScript code, so TS knows the shape of a JS library. Install from DefinitelyTyped (\u003ccode>npm i -D @types/express\u003c/code>) or write your own; extend global types with \u003cstrong>declaration merging\u003c/strong>:\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>ts\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-ts\">// types/express.d.ts\ndeclare global {\n  namespace Express { interface Request { user?: { id: string; role: Role } } }\n}\nexport {};\u003c/code>\u003c/pre>\u003c/div>","t":"files that contain only types for javascript code, so ts knows the shape of a js library. install from definitelytyped ( npm i -d @types/express ) or write your own; extend global types with declaration merging : ts copy // types/express.d.ts declare global { namespace express { interface request { user?: { id: string; role: role } } } } export {};"},{"id":"typescript-1exx5o","n":16,"q":"Enums vs union of string literals","qh":"Enums vs union of string literals","level":"mid","hot":false,"a":"\u003cp>TS \u003ccode>enum\u003c/code> generates runtime JS code and has some quirks (numeric enums accept any number). Many teams prefer \u003cstrong>string literal unions\u003c/strong> or \u003ccode>as const\u003c/code> objects, which are erased at compile time and work with narrowing.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>ts\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-ts\">const Status = { Pending: 'pending', Paid: 'paid' } as const;\ntype Status = typeof Status[keyof typeof Status]; // 'pending' | 'paid'\u003c/code>\u003c/pre>\u003c/div>","t":"ts enum generates runtime js code and has some quirks (numeric enums accept any number). many teams prefer string literal unions or as const objects, which are erased at compile time and work with narrowing. ts copy const status = { pending: 'pending', paid: 'paid' } as const; type status = typeof status[keyof typeof status]; // 'pending' | 'paid'"}]}],"count":16},{"id":"javascript","title":"JavaScript Core","short":"JavaScript","color":"#c9970a","blurb":"The fundamentals asked in every frontend and Node round: closures, this, prototypes, hoisting, the event loop, promises and the classic output and polyfill questions.","cheats":["\u003ccode>var\u003c/code> is function-scoped and hoisted as \u003ccode>undefined\u003c/code>; \u003ccode>let\u003c/code>/\u003ccode>const\u003c/code> are block-scoped and in the \u003cstrong>temporal dead zone\u003c/strong> until declared.","A \u003cstrong>closure\u003c/strong> is a function that remembers variables from the scope where it was created.","\u003ccode>this\u003c/code> depends on \u003cstrong>how a function is called\u003c/strong>; arrow functions take \u003ccode>this\u003c/code> from the surrounding scope.","Microtasks (\u003cstrong>Promises\u003c/strong>) run before macrotasks (\u003cstrong>setTimeout\u003c/strong>).","\u003ccode>==\u003c/code> coerces types, \u003ccode>===\u003c/code> doesn't. \u003ccode>null == undefined\u003c/code> is true; \u003ccode>NaN !== NaN\u003c/code>.","Objects and arrays are copied \u003cstrong>by reference\u003c/strong>; spread is a \u003cstrong>shallow\u003c/strong> copy; use \u003ccode>structuredClone\u003c/code> for deep copies.","Debounce = wait until calls stop; throttle = at most once per interval.","\u003ccode>call(this, a, b)\u003c/code>, \u003ccode>apply(this, [a, b])\u003c/code> run now; \u003ccode>bind(this)\u003c/code> returns a new function."],"sections":[{"title":"Scope & Closures","intro":"","qs":[{"id":"javascript-bdzqnv","n":1,"q":"`var` vs `let` vs `const`; what is hoisting?","qh":"\u003ccode>var\u003c/code> vs \u003ccode>let\u003c/code> vs \u003ccode>const\u003c/code>; what is hoisting?","level":"basic","hot":true,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Scope\u003c/th>\u003cth>Hoisted\u003c/th>\u003cth>Re-assign\u003c/th>\u003cth>Re-declare\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>var\u003c/code>\u003c/td>\u003ctd>Function\u003c/td>\u003ctd>Yes, as \u003ccode>undefined\u003c/code>\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>let\u003c/code>\u003c/td>\u003ctd>Block\u003c/td>\u003ctd>Yes, but in \u003cstrong>TDZ\u003c/strong>\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>const\u003c/code>\u003c/td>\u003ctd>Block\u003c/td>\u003ctd>Yes, but in \u003cstrong>TDZ\u003c/strong>\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Hoisting\u003c/strong>: declarations are moved to the top of their scope during compilation. Function declarations are hoisted \u003cstrong>with their body\u003c/strong>; function expressions are not.\u003c/p>\n\u003cdiv class=\"callout callout-warn\">\u003cspan class=\"callout-label\">Watch out\u003c/span>\u003cp>\u003ccode>const\u003c/code> stops re-assignment, not mutation: \u003ccode>const arr = []; arr.push(1)\u003c/code> works.\u003c/p>\u003c/div>","t":"scope hoisted re-assign re-declare var function yes, as undefined yes yes let block yes, but in tdz yes no const block yes, but in tdz no no hoisting : declarations are moved to the top of their scope during compilation. function declarations are hoisted with their body ; function expressions are not. watch out const stops re-assignment, not mutation: const arr = []; arr.push(1) works."},{"id":"javascript-fz4yuk","n":2,"q":"What is a closure? Give a practical use.","qh":"What is a closure? Give a practical use.","level":"basic","hot":true,"a":"\u003cp>A closure is a function \u003cstrong>bundled with references to its outer variables\u003c/strong>, even after the outer function has returned.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>js\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-js\">function createCounter() {\n  let count = 0;                 // private\n  return { inc: () =&gt; ++count, get: () =&gt; count };\n}\nconst c = createCounter();\nc.inc(); c.get(); // 1\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Uses: data privacy, function factories, memoization, debounce/throttle, event handlers, React hooks.\u003c/p>","t":"a closure is a function bundled with references to its outer variables , even after the outer function has returned. js copy function createcounter() { let count = 0; // private return { inc: () => ++count, get: () => count }; } const c = createcounter(); c.inc(); c.get(); // 1 uses: data privacy, function factories, memoization, debounce/throttle, event handlers, react hooks."},{"id":"javascript-1yr0fa","n":3,"q":"Classic: `var` in a loop with `setTimeout`","qh":"Classic: \u003ccode>var\u003c/code> in a loop with \u003ccode>setTimeout\u003c/code>","level":"mid","hot":true,"a":"\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>js\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-js\">for (var i = 0; i &lt; 3; i++) setTimeout(() =&gt; console.log(i)); // 3 3 3\nfor (let i = 0; i &lt; 3; i++) setTimeout(() =&gt; console.log(i)); // 0 1 2\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003ccode>var\u003c/code> has one shared \u003ccode>i\u003c/code> for the whole function; by the time the callbacks run, \u003ccode>i\u003c/code> is 3. \u003ccode>let\u003c/code> creates a \u003cstrong>new binding per iteration\u003c/strong>, so each closure captures its own value.\u003c/p>","t":"js copy for (var i = 0; i \u003c 3; i++) settimeout(() => console.log(i)); // 3 3 3 for (let i = 0; i \u003c 3; i++) settimeout(() => console.log(i)); // 0 1 2 var has one shared i for the whole function; by the time the callbacks run, i is 3. let creates a new binding per iteration , so each closure captures its own value."}]},{"title":"this, Prototypes & Classes","intro":"","qs":[{"id":"javascript-1kto3a","n":4,"q":"How does `this` work?","qh":"How does \u003ccode>this\u003c/code> work?","level":"mid","hot":true,"a":"\u003cp>Decided by the \u003cstrong>call site\u003c/strong>:\u003c/p>\n\u003col>\u003cli>\u003ccode>new Fn()\u003c/code> → the new object.\u003c/li>\u003cli>\u003ccode>fn.call(obj)\u003c/code> / \u003ccode>apply\u003c/code> / \u003ccode>bind\u003c/code> → \u003ccode>obj\u003c/code>.\u003c/li>\u003cli>\u003ccode>obj.fn()\u003c/code> → \u003ccode>obj\u003c/code>.\u003c/li>\u003cli>Plain \u003ccode>fn()\u003c/code> → \u003ccode>undefined\u003c/code> in strict mode (global object otherwise).\u003c/li>\u003cli>\u003cstrong>Arrow functions\u003c/strong> have no own \u003ccode>this\u003c/code>; they use the enclosing scope's \u003ccode>this\u003c/code>.\u003c/li>\u003c/ol>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>js\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-js\">const user = {\n  name: 'Asha',\n  regular() { return this.name; },\n  arrow: () =&gt; this?.name,\n};\nuser.regular(); // 'Asha'\nuser.arrow();   // undefined, `this` is from module scope\u003c/code>\u003c/pre>\u003c/div>","t":"decided by the call site : new fn() → the new object. fn.call(obj) / apply / bind → obj . obj.fn() → obj . plain fn() → undefined in strict mode (global object otherwise). arrow functions have no own this ; they use the enclosing scope's this . js copy const user = { name: 'asha', regular() { return this.name; }, arrow: () => this?.name, }; user.regular(); // 'asha' user.arrow(); // undefined, `this` is from module scope"},{"id":"javascript-1m9x2w","n":5,"q":"`call` vs `apply` vs `bind`","qh":"\u003ccode>call\u003c/code> vs \u003ccode>apply\u003c/code> vs \u003ccode>bind\u003c/code>","level":"basic","hot":true,"a":"\u003cul>\u003cli>\u003ccode>fn.call(ctx, a, b)\u003c/code>: call now, args one by one.\u003c/li>\u003cli>\u003ccode>fn.apply(ctx, [a, b])\u003c/code>: call now, args as an array.\u003c/li>\u003cli>\u003ccode>fn.bind(ctx, a)\u003c/code>: returns a \u003cstrong>new function\u003c/strong> with \u003ccode>this\u003c/code> fixed (and optional preset args).\u003c/li>\u003c/ul>","t":"fn.call(ctx, a, b) : call now, args one by one. fn.apply(ctx, [a, b]) : call now, args as an array. fn.bind(ctx, a) : returns a new function with this fixed (and optional preset args)."},{"id":"javascript-zakyy4","n":6,"q":"Explain prototypal inheritance.","qh":"Explain prototypal inheritance.","level":"mid","hot":false,"a":"\u003cp>Every object has a hidden link \u003ccode>[[Prototype]]\u003c/code> to another object. Property lookup walks this \u003cstrong>prototype chain\u003c/strong> until it finds the property or reaches \u003ccode>null\u003c/code>. \u003ccode>class\u003c/code> syntax is sugar over prototypes.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>js\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-js\">const animal = { speak() { return `${this.name} makes a sound`; } };\nconst dog = Object.create(animal);\ndog.name = 'Rex';\ndog.speak(); // found on the prototype\u003c/code>\u003c/pre>\u003c/div>","t":"every object has a hidden link [[prototype]] to another object. property lookup walks this prototype chain until it finds the property or reaches null . class syntax is sugar over prototypes. js copy const animal = { speak() { return `${this.name} makes a sound`; } }; const dog = object.create(animal); dog.name = 'rex'; dog.speak(); // found on the prototype"}]},{"title":"Async JavaScript","intro":"","qs":[{"id":"javascript-c6fv0g","n":7,"q":"Explain the browser event loop: microtasks vs macrotasks.","qh":"Explain the browser event loop: microtasks vs macrotasks.","level":"mid","hot":true,"a":"\u003cp>JS runs on one call stack. When the stack is empty:\u003c/p>\n\u003col>\u003cli>Run \u003cstrong>all microtasks\u003c/strong> (Promise callbacks, \u003ccode>queueMicrotask\u003c/code>, MutationObserver).\u003c/li>\u003cli>Render if needed.\u003c/li>\u003cli>Take \u003cstrong>one macrotask\u003c/strong> (setTimeout, setInterval, I/O, UI events), then back to step 1.\u003c/li>\u003c/ol>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>js\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-js\">console.log('A');\nsetTimeout(() =&gt; console.log('B'), 0);\nPromise.resolve().then(() =&gt; console.log('C'));\n(async () =&gt; { console.log('D'); await null; console.log('E'); })();\nconsole.log('F');\n// A D F C E B\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"callout callout-tip\">\u003cspan class=\"callout-label\">Interview tip\u003c/span>\u003cp>Code after \u003ccode>await\u003c/code> runs as a \u003cstrong>microtask\u003c/strong>. Code before the first \u003ccode>await\u003c/code> runs synchronously.\u003c/p>\u003c/div>","t":"js runs on one call stack. when the stack is empty: run all microtasks (promise callbacks, queuemicrotask , mutationobserver). render if needed. take one macrotask (settimeout, setinterval, i/o, ui events), then back to step 1. js copy console.log('a'); settimeout(() => console.log('b'), 0); promise.resolve().then(() => console.log('c')); (async () => { console.log('d'); await null; console.log('e'); })(); console.log('f'); // a d f c e b interview tip code after await runs as a microtask . code before the first await runs synchronously."},{"id":"javascript-1q9frs","n":8,"q":"Implement `Promise.all` (polyfill).","qh":"Implement \u003ccode>Promise.all\u003c/code> (polyfill).","level":"senior","hot":true,"a":"\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>js\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-js\">function promiseAll(promises) {\n  return new Promise((resolve, reject) =&gt; {\n    const results = [];\n    let done = 0;\n    if (promises.length === 0) return resolve([]);\n    promises.forEach((p, i) =&gt; {\n      Promise.resolve(p).then((value) =&gt; {\n        results[i] = value;            // keep order\n        if (++done === promises.length) resolve(results);\n      }, reject);                      // fail fast\n    });\n  });\n}\u003c/code>\u003c/pre>\u003c/div>","t":"js copy function promiseall(promises) { return new promise((resolve, reject) => { const results = []; let done = 0; if (promises.length === 0) return resolve([]); promises.foreach((p, i) => { promise.resolve(p).then((value) => { results[i] = value; // keep order if (++done === promises.length) resolve(results); }, reject); // fail fast }); }); }"},{"id":"javascript-1239jy","n":9,"q":"Implement debounce and throttle.","qh":"Implement debounce and throttle.","level":"mid","hot":true,"a":"\u003cul>\u003cli>\u003cstrong>Debounce\u003c/strong>: run only after calls \u003cstrong>stop\u003c/strong> for \u003ccode>delay\u003c/code> ms (search box, resize end).\u003c/li>\u003cli>\u003cstrong>Throttle\u003c/strong>: run \u003cstrong>at most once\u003c/strong> per \u003ccode>interval\u003c/code> (scroll, mousemove, button spam).\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>js\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-js\">function debounce(fn, delay = 300) {\n  let t;\n  return function (...args) {\n    clearTimeout(t);\n    t = setTimeout(() =&gt; fn.apply(this, args), delay);\n  };\n}\n\nfunction throttle(fn, interval = 200) {\n  let last = 0;\n  return function (...args) {\n    const now = Date.now();\n    if (now - last &gt;= interval) { last = now; fn.apply(this, args); }\n  };\n}\u003c/code>\u003c/pre>\u003c/div>","t":"debounce : run only after calls stop for delay ms (search box, resize end). throttle : run at most once per interval (scroll, mousemove, button spam). js copy function debounce(fn, delay = 300) { let t; return function (...args) { cleartimeout(t); t = settimeout(() => fn.apply(this, args), delay); }; } function throttle(fn, interval = 200) { let last = 0; return function (...args) { const now = date.now(); if (now - last >= interval) { last = now; fn.apply(this, args); } }; }"}]},{"title":"Objects & Data","intro":"","qs":[{"id":"javascript-5i5s2k","n":10,"q":"Shallow copy vs deep copy","qh":"Shallow copy vs deep copy","level":"mid","hot":true,"a":"\u003cul>\u003cli>\u003cstrong>Shallow\u003c/strong> (\u003ccode>{...obj}\u003c/code>, \u003ccode>Object.assign\u003c/code>, \u003ccode>arr.slice()\u003c/code>): copies top-level only; nested objects are \u003cstrong>shared\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Deep\u003c/strong>: \u003ccode>structuredClone(obj)\u003c/code> (modern, handles Dates, Maps, cycles). \u003ccode>JSON.parse(JSON.stringify(obj))\u003c/code> loses Dates, functions, \u003ccode>undefined\u003c/code> and fails on cycles.\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>js\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-js\">const a = { user: { name: 'A' } };\nconst b = { ...a };\nb.user.name = 'B';\na.user.name; // 'B', shared nested object\u003c/code>\u003c/pre>\u003c/div>","t":"shallow ( {...obj} , object.assign , arr.slice() ): copies top-level only; nested objects are shared . deep : structuredclone(obj) (modern, handles dates, maps, cycles). json.parse(json.stringify(obj)) loses dates, functions, undefined and fails on cycles. js copy const a = { user: { name: 'a' } }; const b = { ...a }; b.user.name = 'b'; a.user.name; // 'b', shared nested object"},{"id":"javascript-z63q5w","n":11,"q":"`map` vs `forEach` vs `filter` vs `reduce`","qh":"\u003ccode>map\u003c/code> vs \u003ccode>forEach\u003c/code> vs \u003ccode>filter\u003c/code> vs \u003ccode>reduce\u003c/code>","level":"basic","hot":false,"a":"\u003cul>\u003cli>\u003ccode>forEach\u003c/code>: loop for side effects, returns \u003ccode>undefined\u003c/code>.\u003c/li>\u003cli>\u003ccode>map\u003c/code>: returns a \u003cstrong>new array\u003c/strong> of the same length with transformed items.\u003c/li>\u003cli>\u003ccode>filter\u003c/code>: returns a new array of items that pass a test.\u003c/li>\u003cli>\u003ccode>reduce\u003c/code>: folds the array into \u003cstrong>one value\u003c/strong> (sum, object grouping).\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>js\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-js\">const total = cart.reduce((sum, i) =&gt; sum + i.price * i.qty, 0);\nconst byStatus = orders.reduce((acc, o) =&gt; ((acc[o.status] ??= []).push(o), acc), {});\u003c/code>\u003c/pre>\u003c/div>","t":"foreach : loop for side effects, returns undefined . map : returns a new array of the same length with transformed items. filter : returns a new array of items that pass a test. reduce : folds the array into one value (sum, object grouping). js copy const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0); const bystatus = orders.reduce((acc, o) => ((acc[o.status] ??= []).push(o), acc), {});"},{"id":"javascript-z6uk4s","n":12,"q":"`==` vs `===`, `null` vs `undefined`, `??` vs `||`","qh":"\u003ccode>==\u003c/code> vs \u003ccode>===\u003c/code>, \u003ccode>null\u003c/code> vs \u003ccode>undefined\u003c/code>, \u003ccode>??\u003c/code> vs \u003ccode>||\u003c/code>","level":"basic","hot":true,"a":"\u003cul>\u003cli>\u003ccode>===\u003c/code> compares without coercion. Use it.\u003c/li>\u003cli>\u003ccode>undefined\u003c/code>: declared but not assigned / missing property. \u003ccode>null\u003c/code>: intentionally empty.\u003c/li>\u003cli>\u003ccode>a || b\u003c/code> falls back on \u003cstrong>any falsy\u003c/strong> value (\u003ccode>0\u003c/code>, \u003ccode>''\u003c/code>, \u003ccode>false\u003c/code>). \u003ccode>a ?? b\u003c/code> falls back only on \u003ccode>null\u003c/code>/\u003ccode>undefined\u003c/code>.\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>js\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-js\">const qty = 0;\nqty || 1; // 1, probably a bug\nqty ?? 1; // 0\u003c/code>\u003c/pre>\u003c/div>","t":"=== compares without coercion. use it. undefined : declared but not assigned / missing property. null : intentionally empty. a || b falls back on any falsy value ( 0 , '' , false ). a ?? b falls back only on null / undefined . js copy const qty = 0; qty || 1; // 1, probably a bug qty ?? 1; // 0"},{"id":"javascript-py115k","n":13,"q":"What are `Map`, `Set`, `WeakMap`?","qh":"What are \u003ccode>Map\u003c/code>, \u003ccode>Set\u003c/code>, \u003ccode>WeakMap\u003c/code>?","level":"mid","hot":false,"a":"\u003cul>\u003cli>\u003ccode>Map\u003c/code>: key-value with \u003cstrong>any key type\u003c/strong>, keeps insertion order, has \u003ccode>size\u003c/code>. Better than objects for frequent add/remove.\u003c/li>\u003cli>\u003ccode>Set\u003c/code>: unique values. \u003ccode>[...new Set(arr)]\u003c/code> removes duplicates.\u003c/li>\u003cli>\u003ccode>WeakMap\u003c/code>: keys must be objects and are \u003cstrong>weakly held\u003c/strong>, so they can be garbage collected. Good for caching data tied to DOM nodes or objects without leaks.\u003c/li>\u003c/ul>","t":"map : key-value with any key type , keeps insertion order, has size . better than objects for frequent add/remove. set : unique values. [...new set(arr)] removes duplicates. weakmap : keys must be objects and are weakly held , so they can be garbage collected. good for caching data tied to dom nodes or objects without leaks."},{"id":"javascript-6djrjv","n":14,"q":"Event delegation and bubbling","qh":"Event delegation and bubbling","level":"mid","hot":false,"a":"\u003cp>Events \u003cstrong>bubble\u003c/strong> from the target up to its ancestors. \u003cstrong>Event delegation\u003c/strong> attaches one listener on a parent and checks \u003ccode>event.target\u003c/code>, instead of one listener per child. It works for elements added later and uses less memory.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>js\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-js\">list.addEventListener('click', (e) =&gt; {\n  const item = e.target.closest('li[data-id]');\n  if (item) remove(item.dataset.id);\n});\u003c/code>\u003c/pre>\u003c/div>","t":"events bubble from the target up to its ancestors. event delegation attaches one listener on a parent and checks event.target , instead of one listener per child. it works for elements added later and uses less memory. js copy list.addeventlistener('click', (e) => { const item = e.target.closest('li[data-id]'); if (item) remove(item.dataset.id); });"}]}],"count":14},{"id":"devops","title":"DevOps & Cloud","short":"DevOps","color":"#f97316","blurb":"Docker, CI/CD, Nginx, Linux, AWS, Kubernetes basics, zero-downtime deployments, monitoring and the \"how do you deploy this\" questions full-stack devs now get.","cheats":["\u003cstrong>Image\u003c/strong> = read-only template; \u003cstrong>container\u003c/strong> = running instance of an image.","Small images: \u003cstrong>multi-stage builds\u003c/strong>, slim/alpine base, \u003ccode>.dockerignore\u003c/code>, copy \u003ccode>package.json\u003c/code> first for \u003cstrong>layer caching\u003c/strong>.","CI = build + test on every push; CD = deploy automatically (or with one approval) after CI passes.","Zero downtime: \u003cstrong>rolling\u003c/strong>, \u003cstrong>blue-green\u003c/strong> or \u003cstrong>canary\u003c/strong> deploys + health checks + backward-compatible DB migrations.","Nginx: reverse proxy, TLS termination, load balancing, gzip, static files, rate limiting.","Logs, metrics, traces = the \u003cstrong>three pillars of observability\u003c/strong>.","Secrets never in git or images: use env vars from a \u003cstrong>secret manager\u003c/strong> (AWS Secrets Manager, Vault, GitHub secrets).","Kubernetes: \u003cstrong>Pod\u003c/strong> (containers), \u003cstrong>Deployment\u003c/strong> (replicas + rolling updates), \u003cstrong>Service\u003c/strong> (stable network), \u003cstrong>Ingress\u003c/strong> (HTTP routing), \u003cstrong>HPA\u003c/strong> (autoscaling).","Useful Linux: \u003ccode>top/htop\u003c/code>, \u003ccode>df -h\u003c/code>, \u003ccode>free -m\u003c/code>, \u003ccode>ss -tulpn\u003c/code>, \u003ccode>journalctl -u\u003c/code>, \u003ccode>tail -f\u003c/code>, \u003ccode>grep\u003c/code>, \u003ccode>chmod/chown\u003c/code>."],"sections":[{"title":"Docker","intro":"","qs":[{"id":"devops-16nzm8","n":1,"q":"What is Docker and why use it? Image vs container?","qh":"What is Docker and why use it? Image vs container?","level":"basic","hot":true,"a":"\u003cp>Docker packages an app with \u003cstrong>everything it needs\u003c/strong> (runtime, libraries, config) into an image, so it runs the same on every machine: &quot;works on my machine&quot; goes away.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Image\u003c/strong>: read-only, layered template built from a Dockerfile.\u003c/li>\u003cli>\u003cstrong>Container\u003c/strong>: a running, isolated instance of an image (its own filesystem, network, processes).\u003c/li>\u003cli>Containers share the host \u003cstrong>kernel\u003c/strong>, so they are much lighter than VMs.\u003c/li>\u003c/ul>","t":"docker packages an app with everything it needs (runtime, libraries, config) into an image, so it runs the same on every machine: \"works on my machine\" goes away. image : read-only, layered template built from a dockerfile. container : a running, isolated instance of an image (its own filesystem, network, processes). containers share the host kernel , so they are much lighter than vms."},{"id":"devops-1iyp6w","n":2,"q":"Write a production Dockerfile for a Node.js app.","qh":"Write a production Dockerfile for a Node.js app.","level":"mid","hot":true,"a":"\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>dockerfile\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-dockerfile\"># ---- build stage ----\nFROM node:22-alpine AS build\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build\n\n# ---- runtime stage ----\nFROM node:22-alpine\nENV NODE_ENV=production\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci --omit=dev &amp;&amp; npm cache clean --force\nCOPY --from=build /app/dist ./dist\nUSER node\nEXPOSE 3000\nHEALTHCHECK CMD wget -qO- http://localhost:3000/health || exit 1\nCMD [&quot;node&quot;, &quot;dist/server.js&quot;]\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Key points to say:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Multi-stage\u003c/strong> build → small final image without dev dependencies and source.\u003c/li>\u003cli>Copy \u003ccode>package*.json\u003c/code> and install \u003cstrong>before\u003c/strong> copying code → dependency layer is cached.\u003c/li>\u003cli>Run as \u003cstrong>non-root\u003c/strong> user, add a \u003ccode>.dockerignore\u003c/code> (node_modules, .git, .env).\u003c/li>\u003cli>\u003ccode>npm ci\u003c/code> for reproducible installs.\u003c/li>\u003c/ul>","t":"dockerfile copy # ---- build stage ---- from node:22-alpine as build workdir /app copy package*.json ./ run npm ci copy . . run npm run build # ---- runtime stage ---- from node:22-alpine env node_env=production workdir /app copy package*.json ./ run npm ci --omit=dev && npm cache clean --force copy --from=build /app/dist ./dist user node expose 3000 healthcheck cmd wget -qo- http://localhost:3000/health || exit 1 cmd [\"node\", \"dist/server.js\"] key points to say: multi-stage build → small final image without dev dependencies and source. copy package*.json and install before copying code → dependency layer is cached. run as non-root user, add a .dockerignore (node_modules, .git, .env). npm ci for reproducible installs."},{"id":"devops-k4ch2d","n":3,"q":"Dockerfile for a Laravel app (PHP-FPM + Nginx)","qh":"Dockerfile for a Laravel app (PHP-FPM + Nginx)","level":"mid","hot":false,"a":"\u003cp>Typical setup: one container for \u003cstrong>PHP-FPM\u003c/strong> (app code), one for \u003cstrong>Nginx\u003c/strong> (proxy to FPM), plus MySQL/Redis/queue worker containers via Docker Compose.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>dockerfile\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-dockerfile\">FROM php:8.3-fpm-alpine\nRUN docker-php-ext-install pdo_mysql opcache bcmath\nCOPY --from=composer:2 /usr/bin/composer /usr/bin/composer\nWORKDIR /var/www\nCOPY composer.* ./\nRUN composer install --no-dev --no-scripts --prefer-dist\nCOPY . .\nRUN composer dump-autoload -o &amp;&amp; php artisan config:cache &amp;&amp; php artisan route:cache \\\n    &amp;&amp; chown -R www-data:www-data storage bootstrap/cache\nUSER www-data\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Run the queue worker as a separate container using the same image: \u003ccode>php artisan queue:work\u003c/code>.\u003c/p>","t":"typical setup: one container for php-fpm (app code), one for nginx (proxy to fpm), plus mysql/redis/queue worker containers via docker compose. dockerfile copy from php:8.3-fpm-alpine run docker-php-ext-install pdo_mysql opcache bcmath copy --from=composer:2 /usr/bin/composer /usr/bin/composer workdir /var/www copy composer.* ./ run composer install --no-dev --no-scripts --prefer-dist copy . . run composer dump-autoload -o && php artisan config:cache && php artisan route:cache \\ && chown -r www-data:www-data storage bootstrap/cache user www-data run the queue worker as a separate container using the same image: php artisan queue:work ."},{"id":"devops-12hc0l","n":4,"q":"`CMD` vs `ENTRYPOINT`, `COPY` vs `ADD`","qh":"\u003ccode>CMD\u003c/code> vs \u003ccode>ENTRYPOINT\u003c/code>, \u003ccode>COPY\u003c/code> vs \u003ccode>ADD\u003c/code>","level":"basic","hot":false,"a":"\u003cul>\u003cli>\u003ccode>ENTRYPOINT\u003c/code>: the fixed executable. \u003ccode>CMD\u003c/code>: default arguments (easily overridden by \u003ccode>docker run image other-cmd\u003c/code>).\u003c/li>\u003cli>\u003ccode>COPY\u003c/code>: copies local files (prefer it). \u003ccode>ADD\u003c/code>: also extracts tar files and can download URLs.\u003c/li>\u003c/ul>","t":"entrypoint : the fixed executable. cmd : default arguments (easily overridden by docker run image other-cmd ). copy : copies local files (prefer it). add : also extracts tar files and can download urls."},{"id":"devops-1evq00","n":5,"q":"What is Docker Compose?","qh":"What is Docker Compose?","level":"basic","hot":false,"a":"\u003cp>A YAML file to define and run \u003cstrong>multi-container\u003c/strong> apps locally: app, database, Redis, worker, with networks and volumes. \u003ccode>docker compose up -d\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Volumes\u003c/strong> persist data (DB files) beyond the container's life; \u003cstrong>networks\u003c/strong> let containers talk by service name (\u003ccode>mysql:3306\u003c/code>).\u003c/p>","t":"a yaml file to define and run multi-container apps locally: app, database, redis, worker, with networks and volumes. docker compose up -d . volumes persist data (db files) beyond the container's life; networks let containers talk by service name ( mysql:3306 )."}]},{"title":"CI/CD","intro":"","qs":[{"id":"devops-t14h8e","n":6,"q":"Explain a CI/CD pipeline you have built.","qh":"Explain a CI/CD pipeline you have built.","level":"mid","hot":true,"a":"\u003cp>A typical pipeline (GitHub Actions / GitLab CI / Jenkins):\u003c/p>\n\u003col>\u003cli>\u003cstrong>Trigger\u003c/strong> on push / pull request.\u003c/li>\u003cli>\u003cstrong>Install\u003c/strong> dependencies (with cache).\u003c/li>\u003cli>\u003cstrong>Lint + type check + unit tests\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Build\u003c/strong> Docker image, tag with the commit SHA, push to a registry (ECR / Docker Hub).\u003c/li>\u003cli>\u003cstrong>Security scan\u003c/strong> (npm audit, Trivy).\u003c/li>\u003cli>\u003cstrong>Deploy to staging\u003c/strong> automatically, run smoke tests.\u003c/li>\u003cli>\u003cstrong>Deploy to production\u003c/strong> on merge to main or with manual approval.\u003c/li>\u003cli>\u003cstrong>Run migrations\u003c/strong>, health check, and \u003cstrong>roll back\u003c/strong> automatically if it fails.\u003c/li>\u003c/ol>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>yaml\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-yaml\">name: ci\non: [push]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with: { node-version: 22, cache: npm }\n      - run: npm ci\n      - run: npm run lint &amp;&amp; npm test\u003c/code>\u003c/pre>\u003c/div>","t":"a typical pipeline (github actions / gitlab ci / jenkins): trigger on push / pull request. install dependencies (with cache). lint + type check + unit tests . build docker image, tag with the commit sha, push to a registry (ecr / docker hub). security scan (npm audit, trivy). deploy to staging automatically, run smoke tests. deploy to production on merge to main or with manual approval. run migrations , health check, and roll back automatically if it fails. yaml copy name: ci on: [push] jobs: test: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - uses: actions/setup-node@v4 with: { node-version: 22, cache: npm } - run: npm ci - run: npm run lint && npm test"},{"id":"devops-jn3exe","n":7,"q":"How do you deploy with zero downtime?","qh":"How do you deploy with zero downtime?","level":"senior","hot":true,"a":"\u003cul>\u003cli>\u003cstrong>Rolling update\u003c/strong>: replace instances a few at a time; the load balancer only sends traffic to instances that pass the \u003cstrong>health check\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Blue-green\u003c/strong>: run the new version (green) next to the old (blue), switch traffic at once; instant rollback by switching back.\u003c/li>\u003cli>\u003cstrong>Canary\u003c/strong>: send 5% of traffic to the new version, watch error rates, then increase.\u003c/li>\u003c/ul>\n\u003cp>Also needed:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Graceful shutdown\u003c/strong> (finish in-flight requests on SIGTERM).\u003c/li>\u003cli>\u003cstrong>Backward-compatible DB migrations\u003c/strong> (expand → migrate → contract): add a new column first, deploy code that writes both, remove the old column in a later release.\u003c/li>\u003cli>For PHP on a VM: build into a new release folder and \u003cstrong>switch a symlink\u003c/strong> (Envoyer/Deployer), then \u003ccode>php artisan queue:restart\u003c/code> and reload PHP-FPM.\u003c/li>\u003c/ul>","t":"rolling update : replace instances a few at a time; the load balancer only sends traffic to instances that pass the health check . blue-green : run the new version (green) next to the old (blue), switch traffic at once; instant rollback by switching back. canary : send 5% of traffic to the new version, watch error rates, then increase. also needed: graceful shutdown (finish in-flight requests on sigterm). backward-compatible db migrations (expand → migrate → contract): add a new column first, deploy code that writes both, remove the old column in a later release. for php on a vm: build into a new release folder and switch a symlink (envoyer/deployer), then php artisan queue:restart and reload php-fpm."},{"id":"devops-j8rhlu","n":8,"q":"How do you manage secrets and environment config?","qh":"How do you manage secrets and environment config?","level":"mid","hot":false,"a":"\u003cul>\u003cli>Never commit \u003ccode>.env\u003c/code>; commit a \u003ccode>.env.example\u003c/code>.\u003c/li>\u003cli>CI secrets in GitHub/GitLab secrets; runtime secrets in \u003cstrong>AWS Secrets Manager / Parameter Store / Vault / Kubernetes Secrets\u003c/strong>.\u003c/li>\u003cli>Different values per environment (dev, staging, prod); rotate keys; least-privilege IAM roles instead of long-lived access keys.\u003c/li>\u003c/ul>","t":"never commit .env ; commit a .env.example . ci secrets in github/gitlab secrets; runtime secrets in aws secrets manager / parameter store / vault / kubernetes secrets . different values per environment (dev, staging, prod); rotate keys; least-privilege iam roles instead of long-lived access keys."}]},{"title":"Servers & Networking","intro":"","qs":[{"id":"devops-147zak","n":9,"q":"What does Nginx do in your stack?","qh":"What does Nginx do in your stack?","level":"mid","hot":true,"a":"\u003cul>\u003cli>\u003cstrong>Reverse proxy\u003c/strong> to Node (port 3000) or PHP-FPM.\u003c/li>\u003cli>\u003cstrong>TLS/HTTPS termination\u003c/strong> (Let's Encrypt certificates).\u003c/li>\u003cli>\u003cstrong>Load balancing\u003c/strong> across several app instances.\u003c/li>\u003cli>Serve \u003cstrong>static files\u003c/strong> and cache them; gzip/brotli compression.\u003c/li>\u003cli>Rate limiting, request size limits, security headers.\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>nginx\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-nginx\">upstream api { server 127.0.0.1:3000; server 127.0.0.1:3001; }\nserver {\n  listen 443 ssl http2;\n  server_name api.example.com;\n  location / {\n    proxy_pass http://api;\n    proxy_set_header Host $host;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    proxy_set_header Upgrade $http_upgrade;     # WebSockets\n    proxy_set_header Connection &quot;upgrade&quot;;\n  }\n}\u003c/code>\u003c/pre>\u003c/div>","t":"reverse proxy to node (port 3000) or php-fpm. tls/https termination (let's encrypt certificates). load balancing across several app instances. serve static files and cache them; gzip/brotli compression. rate limiting, request size limits, security headers. nginx copy upstream api { server 127.0.0.1:3000; server 127.0.0.1:3001; } server { listen 443 ssl http2; server_name api.example.com; location / { proxy_pass http://api; proxy_set_header host $host; proxy_set_header x-forwarded-for $proxy_add_x_forwarded_for; proxy_set_header upgrade $http_upgrade; # websockets proxy_set_header connection \"upgrade\"; } }"},{"id":"devops-c3agfc","n":10,"q":"What happens when you type a URL in the browser?","qh":"What happens when you type a URL in the browser?","level":"mid","hot":true,"a":"\u003col>\u003cli>\u003cstrong>DNS\u003c/strong> lookup: domain → IP (browser cache → OS → resolver → root/TLD/authoritative).\u003c/li>\u003cli>\u003cstrong>TCP\u003c/strong> handshake (and \u003cstrong>TLS\u003c/strong> handshake for HTTPS).\u003c/li>\u003cli>Browser sends the \u003cstrong>HTTP request\u003c/strong>; it may hit a \u003cstrong>CDN\u003c/strong>, load balancer, Nginx, then the app server.\u003c/li>\u003cli>App runs logic, queries DB/cache, returns a response.\u003c/li>\u003cli>Browser parses HTML, builds the DOM and CSSOM, runs JS, \u003cstrong>lays out and paints\u003c/strong> the page, loading more resources in parallel.\u003c/li>\u003c/ol>","t":"dns lookup: domain → ip (browser cache → os → resolver → root/tld/authoritative). tcp handshake (and tls handshake for https). browser sends the http request ; it may hit a cdn , load balancer, nginx, then the app server. app runs logic, queries db/cache, returns a response. browser parses html, builds the dom and cssom, runs js, lays out and paints the page, loading more resources in parallel."},{"id":"devops-1ck51p","n":11,"q":"502 vs 503 vs 504 errors","qh":"502 vs 503 vs 504 errors","level":"mid","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>502 Bad Gateway\u003c/strong>: proxy got an invalid response; app crashed, wrong port, PHP-FPM down.\u003c/li>\u003cli>\u003cstrong>503 Service Unavailable\u003c/strong>: server overloaded or in maintenance; no healthy instances.\u003c/li>\u003cli>\u003cstrong>504 Gateway Timeout\u003c/strong>: app took too long (slow query, external API hanging); proxy timeout hit.\u003c/li>\u003c/ul>","t":"502 bad gateway : proxy got an invalid response; app crashed, wrong port, php-fpm down. 503 service unavailable : server overloaded or in maintenance; no healthy instances. 504 gateway timeout : app took too long (slow query, external api hanging); proxy timeout hit."},{"id":"devops-14k6po","n":12,"q":"Useful Linux commands for debugging a server","qh":"Useful Linux commands for debugging a server","level":"basic","hot":false,"a":"\u003cul>\u003cli>CPU/memory: \u003ccode>top\u003c/code>, \u003ccode>htop\u003c/code>, \u003ccode>free -m\u003c/code>, \u003ccode>vmstat 1\u003c/code>\u003c/li>\u003cli>Disk: \u003ccode>df -h\u003c/code>, \u003ccode>du -sh *\u003c/code> (a full disk is a classic outage cause)\u003c/li>\u003cli>Ports/processes: \u003ccode>ss -tulpn\u003c/code>, \u003ccode>lsof -i :3000\u003c/code>, \u003ccode>ps aux | grep node\u003c/code>\u003c/li>\u003cli>Logs: \u003ccode>tail -f /var/log/nginx/error.log\u003c/code>, \u003ccode>journalctl -u app -f\u003c/code>\u003c/li>\u003cli>Network: \u003ccode>curl -I\u003c/code>, \u003ccode>dig\u003c/code>, \u003ccode>ping\u003c/code>, \u003ccode>traceroute\u003c/code>\u003c/li>\u003cli>Permissions: \u003ccode>chmod\u003c/code>, \u003ccode>chown\u003c/code>\u003c/li>\u003c/ul>","t":"cpu/memory: top , htop , free -m , vmstat 1 disk: df -h , du -sh * (a full disk is a classic outage cause) ports/processes: ss -tulpn , lsof -i :3000 , ps aux | grep node logs: tail -f /var/log/nginx/error.log , journalctl -u app -f network: curl -i , dig , ping , traceroute permissions: chmod , chown"}]},{"title":"Cloud & Kubernetes","intro":"","qs":[{"id":"devops-1qzdyx","n":13,"q":"Which AWS services have you used and for what?","qh":"Which AWS services have you used and for what?","level":"mid","hot":true,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Service\u003c/th>\u003cth>Use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>EC2\u003c/strong>\u003c/td>\u003ctd>Virtual servers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>S3\u003c/strong>\u003c/td>\u003ctd>File storage (uploads, backups, static sites) + \u003cstrong>CloudFront\u003c/strong> CDN\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>RDS / Aurora\u003c/strong>\u003c/td>\u003ctd>Managed MySQL/Postgres with backups and read replicas\u003c/td>\u003c/tr>\u0
