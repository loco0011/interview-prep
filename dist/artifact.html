ation?","level":"senior","hot":false,"a":"\u003cul>\u003cli>Tools: \u003cstrong>k6\u003c/strong>, JMeter, Artillery, Locust.\u003c/li>\u003cli>Define realistic scenarios (browse → add to cart → pay) and target numbers (requests/second, concurrent users).\u003c/li>\u003cli>Ramp up gradually and watch latency percentiles, error rate, CPU, DB connections, queue length.\u003c/li>\u003cli>Find the \u003cstrong>first bottleneck\u003c/strong>, fix, repeat. Test in a production-like environment.\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>js\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-js\">import http from 'k6/http';\nexport const options = { stages: [{ duration: '2m', target: 500 }, { duration: '5m', target: 500 }] };\nexport default function () { http.get('https://staging.example.com/api/products'); }\u003c/code>\u003c/pre>\u003c/div>","t":"tools: k6 , jmeter, artillery, locust. define realistic scenarios (browse → add to cart → pay) and target numbers (requests/second, concurrent users). ramp up gradually and watch latency percentiles, error rate, cpu, db connections, queue length. find the first bottleneck , fix, repeat. test in a production-like environment. js copy import http from 'k6/http'; export const options = { stages: [{ duration: '2m', target: 500 }, { duration: '5m', target: 500 }] }; export default function () { http.get('https://staging.example.com/api/products'); }"},{"id":"performance-132zu7","n":14,"q":"Latency vs throughput; why use percentiles?","qh":"Latency vs throughput; why use percentiles?","level":"mid","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>Latency\u003c/strong>: time for one request. \u003cstrong>Throughput\u003c/strong>: requests handled per second.\u003c/li>\u003cli>Averages hide pain: if p50 is 100ms but \u003cstrong>p99 is 4s\u003c/strong>, 1 in 100 users waits 4 seconds, and heavy users hit it often.\u003c/li>\u003cli>Set goals on \u003cstrong>p95/p99\u003c/strong>.\u003c/li>\u003c/ul>","t":"latency : time for one request. throughput : requests handled per second. averages hide pain: if p50 is 100ms but p99 is 4s , 1 in 100 users waits 4 seconds, and heavy users hit it often. set goals on p95/p99 ."}]}],"count":14},{"id":"databases","title":"Databases","short":"Databases","color":"#b7791f","blurb":"MySQL, PostgreSQL, MongoDB and Redis: indexes, joins, transactions and isolation, normalization, SQL vs NoSQL, and the query-writing questions asked in coding rounds.","cheats":["\u003cstrong>ACID\u003c/strong>: Atomicity, Consistency, Isolation, Durability.","Indexes are usually \u003cstrong>B-trees\u003c/strong>; composite index follows the \u003cstrong>leftmost prefix\u003c/strong> rule.","Index columns used in \u003ccode>WHERE\u003c/code>, \u003ccode>JOIN\u003c/code>, \u003ccode>ORDER BY\u003c/code>; too many indexes slow down writes.","\u003ccode>INNER JOIN\u003c/code> = matching rows only; \u003ccode>LEFT JOIN\u003c/code> = all left rows + matches (or NULL).","\u003ccode>WHERE\u003c/code> filters rows \u003cstrong>before\u003c/strong> grouping; \u003ccode>HAVING\u003c/code> filters \u003cstrong>after\u003c/strong> \u003ccode>GROUP BY\u003c/code>.","Isolation levels: Read Uncommitted → Read Committed → \u003cstrong>Repeatable Read (MySQL default)\u003c/strong> → Serializable.","SQL for relations and transactions (orders, payments); NoSQL for flexible schemas and huge scale.","Redis: cache, sessions, rate limits, queues, locks, leaderboards; data lives \u003cstrong>in memory\u003c/strong>."],"sections":[{"title":"SQL Fundamentals","intro":"","qs":[{"id":"databases-1qyu2v","n":1,"q":"What is an index and how does it work?","qh":"What is an index and how does it work?","level":"basic","hot":true,"a":"\u003cp>An index is a separate data structure (usually a \u003cstrong>B+ tree\u003c/strong>) that keeps column values sorted with pointers to rows, so the DB can \u003cstrong>find rows without scanning the whole table\u003c/strong>, like a book index.\u003c/p>\n\u003cul>\u003cli>Speeds up \u003ccode>WHERE\u003c/code>, \u003ccode>JOIN\u003c/code>, \u003ccode>ORDER BY\u003c/code>, \u003ccode>GROUP BY\u003c/code>.\u003c/li>\u003cli>Costs disk space and \u003cstrong>slows down INSERT/UPDATE/DELETE\u003c/strong> (each index must be updated).\u003c/li>\u003cli>\u003cstrong>Clustered index\u003c/strong> (InnoDB primary key): the table rows are stored in PK order. \u003cstrong>Secondary indexes\u003c/strong> store the PK to find the row.\u003c/li>\u003cli>\u003cstrong>Covering index\u003c/strong>: contains all columns the query needs, so the table isn't touched.\u003c/li>\u003c/ul>","t":"an index is a separate data structure (usually a b+ tree ) that keeps column values sorted with pointers to rows, so the db can find rows without scanning the whole table , like a book index. speeds up where , join , order by , group by . costs disk space and slows down insert/update/delete (each index must be updated). clustered index (innodb primary key): the table rows are stored in pk order. secondary indexes store the pk to find the row. covering index : contains all columns the query needs, so the table isn't touched."},{"id":"databases-1cil0z","n":2,"q":"Composite indexes and the leftmost prefix rule","qh":"Composite indexes and the leftmost prefix rule","level":"mid","hot":true,"a":"\u003cp>An index on \u003ccode>(user_id, status, created_at)\u003c/code> can be used for:\u003c/p>\n\u003cul>\u003cli>\u003ccode>WHERE user_id = ?\u003c/code>\u003c/li>\u003cli>\u003ccode>WHERE user_id = ? AND status = ?\u003c/code>\u003c/li>\u003cli>\u003ccode>WHERE user_id = ? AND status = ? ORDER BY created_at\u003c/code>\u003c/li>\u003c/ul>\n\u003cp>But \u003cstrong>not\u003c/strong> efficiently for \u003ccode>WHERE status = ?\u003c/code> alone, because \u003ccode>user_id\u003c/code> (the leftmost column) is missing.\u003c/p>\n\u003cp>\u003cmark>Order columns: equality filters first, then range filters / sort column.\u003c/mark>\u003c/p>","t":"an index on (user_id, status, created_at) can be used for: where user_id = ? where user_id = ? and status = ? where user_id = ? and status = ? order by created_at but not efficiently for where status = ? alone, because user_id (the leftmost column) is missing. order columns: equality filters first, then range filters / sort column."},{"id":"databases-1o1ae4","n":3,"q":"Types of joins","qh":"Types of joins","level":"basic","hot":true,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Join\u003c/th>\u003cth>Returns\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>INNER JOIN\u003c/code>\u003c/td>\u003ctd>Rows with a match in both tables\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>LEFT JOIN\u003c/code>\u003c/td>\u003ctd>All rows from left + matches from right (NULL if none)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>RIGHT JOIN\u003c/code>\u003c/td>\u003ctd>All rows from right + matches from left\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>FULL OUTER JOIN\u003c/code>\u003c/td>\u003ctd>All rows from both (not in MySQL; use UNION)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>CROSS JOIN\u003c/code>\u003c/td>\u003ctd>Every combination\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Self join\u003c/td>\u003ctd>A table joined to itself (employee → manager)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>sql\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-sql\">-- Users who never placed an order\nSELECT u.* FROM users u LEFT JOIN orders o ON o.user_id = u.id WHERE o.id IS NULL;\u003c/code>\u003c/pre>\u003c/div>","t":"join returns inner join rows with a match in both tables left join all rows from left + matches from right (null if none) right join all rows from right + matches from left full outer join all rows from both (not in mysql; use union) cross join every combination self join a table joined to itself (employee → manager) sql copy -- users who never placed an order select u.* from users u left join orders o on o.user_id = u.id where o.id is null;"},{"id":"databases-5hbcsa","n":4,"q":"`WHERE` vs `HAVING`, `GROUP BY`","qh":"\u003ccode>WHERE\u003c/code> vs \u003ccode>HAVING\u003c/code>, \u003ccode>GROUP BY\u003c/code>","level":"basic","hot":false,"a":"\u003cp>\u003ccode>WHERE\u003c/code> filters rows \u003cstrong>before\u003c/strong> grouping; \u003ccode>HAVING\u003c/code> filters \u003cstrong>groups\u003c/strong> after aggregation.\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>sql\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-sql\">SELECT user_id, COUNT(*) AS orders, SUM(amount) AS total\nFROM orders\nWHERE status = 'paid'\nGROUP BY user_id\nHAVING SUM(amount) &gt; 10000\nORDER BY total DESC;\u003c/code>\u003c/pre>\u003c/div>","t":"where filters rows before grouping; having filters groups after aggregation. sql copy select user_id, count(*) as orders, sum(amount) as total from orders where status = 'paid' group by user_id having sum(amount) > 10000 order by total desc;"},{"id":"databases-1dbast","n":5,"q":"Classic SQL questions: second-highest salary, duplicates, top N per group","qh":"Classic SQL questions: second-highest salary, duplicates, top N per group","level":"mid","hot":true,"a":"\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>sql\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-sql\">-- Second highest salary\nSELECT MAX(salary) FROM employees WHERE salary &lt; (SELECT MAX(salary) FROM employees);\n-- or with window functions (handles ties)\nSELECT salary FROM (\n  SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS r FROM employees\n) t WHERE r = 2 LIMIT 1;\n\n-- Find duplicate emails\nSELECT email, COUNT(*) FROM users GROUP BY email HAVING COUNT(*) &gt; 1;\n\n-- Top 3 earners in each department\nSELECT * FROM (\n  SELECT e.*, ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rn FROM employees e\n) t WHERE rn &lt;= 3;\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"callout callout-tip\">\u003cspan class=\"callout-label\">Interview tip\u003c/span>\u003cp>Know \u003ccode>ROW_NUMBER\u003c/code> vs \u003ccode>RANK\u003c/code> vs \u003ccode>DENSE_RANK\u003c/code>: with ties (100, 100, 90) they give 1,2,3 / 1,1,3 / 1,1,2.\u003c/p>\u003c/div>","t":"sql copy -- second highest salary select max(salary) from employees where salary \u003c (select max(salary) from employees); -- or with window functions (handles ties) select salary from ( select salary, dense_rank() over (order by salary desc) as r from employees ) t where r = 2 limit 1; -- find duplicate emails select email, count(*) from users group by email having count(*) > 1; -- top 3 earners in each department select * from ( select e.*, row_number() over (partition by dept_id order by salary desc) as rn from employees e ) t where rn \u003c= 3; interview tip know row_number vs rank vs dense_rank : with ties (100, 100, 90) they give 1,2,3 / 1,1,3 / 1,1,2."},{"id":"databases-hucn2u","n":6,"q":"What is normalization? When do you denormalize?","qh":"What is normalization? When do you denormalize?","level":"mid","hot":false,"a":"\u003cp>Normalization organises tables to \u003cstrong>remove duplicate data\u003c/strong> and update anomalies.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>1NF\u003c/strong>: atomic values, no repeating groups.\u003c/li>\u003cli>\u003cstrong>2NF\u003c/strong>: no partial dependency on part of a composite key.\u003c/li>\u003cli>\u003cstrong>3NF\u003c/strong>: no transitive dependency (non-key column depending on another non-key column).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Denormalize\u003c/strong> for read performance: store \u003ccode>order_total\u003c/code> or \u003ccode>comments_count\u003c/code>, summary/reporting tables, copying product name into \u003ccode>order_items\u003c/code> (also needed historically: the product price at time of order).\u003c/p>","t":"normalization organises tables to remove duplicate data and update anomalies. 1nf : atomic values, no repeating groups. 2nf : no partial dependency on part of a composite key. 3nf : no transitive dependency (non-key column depending on another non-key column). denormalize for read performance: store order_total or comments_count , summary/reporting tables, copying product name into order_items (also needed historically: the product price at time of order)."}]},{"title":"Transactions","intro":"","qs":[{"id":"databases-hzi911","n":7,"q":"What does ACID mean?","qh":"What does ACID mean?","level":"basic","hot":true,"a":"\u003cul>\u003cli>\u003cstrong>Atomicity\u003c/strong>: all statements in a transaction succeed or none do.\u003c/li>\u003cli>\u003cstrong>Consistency\u003c/strong>: the DB moves from one valid state to another (constraints hold).\u003c/li>\u003cli>\u003cstrong>Isolation\u003c/strong>: concurrent transactions don't see each other's partial work.\u003c/li>\u003cli>\u003cstrong>Durability\u003c/strong>: once committed, data survives crashes (written to the log).\u003c/li>\u003c/ul>\n\u003cp>Example: transfer money: debit A and credit B must both happen or neither.\u003c/p>","t":"atomicity : all statements in a transaction succeed or none do. consistency : the db moves from one valid state to another (constraints hold). isolation : concurrent transactions don't see each other's partial work. durability : once committed, data survives crashes (written to the log). example: transfer money: debit a and credit b must both happen or neither."},{"id":"databases-16402f","n":8,"q":"Explain isolation levels and read anomalies.","qh":"Explain isolation levels and read anomalies.","level":"senior","hot":true,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Dirty read\u003c/th>\u003cth>Non-repeatable read\u003c/th>\u003cth>Phantom read\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Read Uncommitted\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>Possible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read Committed (Postgres default)\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>Possible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Repeatable Read (MySQL default)\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Possible*\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Serializable\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Dirty read\u003c/strong>: reading uncommitted data from another transaction.\u003c/li>\u003cli>\u003cstrong>Non-repeatable read\u003c/strong>: same row read twice gives different values.\u003c/li>\u003cli>\u003cstrong>Phantom read\u003c/strong>: same query returns new rows.\u003c/li>\u003c/ul>\n\u003cp>*InnoDB prevents most phantoms with next-key (gap) locks. Higher isolation = more locking and less concurrency.\u003c/p>","t":"level dirty read non-repeatable read phantom read read uncommitted possible possible possible read committed (postgres default) no possible possible repeatable read (mysql default) no no possible* serializable no no no dirty read : reading uncommitted data from another transaction. non-repeatable read : same row read twice gives different values. phantom read : same query returns new rows. *innodb prevents most phantoms with next-key (gap) locks. higher isolation = more locking and less concurrency."},{"id":"databases-1cxz4x","n":9,"q":"What is a deadlock and how do you handle it?","qh":"What is a deadlock and how do you handle it?","level":"senior","hot":false,"a":"\u003cp>Two transactions each hold a lock the other needs, so both wait forever. The DB detects it and \u003cstrong>kills one\u003c/strong> (MySQL error 1213).\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Retry\u003c/strong> the failed transaction (Laravel \u003ccode>DB::transaction($fn, 3)\u003c/code>).\u003c/li>\u003cli>Always lock rows in the \u003cstrong>same order\u003c/strong> (e.g. by ascending ID).\u003c/li>\u003cli>Keep transactions \u003cstrong>short\u003c/strong>; don't call external APIs inside them.\u003c/li>\u003cli>Proper indexes so updates lock fewer rows.\u003c/li>\u003c/ul>","t":"two transactions each hold a lock the other needs, so both wait forever. the db detects it and kills one (mysql error 1213). retry the failed transaction (laravel db::transaction($fn, 3) ). always lock rows in the same order (e.g. by ascending id). keep transactions short ; don't call external apis inside them. proper indexes so updates lock fewer rows."}]},{"title":"NoSQL & Redis","intro":"","qs":[{"id":"databases-gpg46x","n":10,"q":"SQL vs NoSQL: when to use which?","qh":"SQL vs NoSQL: when to use which?","level":"mid","hot":true,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>SQL (MySQL, Postgres)\u003c/th>\u003cth>NoSQL (MongoDB, DynamoDB)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Schema\u003c/td>\u003ctd>Fixed, enforced\u003c/td>\u003ctd>Flexible documents\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Relations\u003c/td>\u003ctd>Joins, foreign keys\u003c/td>\u003ctd>Embed or reference; joins are limited\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transactions\u003c/td>\u003ctd>Strong ACID\u003c/td>\u003ctd>Supported, but designed around single documents\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scaling\u003c/td>\u003ctd>Vertical + read replicas, sharding is harder\u003c/td>\u003ctd>Built for horizontal sharding\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Best for\u003c/td>\u003ctd>Orders, payments, inventory, reporting\u003c/td>\u003ctd>Catalogues with varied attributes, logs, events, content, high-scale key lookups\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout callout-say\">\u003cspan class=\"callout-label\">Say it like this\u003c/span>\u003cp>&quot;For payments and orders I want relational integrity and transactions, so SQL. For flexible product attributes or activity feeds, a document store can fit. Many systems use both.&quot;\u003c/p>\u003c/div>","t":"sql (mysql, postgres) nosql (mongodb, dynamodb) schema fixed, enforced flexible documents relations joins, foreign keys embed or reference; joins are limited transactions strong acid supported, but designed around single documents scaling vertical + read replicas, sharding is harder built for horizontal sharding best for orders, payments, inventory, reporting catalogues with varied attributes, logs, events, content, high-scale key lookups say it like this \"for payments and orders i want relational integrity and transactions, so sql. for flexible product attributes or activity feeds, a document store can fit. many systems use both.\""},{"id":"databases-1k4xln","n":11,"q":"MongoDB: embedding vs referencing; what is the aggregation pipeline?","qh":"MongoDB: embedding vs referencing; what is the aggregation pipeline?","level":"mid","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>Embed\u003c/strong> data that is read together and bounded in size (order with its line items, user with addresses).\u003c/li>\u003cli>\u003cstrong>Reference\u003c/strong> data that is large, unbounded or shared (user's millions of logs, products used by many orders).\u003c/li>\u003cli>Document limit is 16 MB.\u003c/li>\u003c/ul>\n\u003cp>The \u003cstrong>aggregation pipeline\u003c/strong> processes documents in stages: \u003ccode>$match → $group → $sort → $project → $lookup\u003c/code> (join).\u003c/p>\n\u003cdiv class=\"code\">\u003cdiv class=\"code-bar\">\u003cspan>js\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-js\">db.orders.aggregate([\n  { $match: { status: 'paid' } },\n  { $group: { _id: '$userId', total: { $sum: '$amount' } } },\n  { $sort: { total: -1 } },\n  { $limit: 10 },\n]);\u003c/code>\u003c/pre>\u003c/div>","t":"embed data that is read together and bounded in size (order with its line items, user with addresses). reference data that is large, unbounded or shared (user's millions of logs, products used by many orders). document limit is 16 mb. the aggregation pipeline processes documents in stages: $match → $group → $sort → $project → $lookup (join). js copy db.orders.aggregate([ { $match: { status: 'paid' } }, { $group: { _id: '$userid', total: { $sum: '$amount' } } }, { $sort: { total: -1 } }, { $limit: 10 }, ]);"},{"id":"databases-4zk8z7","n":12,"q":"What do you use Redis for?","qh":"What do you use Redis for?","level":"mid","hot":true,"a":"\u003cul>\u003cli>\u003cstrong>Cache\u003c/strong> (query results, rendered fragments) with TTL.\u003c/li>\u003cli>\u003cstrong>Sessions\u003c/strong> shared across servers.\u003c/li>\u003cli>\u003cstrong>Rate limiting\u003c/strong> with \u003ccode>INCR\u003c/code> + \u003ccode>EXPIRE\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Queues\u003c/strong> (BullMQ, Laravel Horizon).\u003c/li>\u003cli>\u003cstrong>Distributed locks\u003c/strong> (\u003ccode>SET key val NX PX 30000\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Leaderboards\u003c/strong> with sorted sets, counters, pub/sub for real-time.\u003c/li>\u003c/ul>\n\u003cp>Persistence: \u003cstrong>RDB\u003c/strong> snapshots and/or \u003cstrong>AOF\u003c/strong> log. Eviction policies like \u003ccode>allkeys-lru\u003c/code> when memory is full.\u003c/p>","t":"cache (query results, rendered fragments) with ttl. sessions shared across servers. rate limiting with incr + expire . queues (bullmq, laravel horizon). distributed locks ( set key val nx px 30000 ). leaderboards with sorted sets, counters, pub/sub for real-time. persistence: rdb snapshots and/or aof log. eviction policies like allkeys-lru when memory is full."},{"id":"databases-1y3r52","n":13,"q":"Replication vs sharding","qh":"Replication vs sharding","level":"senior","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>Replication\u003c/strong>: copies of the same data on several servers. A primary takes writes; \u003cstrong>read replicas\u003c/strong> take reads. Improves read scaling and availability. Watch \u003cstrong>replication lag\u003c/strong>: read-your-own-writes may need the primary.\u003c/li>\u003cli>\u003cstrong>Sharding / partitioning\u003c/strong>: split data across servers by a \u003cstrong>shard key\u003c/strong> (user_id, region). Scales writes and storage, but cross-shard queries and transactions get hard. Pick a key that spreads load evenly.\u003c/li>\u003c/ul>","t":"replication : copies of the same data on several servers. a primary takes writes; read replicas take reads. improves read scaling and availability. watch replication lag : read-your-own-writes may need the primary. sharding / partitioning : split data across servers by a shard key (user_id, region). scales writes and storage, but cross-shard queries and transactions get hard. pick a key that spreads load evenly."}]}],"count":13},{"id":"system-design","title":"System Design","short":"System Design","color":"#5f7391","blurb":"REST API design, microservices vs monolith, queues, caching, rate limiters and the classic design rounds (URL shortener, notifications, e-commerce checkout) explained at full-stack level.","cheats":["Design round structure: \u003cmark>requirements → estimates → API → data model → high-level diagram → deep dive → bottlenecks and trade-offs\u003c/mark>.","Ask for \u003cstrong>functional\u003c/strong> (what it does) and \u003cstrong>non-functional\u003c/strong> (scale, latency, availability, consistency) requirements first.","\u003cstrong>CAP\u003c/strong>: during a network partition choose Consistency or Availability.","Stateless app servers + load balancer + cache + DB (replicas) + queue + CDN covers most designs.","Monolith first; split into services when team size or scaling needs justify it.","REST: nouns for resources, HTTP verbs for actions, correct status codes, versioning, pagination.","Async work and spikes → \u003cstrong>message queue\u003c/strong>; events between services → \u003cstrong>pub/sub\u003c/strong>.","Always discuss \u003cstrong>failure\u003c/strong>: retries, timeouts, idempotency, dead-letter queues, monitoring."],"sections":[{"title":"API Design","intro":"","qs":[{"id":"system-design-1rbgug","n":1,"q":"What makes a good REST API?","qh":"What makes a good REST API?","level":"mid","hot":true,"a":"\u003cul>\u003cli>\u003cstrong>Resources as nouns\u003c/strong>: \u003ccode>GET /orders\u003c/code>, \u003ccode>GET /orders/42\u003c/code>, \u003ccode>POST /orders\u003c/code>, \u003ccode>PATCH /orders/42\u003c/code>, \u003ccode>DELETE /orders/42\u003c/code>.\u003c/li>\u003cli>Nested where natural: \u003ccode>GET /users/7/orders\u003c/code>.\u003c/li>\u003cli>Correct \u003cstrong>status codes\u003c/strong>: 200, 201 Created, 204 No Content, 400 validation, 401 not logged in, 403 forbidden, 404, 409 conflict, 422, 429, 500.\u003c/li>\u003cli>\u003cstrong>Pagination, filtering, sorting\u003c/strong>: \u003ccode>?page=2&amp;limit=20&amp;status=paid&amp;sort=-created_at\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Versioning\u003c/strong>: \u003ccode>/api/v1/...\u003c/code> or a header.\u003c/li>\u003cli>Consistent error shape: \u003ccode>{ &quot;error&quot;: { &quot;code&quot;: &quot;OUT_OF_STOCK&quot;, &quot;message&quot;: &quot;...&quot; } }\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Idempotent\u003c/strong> \u003ccode>PUT\u003c/code>/\u003ccode>DELETE\u003c/code>; idempotency keys for \u003ccode>POST\u003c/code> payments.\u003c/li>\u003cli>Auth (Bearer tokens), rate limiting, HTTPS only, OpenAPI documentation.\u003c/li>\u003c/ul>","t":"resources as nouns : get /orders , get /orders/42 , post /orders , patch /orders/42 , delete /orders/42 . nested where natural: get /users/7/orders . correct status codes : 200, 201 created, 204 no content, 400 validation, 401 not logged in, 403 forbidden, 404, 409 conflict, 422, 429, 500. pagination, filtering, sorting : ?page=2&limit=20&status=paid&sort=-created_at . versioning : /api/v1/... or a header. consistent error shape: { \"error\": { \"code\": \"out_of_stock\", \"message\": \"...\" } } . idempotent put / delete ; idempotency keys for post payments. auth (bearer tokens), rate limiting, https only, openapi documentation."},{"id":"system-design-1qoh98","n":2,"q":"PUT vs PATCH; which HTTP methods are idempotent?","qh":"PUT vs PATCH; which HTTP methods are idempotent?","level":"basic","hot":true,"a":"\u003cul>\u003cli>\u003ccode>PUT\u003c/code> \u003cstrong>replaces\u003c/strong> the whole resource; \u003ccode>PATCH\u003c/code> \u003cstrong>updates some fields\u003c/strong>.\u003c/li>\u003cli>Idempotent (same result if repeated): \u003ccode>GET\u003c/code>, \u003ccode>PUT\u003c/code>, \u003ccode>DELETE\u003c/code>, \u003ccode>HEAD\u003c/code>, \u003ccode>OPTIONS\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Not idempotent\u003c/strong>: \u003ccode>POST\u003c/code> (creates a new resource each time), \u003ccode>PATCH\u003c/code> (can be, depending on the operation, e.g. &quot;increment&quot; is not).\u003c/li>\u003cli>Safe (no changes): \u003ccode>GET\u003c/code>, \u003ccode>HEAD\u003c/code>, \u003ccode>OPTIONS\u003c/code>.\u003c/li>\u003c/ul>","t":"put replaces the whole resource; patch updates some fields . idempotent (same result if repeated): get , put , delete , head , options . not idempotent : post (creates a new resource each time), patch (can be, depending on the operation, e.g. \"increment\" is not). safe (no changes): get , head , options ."},{"id":"system-design-7tdmmo","n":3,"q":"REST vs GraphQL vs gRPC","qh":"REST vs GraphQL vs gRPC","level":"mid","hot":false,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>REST\u003c/th>\u003cth>GraphQL\u003c/th>\u003cth>gRPC\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Shape\u003c/td>\u003ctd>Fixed endpoints\u003c/td>\u003ctd>Client asks for exact fields\u003c/td>\u003ctd>Typed RPC methods (protobuf)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pros\u003c/td>\u003ctd>Simple, HTTP caching\u003c/td>\u003ctd>No over/under-fetching, one endpoint\u003c/td>\u003ctd>Fast, binary, streaming\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cons\u003c/td>\u003ctd>Over-fetching, many calls\u003c/td>\u003ctd>Caching and N+1 complexity\u003c/td>\u003ctd>Not browser-native\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Use\u003c/td>\u003ctd>Public APIs, most apps\u003c/td>\u003ctd>Complex UIs, mobile\u003c/td>\u003ctd>Service-to-service\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","t":"rest graphql grpc shape fixed endpoints client asks for exact fields typed rpc methods (protobuf) pros simple, http caching no over/under-fetching, one endpoint fast, binary, streaming cons over-fetching, many calls caching and n+1 complexity not browser-native use public apis, most apps complex uis, mobile service-to-service"},{"id":"system-design-3crjpu","n":4,"q":"How do you secure an API?","qh":"How do you secure an API?","level":"mid","hot":true,"a":"\u003cul>\u003cli>HTTPS everywhere; authentication (JWT / OAuth2 / Sanctum tokens), \u003cstrong>authorization on every endpoint\u003c/strong> (check ownership: can user 7 see order 42?).\u003c/li>\u003cli>Input validation, parameterized queries, output encoding.\u003c/li>\u003cli>Rate limiting and request size limits; CORS allowlist.\u003c/li>\u003cli>Don't expose internal IDs or stack traces where it matters; use UUIDs for public IDs if needed.\u003c/li>\u003cli>Logging and alerting on suspicious activity; OWASP API Top 10 (broken object-level authorization is #1).\u003c/li>\u003c/ul>","t":"https everywhere; authentication (jwt / oauth2 / sanctum tokens), authorization on every endpoint (check ownership: can user 7 see order 42?). input validation, parameterized queries, output encoding. rate limiting and request size limits; cors allowlist. don't expose internal ids or stack traces where it matters; use uuids for public ids if needed. logging and alerting on suspicious activity; owasp api top 10 (broken object-level authorization is #1)."}]},{"title":"Architecture","intro":"","qs":[{"id":"system-design-1o3k8t","n":5,"q":"Monolith vs microservices","qh":"Monolith vs microservices","level":"mid","hot":true,"a":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Monolith\u003c/th>\u003cth>Microservices\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Deploy\u003c/td>\u003ctd>One unit\u003c/td>\u003ctd>Each service separately\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pros\u003c/td>\u003ctd>Simple to build, test, debug; fast early on\u003c/td>\u003ctd>Independent scaling and deploys, team autonomy, fault isolation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cons\u003c/td>\u003ctd>Grows tangled; whole app redeploys; scales as one\u003c/td>\u003ctd>Network failures, distributed data, complex ops, harder debugging\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout callout-say\">\u003cspan class=\"callout-label\">Say it like this\u003c/span>\u003cp>&quot;I'd start with a well-structured modular monolith and extract services when there's a clear reason: a part with very different scaling needs, or teams blocked on each other.&quot;\u003c/p>\u003c/div>","t":"monolith microservices deploy one unit each service separately pros simple to build, test, debug; fast early on independent scaling and deploys, team autonomy, fault isolation cons grows tangled; whole app redeploys; scales as one network failures, distributed data, complex ops, harder debugging say it like this \"i'd start with a well-structured modular monolith and extract services when there's a clear reason: a part with very different scaling needs, or teams blocked on each other.\""},{"id":"system-design-1wd5xp","n":6,"q":"How do microservices communicate?","qh":"How do microservices communicate?","level":"senior","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>Synchronous\u003c/strong>: REST/gRPC calls. Simple, but creates coupling and cascading failures; needs timeouts, retries, circuit breakers.\u003c/li>\u003cli>\u003cstrong>Asynchronous\u003c/strong>: events through \u003cstrong>Kafka, RabbitMQ, SQS/SNS\u003c/strong>. Services stay decoupled and survive downtime of others.\u003c/li>\u003cli>\u003cstrong>API Gateway\u003c/strong> in front for routing, auth and rate limiting.\u003c/li>\u003cli>Data: each service owns its DB. Multi-service workflows use the \u003cstrong>Saga pattern\u003c/strong> (local transactions + compensating actions) instead of distributed transactions; the \u003cstrong>outbox pattern\u003c/strong> publishes events reliably.\u003c/li>\u003c/ul>","t":"synchronous : rest/grpc calls. simple, but creates coupling and cascading failures; needs timeouts, retries, circuit breakers. asynchronous : events through kafka, rabbitmq, sqs/sns . services stay decoupled and survive downtime of others. api gateway in front for routing, auth and rate limiting. data: each service owns its db. multi-service workflows use the saga pattern (local transactions + compensating actions) instead of distributed transactions; the outbox pattern publishes events reliably."},{"id":"system-design-m1bfu5","n":7,"q":"Why use a message queue? Kafka vs RabbitMQ","qh":"Why use a message queue? Kafka vs RabbitMQ","level":"mid","hot":true,"a":"\u003cp>Queues \u003cstrong>decouple\u003c/strong> producers from consumers, \u003cstrong>absorb traffic spikes\u003c/strong>, allow \u003cstrong>retries\u003c/strong>, and let slow work run in the background.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>RabbitMQ / SQS\u003c/strong>: classic task queues; a message is consumed once and removed; routing, priorities, dead-letter queues.\u003c/li>\u003cli>\u003cstrong>Kafka\u003c/strong>: a durable, ordered \u003cstrong>log\u003c/strong>; many consumer groups can re-read events; very high throughput; great for event streaming and analytics.\u003c/li>\u003c/ul>\n\u003cp>Always handle: \u003cstrong>at-least-once delivery\u003c/strong> (so consumers must be idempotent), \u003cstrong>dead-letter queues\u003c/strong>, retries with backoff, and monitoring queue length.\u003c/p>","t":"queues decouple producers from consumers, absorb traffic spikes , allow retries , and let slow work run in the background. rabbitmq / sqs : classic task queues; a message is consumed once and removed; routing, priorities, dead-letter queues. kafka : a durable, ordered log ; many consumer groups can re-read events; very high throughput; great for event streaming and analytics. always handle: at-least-once delivery (so consumers must be idempotent), dead-letter queues , retries with backoff, and monitoring queue length."},{"id":"system-design-ymrqe5","n":8,"q":"What is the CAP theorem?","qh":"What is the CAP theorem?","level":"mid","hot":false,"a":"\u003cp>In a distributed system, during a \u003cstrong>network Partition\u003c/strong> you must choose between \u003cstrong>Consistency\u003c/strong> (every read sees the latest write) and \u003cstrong>Availability\u003c/strong> (every request gets a response).\u003c/p>\n\u003cul>\u003cli>\u003cstrong>CP\u003c/strong>: banking balances, inventory counts: refuse requests rather than be wrong.\u003c/li>\u003cli>\u003cstrong>AP\u003c/strong>: social feeds, likes, product views: always respond, eventually consistent.\u003c/li>\u003c/ul>","t":"in a distributed system, during a network partition you must choose between consistency (every read sees the latest write) and availability (every request gets a response). cp : banking balances, inventory counts: refuse requests rather than be wrong. ap : social feeds, likes, product views: always respond, eventually consistent."},{"id":"system-design-1wb18x","n":9,"q":"What is a load balancer and what algorithms does it use?","qh":"What is a load balancer and what algorithms does it use?","level":"basic","hot":false,"a":"\u003cp>A load balancer spreads requests across servers and removes unhealthy ones using \u003cstrong>health checks\u003c/strong>.\u003c/p>\n\u003cul>\u003cli>Algorithms: \u003cstrong>round robin\u003c/strong>, least connections, IP hash (sticky), weighted.\u003c/li>\u003cli>L4 (TCP) vs L7 (HTTP: route by path/host, TLS termination).\u003c/li>\u003cli>Examples: Nginx, HAProxy, AWS ALB/NLB, Cloudflare.\u003c/li>\u003c/ul>","t":"a load balancer spreads requests across servers and removes unhealthy ones using health checks . algorithms: round robin , least connections, ip hash (sticky), weighted. l4 (tcp) vs l7 (http: route by path/host, tls termination). examples: nginx, haproxy, aws alb/nlb, cloudflare."}]},{"title":"Design Problems","intro":"","qs":[{"id":"system-design-1oh75m","n":10,"q":"Design a URL shortener.","qh":"Design a URL shortener.","level":"mid","hot":true,"a":"\u003cp>\u003cstrong>Requirements\u003c/strong>: create short link, redirect fast, optional expiry and analytics. Reads ≫ writes (100:1).\u003c/p>\n\u003cp>\u003cstrong>API\u003c/strong>: \u003ccode>POST /links {url}\u003c/code> → \u003ccode>{code}\u003c/code>; \u003ccode>GET /:code\u003c/code> → \u003cstrong>301/302\u003c/strong> redirect.\u003c/p>\n\u003cp>\u003cstrong>Code generation\u003c/strong>:\u003c/p>\n\u003cul>\u003cli>Auto-increment ID → \u003cstrong>Base62\u003c/strong> encode (7 chars = 3.5 trillion codes). Predictable, but simple.\u003c/li>\u003cli>Or random 7 chars with a unique constraint and retry on collision.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Storage\u003c/strong>: \u003ccode>links(code PK, url, user_id, expires_at, created_at)\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Scale\u003c/strong>: cache hot codes in \u003cstrong>Redis\u003c/strong> (most traffic hits few links), CDN/edge redirects, read replicas. Analytics: push click events to a \u003cstrong>queue\u003c/strong> and aggregate asynchronously, so the redirect stays fast.\u003c/p>\n\u003cdiv class=\"callout callout-tip\">\u003cspan class=\"callout-label\">Interview tip\u003c/span>\u003cp>301 is cached by browsers (fewer hits, less analytics). 302 hits your server every time (accurate analytics).\u003c/p>\u003c/div>","t":"requirements : create short link, redirect fast, optional expiry and analytics. reads ≫ writes (100:1). api : post /links {url} → {code} ; get /:code → 301/302 redirect. code generation : auto-increment id → base62 encode (7 chars = 3.5 trillion codes). predictable, but simple. or random 7 chars with a unique constraint and retry on collision. storage : links(code pk, url, user_id, expires_at, created_at) . scale : cache hot codes in redis (most traffic hits few links), cdn/edge redirects, read replicas. analytics: push click events to a queue and aggregate asynchronously, so the redirect stays fast. interview tip 301 is cached by browsers (fewer hits, less analytics). 302 hits your server every time (accurate analytics)."},{"id":"system-design-14dz5w","n":11,"q":"Design a notification system (email, SMS, push).","qh":"Design a notification system (email, SMS, push).","level":"senior","hot":true,"a":"\u003cul>\u003cli>Services call a \u003cstrong>Notification API\u003c/strong> with \u003ccode>user_id\u003c/code>, template and data.\u003c/li>\u003cli>API checks \u003cstrong>user preferences\u003c/strong> and opt-outs, renders templates, then puts one message per channel on a \u003cstrong>queue\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Channel workers\u003c/strong> send via providers (SES/SendGrid, Twilio/MSG91, FCM/APNs), with \u003cstrong>retries, backoff and a dead-letter queue\u003c/strong>; fail over to a second provider.\u003c/li>\u003cli>\u003cstrong>Idempotency key\u003c/strong> per notification so retries don't double-send; \u003cstrong>rate limits\u003c/strong> per user.\u003c/li>\u003cli>Store status (queued, sent, delivered, failed) and provider callbacks; priority queues so OTPs aren't stuck behind marketing emails.\u003c/li>\u003c/ul>","t":"services call a notification api with user_id , template and data. api checks user preferences and opt-outs, renders templates, then puts one message per channel on a queue . channel workers send via providers (ses/sendgrid, twilio/msg91, fcm/apns), with retries, backoff and a dead-letter queue ; fail over to a second provider. idempotency key per notification so retries don't double-send; rate limits per user. store status (queued, sent, delivered, failed) and provider callbacks; priority queues so otps aren't stuck behind marketing emails."},{"id":"system-design-1s3fiu","n":12,"q":"Design the checkout of an e-commerce site.","qh":"Design the checkout of an e-commerce site.","level":"senior","hot":true,"a":"\u003col>\u003cli>\u003cstrong>Cart\u003c/strong> in DB/Redis; prices re-validated on the server at checkout.\u003c/li>\u003cli>\u003cstrong>Reserve inventory\u003c/strong> for N minutes (atomic decrement or reservation table with expiry).\u003c/li>\u003cli>Create \u003cstrong>order\u003c/strong> (\u003ccode>pending_payment\u003c/code>) with an idempotency key; create gateway order.\u003c/li>\u003cli>Payment via gateway; confirmation through \u003cstrong>signature verification + webhook\u003c/strong>.\u003c/li>\u003cli>On success: order \u003ccode>paid\u003c/code> → event \u003ccode>OrderPaid\u003c/code> → queue consumers: invoice, email, shipping, analytics.\u003c/li>\u003cli>On failure/timeout: release reservation; \u003cstrong>reconciliation job\u003c/strong> catches stuck orders.\u003c/li>\u003c/ol>\n\u003cp>Concerns to mention: double clicks (idempotency), overselling (locks/atomic updates), flash-sale load (queue + waiting room), consistency between order and payment (state machine + webhooks), observability.\u003c/p>","t":"cart in db/redis; prices re-validated on the server at checkout. reserve inventory for n minutes (atomic decrement or reservation table with expiry). create order ( pending_payment ) with an idempotency key; create gateway order. payment via gateway; confirmation through signature verification + webhook . on success: order paid → event orderpaid → queue consumers: invoice, email, shipping, analytics. on failure/timeout: release reservation; reconciliation job catches stuck orders. concerns to mention: double clicks (idempotency), overselling (locks/atomic updates), flash-sale load (queue + waiting room), consistency between order and payment (state machine + webhooks), observability."},{"id":"system-design-uiujdc","n":13,"q":"Design a rate limiter.","qh":"Design a rate limiter.","level":"senior","hot":false,"a":"\u003cul>\u003cli>Where: API gateway or middleware; key by user ID / API key / IP.\u003c/li>\u003cli>Algorithms: \u003cstrong>token bucket\u003c/strong> (allows short bursts, common), \u003cstrong>sliding window log/counter\u003c/strong> (accurate), fixed window (simple, burst at edges).\u003c/li>\u003cli>Store counters in \u003cstrong>Redis\u003c/strong> so all servers share them; use a Lua script or \u003ccode>INCR\u003c/code> + \u003ccode>EXPIRE\u003c/code> for atomicity.\u003c/li>\u003cli>Response: \u003cstrong>429\u003c/strong> with \u003ccode>Retry-After\u003c/code> and \u003ccode>X-RateLimit-Remaining\u003c/code> headers.\u003c/li>\u003cli>Different limits per plan/endpoint; fail open or closed if Redis is down (decide and explain).\u003c/li>\u003c/ul>","t":"where: api gateway or middleware; key by user id / api key / ip. algorithms: token bucket (allows short bursts, common), sliding window log/counter (accurate), fixed window (simple, burst at edges). store counters in redis so all servers share them; use a lua script or incr + expire for atomicity. response: 429 with retry-after and x-ratelimit-remaining headers. different limits per plan/endpoint; fail open or closed if redis is down (decide and explain)."},{"id":"system-design-1myxj7","n":14,"q":"Design a chat application.","qh":"Design a chat application.","level":"senior","hot":false,"a":"\u003cul>\u003cli>\u003cstrong>WebSocket\u003c/strong> connections to chat servers; a connection registry (user → server) in Redis.\u003c/li>\u003cli>Send message → persist to DB (Cassandra/Mongo/Postgres partitioned by conversation) → publish via \u003cstrong>Redis pub/sub / Kafka\u003c/strong> to the server holding the recipient's socket.\u003c/li>\u003cli>Offline users get \u003cstrong>push notifications\u003c/strong>; on reconnect, fetch messages after the last seen ID.\u003c/li>\u003cli>Message IDs ordered per conversation; delivery/read receipts as events; media in S3 via signed URLs.\u003c/li>\u003cli>Scale: horizontal chat servers behind an L4 load balancer, sticky connections, presence with TTL heartbeats.\u003c/li>\u003c/ul>","t":"websocket connections to chat servers; a connection registry (user → server) in redis. send message → persist to db (cassandra/mongo/postgres partitioned by conversation) → publish via redis pub/sub / kafka to the server holding the recipient's socket. offline users get push notifications ; on reconnect, fetch messages after the last seen id. message ids ordered per conversation; delivery/read receipts as events; media in s3 via signed urls. scale: horizontal chat servers behind an l4 load balancer, sticky connections, presence with ttl heartbeats."}]}],"count":14}]};
</script>
<script>
(function () {
  'use strict';

  const PB = window.PLAYBOOK;
  const TOPICS = PB.topics;
  const byId = Object.fromEntries(TOPICS.map((t) => [t.id, t]));
  const QINDEX = {}; // question id -> { q, topic }
  TOPICS.forEach((t) => t.sections.forEach((s) => s.qs.forEach((q) => (QINDEX[q.id] = { q, topic: t }))));

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const view = $('#view');
  const root = document.documentElement;

  /* ---------------- storage (safe) ---------------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem('pb:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('pb:' + k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
  };
  const learned = new Set(store.get('learned', []));
  const saveLearned = () => store.set('learned', Array.from(learned));

  const filters = Object.assign({ level: 'all', hot: false, hideLearned: false }, store.get('filters', {}));
  const saveFilters = () => store.set('filters', filters);

  /* ---------------- helpers ---------------- */
  const escHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const hotIn = (t) => t.sections.reduce((n, s) => n + s.qs.filter((q) => q.hot).length, 0);
  const LEVEL = { basic: 'Basic', mid: 'Mid', senior: 'Senior' };
  const learnedIn = (t) => t.sections.reduce((n, s) => n + s.qs.filter((q) => learned.has(q.id)).length, 0);
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const TOTAL = TOPICS.reduce((n, t) => n + t.count, 0);

  let toastTimer;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }

  function setAccent(color) {
    root.style.setProperty('--t', color);
  }

  /* ---------------- theme ---------------- */
  const themeBtn = $('#themeBtn');
  const MODES = ['system', 'light', 'dark'];
  function applyTheme(mode) {
    if (mode === 'system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', mode);
    themeBtn.dataset.mode = mode;
    themeBtn.title = 'Theme: ' + mode;
  }
  let themeMode = store.get('theme', 'system');
  applyTheme(themeMode);
  themeBtn.addEventListener('click', () => {
    themeMode = MODES[(MODES.indexOf(themeMode) + 1) % MODES.length];
    applyTheme(themeMode);
    store.set('theme', themeMode);
    toast('Theme: ' + themeMode);
  });

  /* ---------------- header height (for sticky offsets) ---------------- */
  const topbar = $('.topbar');
  function measureHeader() {
    root.style.setProperty('--header-h', topbar.offsetHeight + 'px');
  }
  if ('ResizeObserver' in window) new ResizeObserver(measureHeader).observe(topbar);
  window.addEventListener('resize', measureHeader);

  /* ---------------- tabs ---------------- */
  const tabsEl = $('#tabs');
  function renderTabs() {
    const home = `<button class="tab" role="tab" data-route="home" style="--c:var(--brand)">Overview</button>`;
    tabsEl.innerHTML =
      home +
      TOPICS.map(
        (t) =>
          `<button class="tab" role="tab" data-route="${t.id}" style="--c:${t.color}">${escHtml(t.short)}<span class="tab-count">${t.count}</span></button>`
      ).join('') +
      '<span class="tab-ind" id="tabInd"></span>';
    tabsEl.addEventListener('click', (e) => {
      const b = e.target.closest('.tab');
      if (!b) return;
      clearSearch();
      go(b.dataset.route);
    });
  }
  function markTab(routeId) {
    let active = null;
    $$('.tab', tabsEl).forEach((b) => {
      const on = b.dataset.route === routeId;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      if (on) active = b;
    });
    const ind = $('#tabInd');
    if (active && ind) {
      ind.style.width = active.offsetWidth + 'px';
      ind.style.transform = `translateX(${active.offsetLeft}px)`;
      ind.style.opacity = '1';
      const left = active.offsetLeft - tabsEl.clientWidth / 2 + active.offsetWidth / 2;
      tabsEl.scrollTo({ left, behavior: 'smooth' });
    } else if (ind) ind.style.opacity = '0';
  }

  /* ---------------- routing ---------------- */
  let current = { name: null };
  function go(id) {
    if (location.hash === '#' + id) route();
    else location.hash = id;
  }
  function parseHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (!h || h === 'home') return { name: 'home' };
    if (byId[h]) return { name: 'topic', topic: byId[h] };
    if (QINDEX[h]) return { name: 'topic', topic: QINDEX[h].topic, open: h };
    return { name: 'home' };
  }
  function route() {
    const r = parseHash();
    if (r.name === 'home') renderHome();
    else {
      const same = current.name === 'topic' && current.topic === r.topic;
      if (!same) renderTopic(r.topic);
      if (r.open) openQuestion(r.open, true);
      else if (!same) window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
      store.set('last', r.topic.id);
    }
  }

  /* ---------------- home ---------------- */
  function renderHome() {
    current = { name: 'home' };
    root.style.removeProperty('--t');
    markTab('home');
    const done = learned.size;
    const hot = TOPICS.reduce((n, t) => n + t.sections.reduce((m, s) => m + s.qs.filter((q) => q.hot).length, 0), 0);
    const last = byId[store.get('last', '')];
    view.innerHTML = `
      <section class="wrap home-top">
        <div class="home-bar glass">
          <div class="home-stats">
            <div class="stat"><b>${TOTAL}</b><span>questions</span></div>
            <div class="stat"><b>${TOPICS.length}</b><span>topics</span></div>
            <div class="stat"><b>${hot}</b><span>asked often</span></div>
            <div class="stat"><b>${pct(done, TOTAL)}%</b><span>learned</span></div>
          </div>
          <div class="home-actions">
            <button class="btn dark sm" type="button" id="randomAll"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M7 5v14l11-7z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>Random question</button>
            ${last ? `<a class="btn primary sm" href="#${last.id}">Continue with ${escHtml(last.short)} →</a>` : `<a class="btn primary sm" href="#${TOPICS[0].id}">Start with ${escHtml(TOPICS[0].short)} →</a>`}
          </div>
        </div>
        <div class="legend">
          <span><span class="chip basic">Basic</span> fresher / warm-up</span>
          <span><span class="chip mid">Mid</span> 2–5 years</span>
          <span><span class="chip senior">Senior</span> design &amp; trade-offs</span>
          <span><span class="chip hot">Asked often</span> prepare first</span>
        </div>
      </section>
      <section class="wrap">
        <div class="section-label"><h2>Topics</h2><span class="muted">${done} of ${TOTAL} learned</span></div>
        <div class="topic-grid">
          ${TOPICS.map((t, i) => {
            const l = learnedIn(t);
            return `<a class="topic-card" href="#${t.id}" style="--c:${t.color};--i:${i}">
              <div class="tc-top">
                <span class="tc-label">${t.count} questions</span>
                <span class="tc-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              </div>
              <h3>${escHtml(t.title)}</h3>
              <p>${escHtml(t.blurb)}</p>
              <div class="tc-foot">
                <div class="bar"><span data-w="${pct(l, t.count)}"></span></div>
                <span class="tc-pct">${pct(l, t.count)}%</span>
              </div>
            </a>`;
          }).join('')}
        </div>
      </section>`;
    animateIn();
    requestAnimationFrame(() => $$('.bar span[data-w]').forEach((b) => (b.style.width = b.dataset.w + '%')));
    $('#randomAll').addEventListener('click', () => {
      const pool = Object.keys(QINDEX).filter((id) => !learned.has(id));
      const ids = pool.length ? pool : Object.keys(QINDEX);
      go(ids[Math.floor(Math.random() * ids.length)]);
    });
    window.scrollTo(0, 0);
  }

  function animateIn() {
    view.classList.remove('enter');
    void view.offsetWidth;
    view.classList.add('enter');
  }

  /* ---------------- topic ---------------- */
  function qCard(q, i, topic, showTopic) {
    const isL = learned.has(q.id);
    return `<article class="qa${isL ? ' learned' : ''}" id="${q.id}" data-id="${q.id}" data-level="${q.level}" data-hot="${q.hot ? 1 : 0}" style="--i:${i}${showTopic ? ';--t:' + topic.color : ''}">
      <button class="qa-head" type="button" aria-expanded="false" aria-controls="b-${q.id}">
        <span class="qa-num">Q${q.n}</span>
        <span class="qa-q">${q.qh}</span>
        <span class="qa-chips">
          ${showTopic ? `<span class="chip topic" style="--c:${topic.color}">${escHtml(topic.short)}</span>` : ''}
          <span class="chip ${q.level}">${LEVEL[q.level]}</span>
          ${q.hot ? '<span class="chip hot">Asked often</span>' : ''}
          ${isL ? '<span class="chip done">Learned</span>' : ''}
        </span>
        <span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </button>
      <div class="qa-body" id="b-${q.id}" role="region"><div class="qa-inner"></div></div>
    </article>`;
  }

  function renderTopic(t) {
    current = { name: 'topic', topic: t };
    setAccent(t.color);
    markTab(t.id);
    const l = learnedIn(t);
    const C = 2 * Math.PI * 26;
    let i = 0;
    view.innerHTML = `
      <section class="topic-hero">
        <div class="wrap">
          <div class="topic-hero-row">
            <div class="topic-hero-main">
              <div class="eyebrow">${t.count} questions · ${t.sections.length} sections</div>
              <h1>${escHtml(t.title)}</h1>
              <p>${escHtml(t.blurb)}</p>
            </div>
            <div class="ring-box glass">
              <svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" id="ringFg" cx="32" cy="32" r="26" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
              <div class="ring-txt"><b id="ringPct">${pct(l, t.count)}%</b><span id="ringTxt">${l} of ${t.count} learned</span></div>
            </div>
          </div>
          ${t.cheats.length ? `
          <div class="cheats glass" id="cheats" data-collapsed="${store.get('cheats-' + t.id, false)}">
            <div class="cheats-head">
              <h2>Quick revision · ${t.cheats.length} key points</h2>
              <button class="btn sm" type="button" id="cheatToggle">${store.get('cheats-' + t.id, false) ? 'Show' : 'Hide'}</button>
            </div>
            <ul class="cheats-list">${t.cheats.map((c) => `<li>${c}</li>`).join('')}</ul>
          </div>` : ''}
        </div>
      </section>
      <div class="toolbar">
        <div class="wrap"><div class="toolbar-inner glass">
          <div class="seg" role="group" aria-label="Level">
            ${['all', 'basic', 'mid', 'senior'].map((lv) => `<button type="button" data-level="${lv}" aria-pressed="${filters.level === lv}">${lv === 'all' ? 'All' : LEVEL[lv]}</button>`).join('')}
          </div>
          <button class="btn sm" type="button" id="fHot" aria-pressed="${filters.hot}">Asked often</button>
          <button class="btn sm" type="button" id="fLearned" aria-pressed="${filters.hideLearned}">Hide learned</button>
          <span class="spacer"></span>
          <button class="btn sm" type="button" id="quiz">Quiz me</button>
          <button class="btn sm" type="button" id="expandAll">Expand all</button>
          <span class="showing" id="showing"></span>
        </div></div>
      </div>
      <div class="wrap topic-body">
        <aside class="toc glass" aria-label="Sections">
          <h3>Sections</h3>
          ${t.sections.map((s, si) => `<a href="#" data-sec="sec-${si}">${escHtml(s.title)}<span>${s.qs.length}</span></a>`).join('')}
        </aside>
        <div class="topic-main">
          ${t.sections.map((s, si) => `
            <section class="sec" id="sec-${si}">
              <div class="sec-head"><h2>${escHtml(s.title)}</h2><span class="n">${s.qs.length} Q</span></div>
              ${s.intro ? `<div class="sec-intro prose">${s.intro}</div>` : ''}
              <div class="qlist">${s.qs.map((q) => qCard(q, i++, t, false)).join('')}</div>
            </section>`).join('')}
        </div>
      </div>`;
    animateIn();
    requestAnimationFrame(() => updateRing(t));
    bindTopic(t);
    applyFilters();
  }

  function updateRing(t) {
    const fg = $('#ringFg');
    if (!fg) return;
    const l = learnedIn(t);
    const C = 2 * Math.PI * 26;
    fg.style.strokeDashoffset = String(C - (C * l) / t.count);
    $('#ringPct').textContent = pct(l, t.count) + '%';
    $('#ringTxt').textContent = `${l} of ${t.count} learned`;
  }

  function bindTopic(t) {
    const ct = $('#cheatToggle');
    if (ct) ct.addEventListener('click', () => {
      const box = $('#cheats');
      const col = box.dataset.collapsed !== 'true';
      box.dataset.collapsed = String(col);
      ct.textContent = col ? 'Show' : 'Hide';
      store.set('cheats-' + t.id, col);
    });
    $$('.seg button').forEach((b) =>
      b.addEventListener('click', () => {
        filters.level = b.dataset.level;
        $$('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        saveFilters();
        applyFilters();
      })
    );
    const toggleBtn = (id, key) => {
      const b = $(id);
      b.addEventListener('click', () => {
        filters[key] = !filters[key];
        b.setAttribute('aria-pressed', String(filters[key]));
        saveFilters();
        applyFilters();
      });
    };
    toggleBtn('#fHot', 'hot');
    toggleBtn('#fLearned', 'hideLearned');
    $('#expandAll').addEventListener('click', (e) => {
      const visible = $$('.qa', view).filter((a) => !a.hidden);
      const anyClosed = visible.some((a) => !a.classList.contains('open'));
      visible.forEach((a) => setOpen(a, anyClosed));
      e.currentTarget.textContent = anyClosed ? 'Collapse all' : 'Expand all';
    });
    $('#quiz').addEventListener('click', () => {
      const pool = $$('.qa', view).filter((a) => !a.hidden && !learned.has(a.dataset.id));
      const list = pool.length ? pool : $$('.qa', view).filter((a) => !a.hidden);
      if (!list.length) return toast('No questions match the filters');
      $$('.qa.open', view).forEach((a) => setOpen(a, false));
      const pick = list[Math.floor(Math.random() * list.length)];
      openQuestion(pick.dataset.id, true);
    });
    // TOC
    $$('.toc a').forEach((a) =>
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const s = document.getElementById(a.dataset.sec);
        if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' });
      })
    );
    if ('IntersectionObserver' in window) {
      const links = $$('.toc a');
      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((en) => {
            if (en.isIntersecting) {
              links.forEach((l) => l.classList.toggle('active', l.dataset.sec === en.target.id));
            }
          });
        },
        { rootMargin: '-30% 0px -60% 0px' }
      );
      $$('.sec', view).forEach((s) => io.observe(s));
    }
  }

  function applyFilters() {
    let shown = 0;
    let total = 0;
    $$('.sec', view).forEach((sec) => {
      let vis = 0;
      $$('.qa', sec).forEach((a) => {
        total++;
        const ok =
          (filters.level === 'all' || a.dataset.level === filters.level) &&
          (!filters.hot || a.dataset.hot === '1') &&
          (!filters.hideLearned || !learned.has(a.dataset.id) || a.classList.contains('open'));
        a.hidden = !ok;
        if (ok) vis++;
      });
      sec.hidden = vis === 0;
      shown += vis;
      const link = $(`.toc a[data-sec="${sec.id}"]`);
      if (link) link.hidden = vis === 0;
    });
    const s = $('#showing');
    if (s) s.textContent = shown === total ? `${total} questions` : `Showing ${shown} of ${total}`;
  }

  /* ---------------- question open / learned ---------------- */
  function fillAnswer(article) {
    const inner = $('.qa-inner', article);
    if (inner.firstChild) return;
    const { q } = QINDEX[article.dataset.id];
    const isL = learned.has(q.id);
    inner.innerHTML = `<div class="qa-content"><div class="prose">${q.a}</div>
      <div class="qa-foot">
        <button class="btn sm learn-btn" type="button" aria-pressed="${isL}">${isL ? '✓ Learned' : 'Mark as learned'}</button>
        <button class="btn sm next-btn" type="button">Next question ↓</button>
      </div></div>`;
    if (window.hljs) $$('pre code', inner).forEach((c) => { try { window.hljs.highlightElement(c); } catch (e) { /* ignore */ } });
  }

  function setOpen(article, open) {
    if (open) fillAnswer(article);
    article.classList.toggle('open', open);
    $('.qa-head', article).setAttribute('aria-expanded', String(open));
  }

  function openQuestion(id, scroll) {
    const a = document.getElementById(id);
    if (!a) return;
    if (a.hidden) {
      filters.level = 'all'; filters.hot = false; filters.hideLearned = false;
      $$('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.level === 'all')));
      ['#fHot', '#fLearned'].forEach((s) => $(s) && $(s).setAttribute('aria-pressed', 'false'));
      saveFilters();
      applyFilters();
    }
    setOpen(a, true);
    if (scroll) {
      setTimeout(() => {
        a.scrollIntoView({ behavior: 'smooth', block: 'start' });
        a.classList.remove('flash');
        void a.offsetWidth;
        a.classList.add('flash');
      }, 60);
    }
  }

  function toggleLearned(article) {
    const id = article.dataset.id;
    const now = !learned.has(id);
    if (now) learned.add(id); else learned.delete(id);
    saveLearned();
    article.classList.toggle('learned', now);
    const b = $('.learn-btn', article);
    if (b) { b.setAttribute('aria-pressed', String(now)); b.textContent = now ? '✓ Learned' : 'Mark as learned'; }
    const chips = $('.qa-chips', article);
    const done = $('.chip.done', chips);
    if (now && !done) chips.insertAdjacentHTML('beforeend', '<span class="chip done">Learned</span>');
    if (!now && done) done.remove();
    if (current.name === 'topic') updateRing(current.topic);
    toast(now ? 'Marked as learned' : 'Moved back to revise');
  }

  view.addEventListener('click', (e) => {
    const head = e.target.closest('.qa-head');
    if (head) {
      const a = head.closest('.qa');
      const open = !a.classList.contains('open');
      setOpen(a, open);
      if (open && history.replaceState) {
        try { history.replaceState(null, '', '#' + a.dataset.id); } catch (err) { /* ignore */ }
      }
      return;
    }
    const lb = e.target.closest('.learn-btn');
    if (lb) return toggleLearned(lb.closest('.qa'));
    const nb = e.target.closest('.next-btn');
    if (nb) {
      const a = nb.closest('.qa');
      const all = $$('.qa', view).filter((x) => !x.hidden);
      const next = all[all.indexOf(a) + 1];
      setOpen(a, false);
      if (next) openQuestion(next.id, true);
      else toast('That was the last question here');
      return;
    }
    const cp = e.target.closest('.copy');
    if (cp) {
      const code = cp.closest('.code').querySelector('code').innerText;
      const done = () => { cp.textContent = 'Copied'; setTimeout(() => (cp.textContent = 'Copy'), 1400); };
      try {
        navigator.clipboard.writeText(code).then(done, () => selectCode(cp));
      } catch (err) { selectCode(cp); }
    }
  });
  function selectCode(btn) {
    const el = btn.closest('.code').querySelector('code');
    const r = document.createRange();
    r.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
    toast('Selected — press Ctrl+C to copy');
  }

  /* ---------------- search ---------------- */
  const searchInput = $('#search');
  let searchTimer;
  let preSearchHash = '';
  function clearSearch() {
    if (searchInput.value) searchInput.value = '';
  }
  function highlight(html, terms) {
    // highlight only in text nodes of the (already escaped) question HTML
    return html.replace(/(^|>)([^<]+)/g, (m, a, txt) => {
      let out = txt;
      terms.forEach((term) => {
        const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
        out = out.replace(re, '<mark>$1</mark>');
      });
      return a + out;
    });
  }
  function renderSearch(query) {
    const terms = query.toLowerCase().split(/\s+/).filter((w) => w.length > 1);
    if (!terms.length) return;
    current = { name: 'search' };
    root.style.removeProperty('--t');
    markTab('__none');
    const results = [];
    TOPICS.forEach((t) =>
      t.sections.forEach((s) =>
        s.qs.forEach((q) => {
          const ql = q.q.toLowerCase();
          let score = 0;
          for (const term of terms) {
            if (ql.includes(term)) score += 5;
            else if (q.t.includes(term)) score += 1;
            else { score = 0; break; }
          }
          if (t.title.toLowerCase().includes(terms[0])) score += 1;
          if (score) results.push({ q, t, score });
        })
      )
    );
    results.sort((a, b) => b.score - a.score);
    const top = results.slice(0, 80);
    let i = 0;
    const groups = [];
    TOPICS.forEach((t) => {
      const rs = top.filter((r) => r.t === t);
      if (rs.length) groups.push({ t, rs });
    });
    groups.sort((a, b) => b.rs[0].score - a.rs[0].score);
    view.innerHTML = `
      <div class="wrap search-head">
        <div class="eyebrow">Search</div>
        <h1>“${escHtml(query)}”</h1>
        <div class="muted">${results.length} matching question${results.length === 1 ? '' : 's'}${results.length > 80 ? ' · showing the best 80' : ''}</div>
      </div>
      <div class="wrap">
        ${top.length ? `<div class="search-results">
          ${groups.map((g) => `<div class="result-topic">${escHtml(g.t.title)} · ${g.rs.length}</div>` +
            g.rs.map((r) => qCard(Object.assign({}, r.q, { qh: highlight(r.q.qh, terms) }), i++, r.t, true)).join('')).join('')}
        </div>` : `<div class="empty glass"><b>No questions match</b>Try a shorter word, like “event loop”, “queue” or “webhook”.</div>`}
      </div>`;
    animateIn();
  }
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const v = searchInput.value.trim();
      if (v.length >= 2) {
        if (current.name !== 'search') preSearchHash = location.hash;
        renderSearch(v);
        window.scrollTo(0, 0);
      } else if (current.name === 'search') {
        route();
      }
    }, 160);
  });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      searchInput.value = '';
      searchInput.blur();
      if (current.name === 'search') route();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== searchInput && !/input|textarea/i.test(document.activeElement.tagName)) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  /* ---------------- scroll: progress bar + back to top ---------------- */
  const readBar = $('#readBar');
  const toTop = $('#toTop');
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      readBar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
      toTop.hidden = window.scrollY < 700;
      ticking = false;
    });
  }, { passive: true });
  toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  /* ---------------- boot ---------------- */
  $('#qTotal').textContent = TOTAL;
  renderTabs();
  measureHeader();
  window.addEventListener('hashchange', () => {
    if (current.name === 'search') clearSearch();
    route();
  });
  route();
  window.addEventListener('resize', () => {
    const active = $('.tab[aria-selected="true"]', tabsEl);
    if (active) markTab(active.dataset.route);
  });
})();

</script>
